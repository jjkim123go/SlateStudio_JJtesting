[project]
name = "slate"
version = "0.1.0"
description = "Agentic content production engine for the enterprise"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "rich>=13.0",
    "Pillow>=10.0",
    "openai>=1.0",
    "azure-identity>=1.14",
    "azure-cognitiveservices-speech>=1.41",
]

[project.scripts]
slate = "slate.cli:main"

[project.urls]
Repository = "https://github.com/gim-home/SlateStudio"
"OpenMontage upstream" = "https://github.com/calesthio/OpenMontage"
"OpenMontage lineage" = "https://github.com/gim-home/SlateStudio/blob/main/docs/OPENMONTAGE_LINEAGE.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
