<!--
  OKRStatus
  Purpose: PM / EM OKR progress snapshot with cascading KR cards or compact stacked bars.
  Props consumed: objective, owner, timeframe, status, keyResults[], confidenceNote, themeMode, keyResultsJson
-->
<style>
.scene-{{sceneId}} .okr-root{
  --okr-bg:#071225;
  --okr-bg-accent:#13284b;
  --okr-panel:rgba(10,20,38,0.88);
  --okr-panel-strong:rgba(16,31,56,0.94);
  --okr-border:rgba(148,163,184,0.16);
  --okr-text:#f8fafc;
  --okr-muted:#94a3b8;
  --okr-track:rgba(148,163,184,0.16);
  --okr-fill-start:#38bdf8;
  --okr-fill-end:#22c55e;
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:52px 62px;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 12%, rgba(56,189,248,0.16), transparent 28%),
    radial-gradient(circle at 84% 18%, rgba(59,130,246,0.18), transparent 26%),
    linear-gradient(150deg, var(--okr-bg) 0%, #0f1f37 52%, var(--okr-bg-accent) 100%);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--okr-text);
}
.scene-{{sceneId}} .okr-shell{
  width:100%;
  max-width:1560px;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:28px;
}
.scene-{{sceneId}} .okr-header{
  display:grid;
  gap:14px;
  padding:28px 34px;
  border-radius:32px;
  background:linear-gradient(180deg, rgba(15,23,42,0.7), rgba(15,23,42,0.46));
  border:1px solid var(--okr-border);
  box-shadow:0 22px 56px rgba(2,6,23,0.34);
}
.scene-{{sceneId}} .okr-meta-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
}
.scene-{{sceneId}} .okr-meta{
  display:flex;
  flex-wrap:wrap;
  gap:12px 16px;
  align-items:center;
}
.scene-{{sceneId}} .okr-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(148,163,184,0.14);
  background:rgba(15,23,42,0.48);
  color:var(--okr-muted);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.03em;
}
.scene-{{sceneId}} .okr-pill-label{
  text-transform:uppercase;
  letter-spacing:0.1em;
  font-size:11px;
  color:rgba(226,232,240,0.55);
}
.scene-{{sceneId}} .okr-objective{
  margin:0;
  font-size:64px;
  line-height:1.02;
  letter-spacing:-0.05em;
  font-weight:800;
  max-width:1180px;
}
.scene-{{sceneId}} .okr-supporting{
  display:grid;
  gap:10px;
}
.scene-{{sceneId}} .okr-timeframe-line{
  margin:0;
  font-size:22px;
  line-height:1.35;
  color:rgba(226,232,240,0.84);
}
.scene-{{sceneId}} .okr-timeframe-line strong{
  font-weight:700;
  color:var(--okr-text);
}
.scene-{{sceneId}} .okr-confidence-note{
  margin:0;
  max-width:1160px;
  font-size:18px;
  line-height:1.55;
  color:var(--okr-muted);
}
.scene-{{sceneId}} .okr-confidence-note:empty{
  display:none;
}
.scene-{{sceneId}} .okr-status-chip{
  --okr-status-bg:rgba(100,116,139,0.18);
  --okr-status-fg:#e2e8f0;
  --okr-status-shadow:rgba(148,163,184,0.18);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:8px 16px;
  border-radius:999px;
  border:1px solid color-mix(in srgb, var(--okr-status-fg) 26%, transparent);
  background:var(--okr-status-bg);
  color:var(--okr-status-fg);
  font-size:13px;
  font-weight:800;
  letter-spacing:0.12em;
  text-transform:uppercase;
  box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 0 0 rgba(0,0,0,0);
  white-space:nowrap;
}
.scene-{{sceneId}} .okr-status-chip:empty{
  display:none;
}
.scene-{{sceneId}} .okr-status-chip--on-track{
  --okr-status-bg:rgba(34,197,94,0.14);
  --okr-status-fg:#86efac;
  --okr-status-shadow:rgba(34,197,94,0.22);
}
.scene-{{sceneId}} .okr-status-chip--at-risk{
  --okr-status-bg:rgba(245,158,11,0.14);
  --okr-status-fg:#fcd34d;
  --okr-status-shadow:rgba(245,158,11,0.24);
}
.scene-{{sceneId}} .okr-status-chip--off-track{
  --okr-status-bg:rgba(248,113,113,0.14);
  --okr-status-fg:#fca5a5;
  --okr-status-shadow:rgba(248,113,113,0.24);
}
.scene-{{sceneId}} .okr-kr-list{
  display:grid;
  gap:18px;
}
.scene-{{sceneId}} .okr-kr{
  position:relative;
  display:grid;
  gap:18px;
  padding:24px 26px 22px;
  border-radius:28px;
  background:linear-gradient(180deg, rgba(15,23,42,0.84), rgba(15,23,42,0.72));
  border:1px solid var(--okr-border);
  box-shadow:0 16px 44px rgba(2,6,23,0.28);
  overflow:hidden;
}
.scene-{{sceneId}} .okr-kr::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:linear-gradient(180deg, rgba(56,189,248,0.92), rgba(34,197,94,0.75));
  opacity:0.92;
}
.scene-{{sceneId}} .okr-kr[data-kr-status="at-risk"]::before{
  background:linear-gradient(180deg, rgba(251,191,36,0.95), rgba(245,158,11,0.8));
}
.scene-{{sceneId}} .okr-kr[data-kr-status="off-track"]::before{
  background:linear-gradient(180deg, rgba(252,165,165,0.95), rgba(248,113,113,0.82));
}
.scene-{{sceneId}} .okr-kr-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:16px;
  align-items:start;
}
.scene-{{sceneId}} .okr-kr-eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(148,163,184,0.82);
  margin-bottom:8px;
}
.scene-{{sceneId}} .okr-kr-title{
  margin:0;
  font-size:28px;
  line-height:1.18;
  letter-spacing:-0.03em;
  font-weight:760;
}
.scene-{{sceneId}} .okr-kr-summary{
  display:grid;
  justify-items:end;
  gap:10px;
}
.scene-{{sceneId}} .okr-progress-pill{
  min-width:108px;
  padding:11px 14px;
  border-radius:18px;
  background:rgba(15,23,42,0.56);
  border:1px solid rgba(148,163,184,0.14);
  text-align:center;
}
.scene-{{sceneId}} .okr-progress-value{
  display:block;
  font-size:30px;
  line-height:1;
  font-weight:820;
  letter-spacing:-0.04em;
  font-variant-numeric:tabular-nums;
}
.scene-{{sceneId}} .okr-kr-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.scene-{{sceneId}} .okr-metric{
  display:grid;
  gap:6px;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(15,23,42,0.4);
  border:1px solid rgba(148,163,184,0.1);
}
.scene-{{sceneId}} .okr-metric-label{
  font-size:12px;
  font-weight:750;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:rgba(148,163,184,0.86);
}
.scene-{{sceneId}} .okr-metric-value{
  font-size:24px;
  line-height:1.1;
  font-weight:780;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.03em;
}
.scene-{{sceneId}} .okr-bar-track{
  position:relative;
  width:100%;
  height:18px;
  overflow:hidden;
  border-radius:999px;
  background:var(--okr-track);
}
.scene-{{sceneId}} .okr-bar-fill{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg, var(--okr-fill-start), var(--okr-fill-end));
  box-shadow:0 0 24px rgba(56,189,248,0.28);
}
.scene-{{sceneId}} .okr-sparkline-wrap{
  display:grid;
  gap:8px;
}
.scene-{{sceneId}} .okr-sparkline-wrap[hidden],
.scene-{{sceneId}} .okr-sparkline-wrap--empty{
  display:none;
}
.scene-{{sceneId}} .okr-sparkline{
  width:100%;
  height:40px;
  display:block;
}
.scene-{{sceneId}} .okr-sparkline-track{
  fill:none;
  stroke:rgba(148,163,184,0.24);
  stroke-width:1.5;
}
.scene-{{sceneId}} .okr-sparkline-line{
  fill:none;
  stroke-width:3.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.scene-{{sceneId}} .okr-sparkline-dot{
  fill:#f8fafc;
  stroke:rgba(56,189,248,0.68);
  stroke-width:2;
}
.scene-{{sceneId}} .okr-commentary{
  margin:0;
  font-size:16px;
  line-height:1.52;
  color:var(--okr-muted);
}
.scene-{{sceneId}} .okr-commentary--empty:empty{
  display:none;
}

.scene-{{sceneId}} .okr-root--stacked-bars .okr-shell{
  gap:22px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-header{
  padding:24px 28px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-objective{
  font-size:54px;
  max-width:1320px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr-list{
  gap:14px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr{
  grid-template-columns:minmax(0,1.2fr) minmax(0,0.9fr) auto;
  align-items:center;
  gap:16px;
  padding:18px 22px;
  border-radius:22px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr-head{
  grid-template-columns:minmax(0,1fr);
  gap:8px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr-summary{
  justify-items:start;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-progress-pill{
  min-width:96px;
  padding:9px 12px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-progress-value{
  font-size:26px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr-title{
  font-size:24px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-kr-metrics{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-metric{
  padding:10px 12px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-metric-value{
  font-size:19px;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-sparkline-wrap{
  display:none;
}
.scene-{{sceneId}} .okr-root--stacked-bars .okr-commentary{
  display:none;
}

.scene-{{sceneId}} .okr-root--cards .okr-kr-list,
.scene-{{sceneId}} .okr-root:not(.okr-root--stacked-bars) .okr-kr-list{
  gap:18px;
}
</style>

<div class="okr-root"
     data-scene-component="OKRStatus"
     data-theme-mode="{{themeMode}}"
     data-status="{{status}}">
  <div class="okr-shell">
    <section class="okr-header">
      <div class="okr-meta-row">
        <div class="okr-meta">
          <div class="okr-pill">
            <span class="okr-pill-label">Owner</span>
            <span class="okr-owner">{{owner}}</span>
          </div>
          <div class="okr-pill">
            <span class="okr-pill-label">Window</span>
            <span class="okr-timeframe">{{timeframe}}</span>
          </div>
        </div>
        <span class="okr-status-chip" data-okr-overall-status>{{status}}</span>
      </div>
      <h1 class="okr-objective">{{objective}}</h1>
      <div class="okr-supporting">
        <p class="okr-timeframe-line"><strong>{{timeframe}}</strong> execution snapshot for <strong>{{owner}}</strong>.</p>
        <p class="okr-confidence-note">{{confidenceNote}}</p>
      </div>
    </section>

    <div class="okr-kr-list" data-section="keyResults" aria-label="Key results"></div>
  </div>

  <script type="application/json" id="okr-krs-data-{{sceneId}}">{{{keyResultsJson}}}</script>
</div>
