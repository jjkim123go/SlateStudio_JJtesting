<div class="ac-wrap" data-scene-component="AnimatedCaption"
  style="position:absolute;left:50%;{{position}}:120px;transform:translateX(-50%);text-align:center;width:80%;max-width:1400px">
  <div class="ac-text" style="display:inline-block;padding:18px 32px;background:rgba(0,0,0,0.72);border-radius:14px;font-size:{{fontSize}}px;font-weight:600;color:#FFFFFF;letter-spacing:-0.005em;line-height:1.25;backdrop-filter:blur(6px);opacity:0">{{text}}</div>
</div>
