<!--
  ComplianceBadgeWall
  Purpose: trust/certification grid (SOC 2, ISO 27001, HIPAA, FedRAMP, …) with
           optional spotlight badge, grouping, and footer text.
  Props consumed (all optional):
    title           string
    badgesJson      JSON string of [{id, name, iconSrc?, category?, detail?,
                    status?: "current"|"planned", regionScope?}]
    groupBy         "category" | "region" | "status"  (controls separator headers)
    spotlightBadgeId  string  (id of the badge to enlarge in the spotlight slot)
    footerText      string

  Compiler note (Lane C): the SCF author may pass `badges` and (optionally)
  `legend` as native arrays/objects. The compiler-side prop builder MUST
  JSON.stringify them into `badgesJson` before templating, mirroring how
  DataChart consumes `labels`/`series` strings. Until that shim lands, SCF
  authors pass a pre-stringified `badgesJson`.
-->
<style>
.scene-{{sceneId}} .cbw-root{
  --cbw-bg-from:#0b1120;
  --cbw-bg-to:#1e293b;
  --cbw-panel:rgba(15,23,42,0.55);
  --cbw-tile:rgba(255,255,255,0.04);
  --cbw-tile-border:rgba(148,163,184,0.18);
  --cbw-text:#f8fafc;
  --cbw-muted:rgba(226,232,240,0.62);
  --cbw-accent:#38bdf8;
  --cbw-accent-soft:rgba(56,189,248,0.18);
  --cbw-planned:#fbbf24;
  --cbw-separator:rgba(148,163,184,0.22);
  position:absolute;inset:0;padding:56px 72px 64px;
  display:flex;flex-direction:column;gap:32px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:radial-gradient(ellipse at top,var(--cbw-bg-to) 0%,var(--cbw-bg-from) 75%);
  color:var(--cbw-text);
}
.scene-{{sceneId}} .cbw-header{display:flex;flex-direction:column;gap:6px;opacity:0}
.scene-{{sceneId}} .cbw-title{margin:0;font-size:54px;font-weight:800;letter-spacing:-0.03em;line-height:1.04}
.scene-{{sceneId}} .cbw-title:empty{display:none}
.scene-{{sceneId}} .cbw-body{
  flex:1;min-height:0;display:flex;flex-direction:column;gap:28px;
}
.scene-{{sceneId}} .cbw-spotlight-wrap{
  display:flex;justify-content:center;align-items:center;
  min-height:0;
}
.scene-{{sceneId}} .cbw-spotlight{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:24px 32px;border-radius:28px;
  background:var(--cbw-panel);border:1px solid var(--cbw-accent-soft);
  box-shadow:0 0 0 8px rgba(56,189,248,0.06),0 28px 64px rgba(2,6,23,0.55);
  opacity:0;transform:scale(0.86);
}
.scene-{{sceneId}} .cbw-spotlight-icon{
  width:160px;height:160px;border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(56,189,248,0.12);border:1px solid var(--cbw-accent-soft);
  font-size:48px;font-weight:800;color:var(--cbw-accent);letter-spacing:-0.04em;
}
.scene-{{sceneId}} .cbw-spotlight-icon img{width:100%;height:100%;object-fit:contain;border-radius:18px}
.scene-{{sceneId}} .cbw-spotlight-name{font-size:34px;font-weight:700;letter-spacing:-0.02em}
.scene-{{sceneId}} .cbw-spotlight-detail{font-size:20px;color:var(--cbw-muted);max-width:680px;text-align:center;line-height:1.4}
.scene-{{sceneId}} .cbw-spotlight-detail:empty{display:none}
.scene-{{sceneId}} .cbw-group{display:flex;flex-direction:column;gap:14px}
.scene-{{sceneId}} .cbw-group-header{
  display:flex;align-items:center;gap:14px;
  font-size:14px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--cbw-muted);
  opacity:0;
}
.scene-{{sceneId}} .cbw-group-rule{
  flex:1;height:1px;background:var(--cbw-separator);
  transform:scaleX(0);transform-origin:left center;
}
.scene-{{sceneId}} .cbw-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
}
.scene-{{sceneId}} .cbw-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px 14px;border-radius:18px;
  background:var(--cbw-tile);border:1px solid var(--cbw-tile-border);
  text-align:center;min-height:150px;
  opacity:0;transform:scale(0.7);
}
.scene-{{sceneId}} .cbw-tile[data-status="planned"]{
  border-style:dashed;border-color:rgba(251,191,36,0.45);
}
.scene-{{sceneId}} .cbw-tile-icon{
  width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(56,189,248,0.10);
  font-size:20px;font-weight:800;color:var(--cbw-accent);letter-spacing:-0.02em;
}
.scene-{{sceneId}} .cbw-tile[data-status="planned"] .cbw-tile-icon{
  background:rgba(251,191,36,0.10);color:var(--cbw-planned);
}
.scene-{{sceneId}} .cbw-tile-icon img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.scene-{{sceneId}} .cbw-tile-name{font-size:18px;font-weight:700;letter-spacing:-0.01em;line-height:1.18}
.scene-{{sceneId}} .cbw-tile-meta{font-size:13px;color:var(--cbw-muted);line-height:1.3}
.scene-{{sceneId}} .cbw-tile-meta:empty{display:none}
.scene-{{sceneId}} .cbw-tile-status{
  font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  color:var(--cbw-planned);background:rgba(251,191,36,0.12);
}
.scene-{{sceneId}} .cbw-footer{
  margin-top:auto;font-size:18px;color:var(--cbw-muted);text-align:center;
  opacity:0;
}
.scene-{{sceneId}} .cbw-footer:empty{display:none}
.scene-{{sceneId}} .cbw-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--cbw-muted);font-size:18px;
}
</style>
<div class="cbw-root" data-scene-component="ComplianceBadgeWall"
  data-cbw-badges="{{badgesJson}}"
  data-cbw-group-by="{{groupBy}}"
  data-cbw-spotlight="{{spotlightBadgeId}}">
  <header class="cbw-header">
    <h2 class="cbw-title">{{title}}</h2>
  </header>
  <div class="cbw-body">
    <div class="cbw-spotlight-wrap"></div>
    <div class="cbw-groups"></div>
  </div>
  <div class="cbw-footer">{{footerText}}</div>
  {{{_lottieDataIslands}}}
</div>
