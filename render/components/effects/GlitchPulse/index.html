<style>
.scene-{{sceneId}} .gp-root{
  --gp-color-1:{{color1}};
  --gp-color-2:{{color2}};
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  isolation:isolate;
}
.scene-{{sceneId}} .gp-channel,
.scene-{{sceneId}} .gp-noise,
.scene-{{sceneId}} .gp-scan,
.scene-{{sceneId}} .gp-scanlines{
  position:absolute;
  inset:0;
  opacity:0;
  will-change:transform,opacity,filter,clip-path;
}
.scene-{{sceneId}} .gp-channel{
  transform:translateX(0);
}
.scene-{{sceneId}} .gp-shell{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.scene-{{sceneId}} .gp-shell > *{
  pointer-events:none !important;
}
.scene-{{sceneId}} .gp-channel--base{
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-channel--c1{
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-channel--c2{
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-tint{
  position:absolute;
  inset:0;
  opacity:0.68;
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-channel--c1 .gp-tint{
  background:var(--gp-color-1, #00e5ff);
}
.scene-{{sceneId}} .gp-channel--c2 .gp-tint{
  background:var(--gp-color-2, #ff3ad8);
}
.scene-{{sceneId}} .gp-channel--base .gp-tint{
  background:rgba(255,255,255,0.22);
}
.scene-{{sceneId}} .gp-noise{
  background-image:
    linear-gradient(transparent 0%, rgba(255,255,255,0.18) 48%, transparent 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.2) 0 2px, transparent 2px 10px),
    repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 4px);
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-scan{
  background:linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.78) 46%, transparent 100%);
  mix-blend-mode:screen;
}
.scene-{{sceneId}} .gp-scanlines{
  background:repeating-linear-gradient(180deg, rgba(255,255,255,0.18) 0 1px, transparent 1px 4px);
  mix-blend-mode:overlay;
}
</style>
<div class="gp-root" data-scene-component="GlitchPulse"
  data-gp-trigger-sec="{{triggerSec}}"
  data-gp-intensity="{{intensity}}"
  data-gp-color-1="{{color1}}"
  data-gp-color-2="{{color2}}">
  <div class="gp-channel gp-channel--base"><div class="gp-shell"></div><div class="gp-tint"></div></div>
  <div class="gp-channel gp-channel--c1"><div class="gp-shell"></div><div class="gp-tint"></div></div>
  <div class="gp-channel gp-channel--c2"><div class="gp-shell"></div><div class="gp-tint"></div></div>
  <div class="gp-noise"></div>
  <div class="gp-scan"></div>
  <div class="gp-scanlines"></div>
</div>
