<!--
  PolicyEnforcement
  Purpose: Visualise a request → check pipeline → decision gate with outcome badge.
  Props consumed: title, requestHtml, checksHtml, decisionHtml, ruleCitationHtml, auditRefHtml, layout
  Provenance: proposal lines 454-466, CONTRACT §3.1/§3.3 Pattern B
-->
<style>
.scene-{{sceneId}} .pe-root{
  --pe-bg:#0f172a;--pe-bg-end:#1e293b;
  --pe-card-bg:rgba(30,41,59,0.9);--pe-card-border:rgba(148,163,184,0.18);
  --pe-text:#e2e8f0;--pe-muted:#94a3b8;
  --pe-accent:#3b82f6;
  --pe-pass:#22c55e;--pe-fail:#ef4444;--pe-warn:#f59e0b;--pe-skip:#6b7280;
  --pe-allow:#22c55e;--pe-deny:#ef4444;--pe-challenge:#f59e0b;--pe-redact:#a855f7;
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,var(--pe-bg) 0%,var(--pe-bg-end) 100%);
  color:var(--pe-text);padding:48px 72px 36px;overflow:hidden;
}
.scene-{{sceneId}} .pe-title{
  margin:0 0 24px;font-size:44px;font-weight:700;
  letter-spacing:-0.02em;opacity:0;color:var(--pe-text);
}
.scene-{{sceneId}} .pe-title:empty{display:none}
.scene-{{sceneId}} .pe-flow{flex:1;display:flex;flex-direction:column;gap:18px;overflow:hidden}
/* -- Request section -- */
.scene-{{sceneId}} .pe-request{
  padding:16px 22px;background:var(--pe-card-bg);
  border:1px solid var(--pe-card-border);border-radius:14px;
  max-width:600px;opacity:0;
}
.scene-{{sceneId}} .pe-request-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--pe-muted);margin-bottom:6px;
}
.scene-{{sceneId}} .pe-request-body{font-size:18px;font-weight:500;line-height:1.4}
.scene-{{sceneId}} .pe-actor{color:var(--pe-accent);font-weight:600}
.scene-{{sceneId}} .pe-resource{color:var(--pe-text);font-weight:600}
.scene-{{sceneId}} .pe-request:empty{display:none}
/* -- Connector line -- */
.scene-{{sceneId}} .pe-connector{
  width:2px;height:18px;margin-left:40px;background:var(--pe-accent);
  border-radius:2px;opacity:0;
}
/* -- Checks pipeline -- */
.scene-{{sceneId}} .pe-checks-wrap{display:flex;flex-direction:column;gap:6px}
.scene-{{sceneId}} .pe-root[data-layout="decision-tree"] .pe-checks-wrap{
  flex-direction:row;gap:12px;flex-wrap:wrap;
}
.scene-{{sceneId}} .pe-check{
  display:flex;align-items:center;gap:12px;
  padding:10px 18px;border-radius:10px;
  background:var(--pe-card-bg);border:1px solid var(--pe-card-border);
  opacity:0;
}
.scene-{{sceneId}} .pe-root[data-layout="decision-tree"] .pe-check{
  flex:1;min-width:220px;
}
.scene-{{sceneId}} .pe-stamp{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:16px;font-weight:700;flex-shrink:0;
}
.scene-{{sceneId}} .pe-stamp[data-outcome="pass"]{
  background:rgba(34,197,94,0.15);color:var(--pe-pass);
}
.scene-{{sceneId}} .pe-stamp[data-outcome="fail"]{
  background:rgba(239,68,68,0.15);color:var(--pe-fail);
}
.scene-{{sceneId}} .pe-stamp[data-outcome="warn"]{
  background:rgba(245,158,11,0.15);color:var(--pe-warn);
}
.scene-{{sceneId}} .pe-stamp[data-outcome="skip"]{
  background:rgba(107,114,128,0.15);color:var(--pe-skip);
}
.scene-{{sceneId}} .pe-check-name{font-size:17px;font-weight:500}
.scene-{{sceneId}} .pe-check-detail{font-size:13px;color:var(--pe-muted)}
.scene-{{sceneId}} .pe-check-detail:empty{display:none}
/* -- Decision gate -- */
.scene-{{sceneId}} .pe-decision{
  padding:18px 28px;border-radius:14px;
  display:flex;align-items:center;gap:16px;opacity:0;
}
.scene-{{sceneId}} .pe-decision[data-decision="allow"]{
  background:rgba(34,197,94,0.12);border:2px solid var(--pe-allow);
}
.scene-{{sceneId}} .pe-decision[data-decision="deny"]{
  background:rgba(239,68,68,0.12);border:2px solid var(--pe-deny);
}
.scene-{{sceneId}} .pe-decision[data-decision="challenge"]{
  background:rgba(245,158,11,0.12);border:2px solid var(--pe-challenge);
}
.scene-{{sceneId}} .pe-decision[data-decision="redact"]{
  background:rgba(168,85,247,0.12);border:2px solid var(--pe-redact);
}
.scene-{{sceneId}} .pe-decision-icon{font-size:32px}
.scene-{{sceneId}} .pe-decision-text{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.scene-{{sceneId}} .pe-decision-reason{font-size:15px;color:var(--pe-muted);line-height:1.3}
.scene-{{sceneId}} .pe-decision-reason:empty{display:none}
.scene-{{sceneId}} .pe-decision:empty{display:none}
/* -- Chips -- */
.scene-{{sceneId}} .pe-chips{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;
}
.scene-{{sceneId}} .pe-chip{
  font-size:12px;padding:4px 12px;border-radius:999px;
  background:rgba(148,163,184,0.1);color:var(--pe-muted);opacity:0;
}
.scene-{{sceneId}} .pe-citation{
  font-family:'Cascadia Code',Consolas,monospace;font-size:11px;color:var(--pe-accent);
  position:absolute;top:48px;right:72px;opacity:0;
}
.scene-{{sceneId}} .pe-citation:empty{display:none}
</style>
<div class="pe-root" data-scene-component="PolicyEnforcement" data-layout="{{layout}}">
  <h2 class="pe-title">{{title}}</h2>
  <div class="pe-citation">{{{ruleCitationHtml}}}</div>
  <div class="pe-flow">
    <div class="pe-request">{{{requestHtml}}}</div>
    <div class="pe-connector"></div>
    <div class="pe-checks-wrap">{{{checksHtml}}}</div>
    <div class="pe-connector"></div>
    <div class="pe-decision">{{{decisionHtml}}}</div>
    <div class="pe-chips">{{{auditRefHtml}}}</div>
  </div>
</div>
