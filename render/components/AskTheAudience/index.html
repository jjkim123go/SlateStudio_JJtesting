<!--
  AskTheAudience — Live / closed poll results visualisation.
  Props: question, results (array → data island), responseCount,
         pollState, source, ctaNote, viz
  Data-island: ata-results-{{sceneId}}
  Class prefix: ata-
  Provenance: proposal §3.8 (Education + Event pack), Lane B PR 6
-->
<style>
.scene-{{sceneId}} .ata-root {
  position: absolute; inset: 0; overflow: hidden;
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #f8fafc;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

/* ── Header ─────────────────────── */
.scene-{{sceneId}} .ata-header {
  position: absolute; top: 6%; left: 8%; right: 8%; z-index: 2;
  display: flex; flex-direction: column; gap: 8px;
}
.scene-{{sceneId}} .ata-question {
  margin: 0; font-size: 48px; font-weight: 800;
  letter-spacing: -0.02em; line-height: 1.15; opacity: 0;
}
.scene-{{sceneId}} .ata-badges {
  display: flex; gap: 14px; align-items: center; opacity: 0;
}
.scene-{{sceneId}} .ata-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 12px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  background: rgba(255,255,255,0.08);
}
.scene-{{sceneId}} .ata-badge-dot {
  width: 8px; height: 8px; border-radius: 50%;
}

/* ── Body (bars / donut) ────────── */
.scene-{{sceneId}} .ata-body {
  position: absolute; top: 22%; left: 8%; right: 8%; bottom: 14%;
  z-index: 2; display: flex; flex-direction: column; justify-content: center;
}

/* Bars mode */
.scene-{{sceneId}} .ata-bars { display: flex; flex-direction: column; gap: 18px; }
.scene-{{sceneId}} .ata-bar-row {
  display: flex; align-items: center; gap: 14px;
}
.scene-{{sceneId}} .ata-bar-label {
  flex: 0 0 200px; text-align: right; font-size: 22px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.scene-{{sceneId}} .ata-bar-track {
  flex: 1; height: 38px; border-radius: 8px;
  background: rgba(255,255,255,0.06); overflow: hidden;
}
.scene-{{sceneId}} .ata-bar-fill {
  height: 100%; border-radius: 8px; width: 0;
  display: flex; align-items: center; justify-content: flex-end;
  padding: 0 12px; min-width: 0;
}
.scene-{{sceneId}} .ata-bar-pct {
  font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap;
}
.scene-{{sceneId}} .ata-bar-winner .ata-bar-fill {
  box-shadow: 0 0 24px rgba(255,255,255,0.3);
}

/* Donut mode */
.scene-{{sceneId}} .ata-donut-wrap {
  display: flex; justify-content: center; align-items: center;
  position: relative; width: 100%; height: 100%;
}
.scene-{{sceneId}} .ata-donut-svg {
  max-width: 420px; max-height: 420px;
}
.scene-{{sceneId}} .ata-donut-center {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; opacity: 0;
}
.scene-{{sceneId}} .ata-donut-count {
  font-size: 54px; font-weight: 900; line-height: 1;
}
.scene-{{sceneId}} .ata-donut-label {
  font-size: 16px; font-weight: 500; color: rgba(248,250,252,0.55);
  margin-top: 4px;
}
.scene-{{sceneId}} .ata-legend {
  display: flex; flex-wrap: wrap; gap: 10px 20px;
  justify-content: center; margin-top: 18px;
}
.scene-{{sceneId}} .ata-legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 15px; font-weight: 500; opacity: 0;
}
.scene-{{sceneId}} .ata-legend-swatch {
  width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
}

/* ── Footer ─────────────────────── */
.scene-{{sceneId}} .ata-footer {
  position: absolute; bottom: 4%; left: 8%; right: 8%; z-index: 2;
  display: flex; justify-content: space-between; align-items: flex-end;
}
.scene-{{sceneId}} .ata-response-count {
  font-size: 18px; font-weight: 600; color: rgba(248,250,252,0.55); opacity: 0;
}
.scene-{{sceneId}} .ata-cta {
  font-size: 16px; font-weight: 500; color: rgba(248,250,252,0.4); opacity: 0;
}

/* ── Empty state ────────────────── */
.scene-{{sceneId}} .ata-empty {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; gap: 12px; opacity: 0;
}
.scene-{{sceneId}} .ata-empty-msg {
  font-size: 22px; color: rgba(248,250,252,0.4); font-style: italic;
}
</style>

<div class="ata-root"
     data-scene-component="AskTheAudience"
     data-viz="{{viz}}"
     data-poll-state="{{pollState}}"
     data-source="{{source}}"
     data-response-count="{{responseCount}}">

  <!-- Header -->
  <div class="ata-header">
    <h1 class="ata-question">{{question}}</h1>
    <div class="ata-badges"></div>
  </div>

  <!-- Body (bars or donut built by animation.js) -->
  <div class="ata-body"></div>

  <!-- Footer -->
  <div class="ata-footer">
    <span class="ata-response-count"></span>
    <span class="ata-cta">{{ctaNote}}</span>
  </div>

  <!-- Empty state (shown when no results) -->
  <div class="ata-empty">
    <h1 class="ata-question">{{question}}</h1>
    <div class="ata-empty-msg">(awaiting responses)</div>
  </div>

  <script type="application/json" id="ata-results-{{sceneId}}">{{{resultsJson}}}</script>
</div>
