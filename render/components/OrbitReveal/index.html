<!--
  OrbitReveal — full-screen bridge transition. An illuminated point orbits
  outward in a logarithmic spiral, trailing brand-color particles. The
  incoming scene materializes inside a growing radial clip-path mask that
  tracks the spiral radius.

  Props consumed:
    direction    "clockwise" (default) | "counterclockwise"
    color        CSS color for the comet trail (default brand primary)
    trailCount   number of trailing particles (default 18)
    spiralTurns  number of full turns in the spiral (default 2.5)
-->
<style>
.scene-{{sceneId}} .or-root{position:absolute;inset:0;background:#000;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}

/* Incoming scene placeholder — revealed via clip-path circle() */
.scene-{{sceneId}} .or-reveal{position:absolute;inset:0;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 100%);clip-path:circle(0% at 50% 50%);will-change:clip-path}

/* Comet point */
.scene-{{sceneId}} .or-comet{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--or-color,#0078D4);box-shadow:0 0 16px 4px var(--or-color,#0078D4);left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform;filter:blur(0px)}

/* Trail particles */
.scene-{{sceneId}} .or-particle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--or-color,#0078D4);left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform,opacity;opacity:0}
</style>
<div class="or-root" data-scene-component="OrbitReveal" style="--or-color: {{color}}" data-direction="{{direction}}" data-trail-count="{{trailCount}}" data-spiral-turns="{{spiralTurns}}">
  <div class="or-reveal"></div>
  <div class="or-comet"></div>
  <!-- Trail particles are generated by animation.js -->
  <div class="or-trail"></div>
</div>
