<div class="ms-root" data-scene-component="MetricStack"
  data-metrics-json="{{metricsJson}}"
  data-accent-from="{{accentFrom}}"
  data-accent-to="{{accentTo}}"
  data-row-bg="{{rowBg}}"
  data-row-stroke="{{rowStroke}}"
  data-bg-from="{{bgFrom}}"
  data-bg-to="{{bgTo}}"
  data-panel-glow="{{panelGlow}}"
  data-panel-bg="{{panelBg}}"
  data-panel-stroke="{{panelStroke}}"
  style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%,rgba(56,189,248,0.10),transparent 50%),
    linear-gradient(135deg,#020617 0%,#0f172a 100%);
    font-family:Inter,-apple-system,sans-serif;color:#fff">
  <div class="ms-panel" style="width:78%;max-width:1320px;padding:54px 64px;border-radius:32px;
    background:rgba(15,23,42,0.62);border:1px solid rgba(148,163,184,0.18);
    box-shadow:0 32px 80px rgba(0,0,0,0.45);backdrop-filter:blur(18px);opacity:0">
    <h2 class="ms-title" style="margin:0 0 40px;font-size:56px;font-weight:700;line-height:1.1;
      letter-spacing:-0.03em;opacity:0">{{title}}</h2>
    <div class="ms-grid" style="display:flex;flex-direction:column;gap:20px">
      <!-- rows injected by animation.js from metricsJson -->
    </div>
  </div>
</div>
