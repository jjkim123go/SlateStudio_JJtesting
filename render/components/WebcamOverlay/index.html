<!--
  WebcamOverlay — picture-in-picture presenter bubble. Sits in a corner over
  another scene's content. Accepts an image OR a video src; the type is
  detected at runtime from the file extension.

  Props consumed:
    src              string (required) — image or video URL (auto-resolved by compiler)
    position         "top-left" | "top-right" | "bottom-left" | "bottom-right"
                     (default bottom-right)
    size             "sm" | "md" | "lg"  → 180 / 240 / 320 px (default md)
    shape            "circle" | "rounded"  (default circle)
    borderColor      CSS color (default brand primary)
    presenterName    string (optional)
    presenterTitle   string (optional)
-->
<style>
.scene-{{sceneId}} .wcam-bg{position:absolute;inset:0;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}

/* Position anchor — defaults to bottom-right */
.scene-{{sceneId}} .wcam-pos{position:absolute;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10}
.scene-{{sceneId}} .wcam-pos[data-position="top-left"]    {top:48px;left:48px}
.scene-{{sceneId}} .wcam-pos[data-position="top-right"]   {top:48px;right:48px}
.scene-{{sceneId}} .wcam-pos[data-position="bottom-left"] {bottom:48px;left:48px}
.scene-{{sceneId}} .wcam-pos[data-position="bottom-right"]{bottom:48px;right:48px}
.scene-{{sceneId}} .wcam-pos:not([data-position]),
.scene-{{sceneId}} .wcam-pos[data-position=""]            {bottom:48px;right:48px}

/* Frame — the GSAP-animated wrapper. Size/shape via data-attrs */
.scene-{{sceneId}} .wcam-frame{position:relative;overflow:hidden;background:#0f172a;box-shadow:0 18px 38px rgba(0,0,0,0.45);opacity:0;transform-origin:center}
.scene-{{sceneId}} .wcam-frame[data-size="sm"],
.scene-{{sceneId}} .wcam-frame[data-size="small"]{width:180px;height:180px}
.scene-{{sceneId}} .wcam-frame[data-size="md"],
.scene-{{sceneId}} .wcam-frame[data-size="medium"]{width:240px;height:240px}
.scene-{{sceneId}} .wcam-frame[data-size="lg"],
.scene-{{sceneId}} .wcam-frame[data-size="large"]{width:320px;height:320px}
.scene-{{sceneId}} .wcam-frame:not([data-size]),
.scene-{{sceneId}} .wcam-frame[data-size=""]{width:240px;height:240px}
.scene-{{sceneId}} .wcam-frame[data-shape="circle"] {border-radius:50%}
.scene-{{sceneId}} .wcam-frame[data-shape="rounded"]{border-radius:24px}
.scene-{{sceneId}} .wcam-frame:not([data-shape]),
.scene-{{sceneId}} .wcam-frame[data-shape=""]{border-radius:50%}

/* Media element — sized to fill the frame */
.scene-{{sceneId}} .wcam-img,
.scene-{{sceneId}} .wcam-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* Initially hide both; animation.js reveals the correct one */
.scene-{{sceneId}} .wcam-frame[data-media="image"] .wcam-vid{display:none}
.scene-{{sceneId}} .wcam-frame[data-media="video"] .wcam-img{display:none}
.scene-{{sceneId}} .wcam-frame:not([data-media]) .wcam-vid,
.scene-{{sceneId}} .wcam-frame:not([data-media]) .wcam-img{visibility:hidden}

/* Border ring — colored frame around the bubble */
.scene-{{sceneId}} .wcam-ring{position:absolute;inset:0;border:4px solid var(--wcam-border, #0078D4);box-shadow:inset 0 0 0 2px rgba(255,255,255,0.15);pointer-events:none}
.scene-{{sceneId}} .wcam-frame[data-shape="circle"]  .wcam-ring{border-radius:50%}
.scene-{{sceneId}} .wcam-frame[data-shape="rounded"] .wcam-ring{border-radius:24px}
.scene-{{sceneId}} .wcam-frame:not([data-shape]) .wcam-ring,
.scene-{{sceneId}} .wcam-frame[data-shape=""] .wcam-ring{border-radius:50%}

/* Presenter chip */
.scene-{{sceneId}} .wcam-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;background:rgba(15,23,42,0.85);backdrop-filter:blur(8px);border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,0.35);opacity:0;max-width:280px}
.scene-{{sceneId}} .wcam-chip:empty{display:none}
.scene-{{sceneId}} .wcam-name{margin:0;font-size:15px;font-weight:600;color:#fff;line-height:1.1;text-align:center}
.scene-{{sceneId}} .wcam-name:empty{display:none}
.scene-{{sceneId}} .wcam-title{margin:0;font-size:12px;font-weight:400;color:rgba(255,255,255,0.7);line-height:1.1;text-align:center}
.scene-{{sceneId}} .wcam-title:empty{display:none}
</style>
<div class="wcam-bg" data-scene-component="WebcamOverlay">
  <div class="wcam-pos" data-position="{{position}}">
    <div class="wcam-frame" data-size="{{size}}" data-shape="{{shape}}" style="--wcam-border: {{borderColor}}">
      <img class="wcam-img" alt=""/>
      <div class="wcam-ring"></div>
    </div>
    <div class="wcam-chip">
      <p class="wcam-name">{{presenterName}}</p>
      <p class="wcam-title">{{presenterTitle}}</p>
    </div>
  </div>
</div>
