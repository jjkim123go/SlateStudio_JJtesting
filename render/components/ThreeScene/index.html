<div class="three-scene" data-scene-component="ThreeScene"
  data-title="{{title}}"
  data-mode="{{mode}}"
  data-primary-color="{{primaryColor}}"
  data-accent-color="{{accentColor}}"
  data-seed="{{seed}}"
  style="position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 35%,rgba(139,92,246,0.16),transparent 42%),
    linear-gradient(135deg,#050816 0%,#120A1F 58%,#030712 100%);
    color:#F8F4EC;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;">
  <canvas class="three-canvas"
    style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div class="three-vignette"
    style="position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 50% 42%,transparent 0%,rgba(0,0,0,0.18) 58%,rgba(0,0,0,0.72) 100%);"></div>
  <div class="three-copy"
    style="position:absolute;left:96px;right:96px;bottom:88px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;opacity:0;">
    <h1 class="three-title"
      style="margin:0;max-width:960px;font-size:76px;line-height:0.95;letter-spacing:-0.055em;font-weight:780;">
      {{title}}
    </h1>
    <div class="three-label"
      style="padding:12px 18px;border:1px solid rgba(248,244,236,0.24);border-radius:999px;
        background:rgba(5,8,22,0.58);backdrop-filter:blur(16px);font-size:22px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(248,244,236,0.78);">
      {{mode}}
    </div>
  </div>
</div>
