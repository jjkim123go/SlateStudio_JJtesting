<div class="tc-bg" data-scene-component="TitleCard"
  style="position:absolute;inset:0;background:{{background}};background:linear-gradient(180deg, color-mix(in srgb, {{background}} 86%, #ffffff 14%) 0%, {{background}} 100%)">
  <div class="tc-stack" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:80%">
    <h1 class="tc-title" style="margin:0;font-size:96px;font-weight:700;color:{{textColor}};letter-spacing:-0.025em;line-height:1.05;opacity:0">{{title}}</h1>
    <p class="tc-subtitle" style="margin:24px 0 0;font-size:36px;font-weight:400;color:{{mutedTextColor}};opacity:0">{{subtitle}}</p>
  </div>
</div>
