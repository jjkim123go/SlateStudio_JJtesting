<div class="device-stage" data-scene-component="DeviceStage3D"
  data-title="{{title}}"
  data-subtitle="{{subtitle}}"
  data-mode="{{mode}}"
  data-screen-src="{{screenSrc}}"
  data-primary-color="{{primaryColor}}"
  data-accent-color="{{accentColor}}"
  data-seed="{{seed}}"
  style="position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 38%,rgba(139,92,246,0.16),transparent 44%),
    linear-gradient(135deg,#050816 0%,#120A1F 60%,#030712 100%);
    color:#F8F4EC;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;">
  <canvas class="device-canvas"
    style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div class="device-vignette"
    style="position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 50% 46%,transparent 0%,rgba(0,0,0,0.18) 60%,rgba(0,0,0,0.74) 100%);"></div>
  <div class="device-copy"
    style="position:absolute;left:96px;right:96px;bottom:88px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;opacity:0;">
    <div style="display:flex;flex-direction:column;gap:14px;max-width:1080px;">
      <div class="device-mode"
        style="font-size:18px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(248,244,236,0.62);">
        {{mode}}
      </div>
      <h1 class="device-title"
        style="margin:0;font-size:72px;line-height:0.96;letter-spacing:-0.05em;font-weight:780;">
        {{title}}
      </h1>
      <div class="device-subtitle"
        style="font-size:26px;line-height:1.32;color:rgba(248,244,236,0.78);max-width:820px;">
        {{subtitle}}
      </div>
    </div>
  </div>
</div>
