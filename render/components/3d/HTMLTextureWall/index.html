<div class="texture-wall" data-scene-component="HTMLTextureWall"
  data-title="{{title}}"
  data-mode="{{mode}}"
  data-cards-json="{{cardsJson}}"
  data-texture-srcs-json="{{textureSrcsJson}}"
  data-primary-color="{{primaryColor}}"
  data-accent-color="{{accentColor}}"
  data-seed="{{seed}}"
  style="position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 32%,rgba(231,215,162,0.10),transparent 48%),
    linear-gradient(140deg,#040712 0%,#0E0B22 55%,#020310 100%);
    color:#F8F4EC;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;">
  <canvas class="wall-canvas"
    style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div class="wall-vignette"
    style="position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 50% 50%,transparent 0%,rgba(0,0,0,0.15) 65%,rgba(0,0,0,0.78) 100%);"></div>
  <div class="wall-copy"
    style="position:absolute;left:96px;right:96px;top:72px;display:flex;align-items:flex-start;justify-content:space-between;gap:28px;opacity:0;">
    <h1 class="wall-title"
      style="margin:0;font-size:52px;line-height:1.02;letter-spacing:-0.04em;font-weight:740;max-width:1080px;">
      {{title}}
    </h1>
  </div>
</div>
