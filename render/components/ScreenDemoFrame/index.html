<!-- ScreenDemoFrame — wraps an image or video inside realistic device chrome
     Props: src, frameStyle, urlBar, windowTitle, theme, shadow, cornerRadius, scale, cursorPath -->
<style>
.scene-{{sceneId}} .sdf-root { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',-apple-system,'Helvetica Neue',sans-serif; }
.scene-{{sceneId}} .sdf-root[data-theme="light"],
.scene-{{sceneId}} .sdf-root[data-theme=""] { background:#e8e8ed; }
.scene-{{sceneId}} .sdf-root[data-theme="dark"] { background:#1a1a2e; }

/* Frame base */
.scene-{{sceneId}} .sdf-frame { display:flex;flex-direction:column;overflow:hidden;opacity:0;position:relative;border-radius:8px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="browser"] .sdf-frame,
.scene-{{sceneId}} .sdf-root[data-frame-style=""] .sdf-frame,
.scene-{{sceneId}} .sdf-root[data-frame-style="macos-window"] .sdf-frame { border-radius:{{cornerRadius}}px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-frame,
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-frame { border-radius:40px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-frame { border-radius:18px; }

/* Shadow (on unless explicitly false) */
.scene-{{sceneId}} .sdf-root[data-theme="light"]:not([data-shadow="false"]) .sdf-frame,
.scene-{{sceneId}} .sdf-root[data-theme=""]:not([data-shadow="false"]) .sdf-frame { box-shadow:0 25px 60px rgba(0,0,0,0.3),0 8px 20px rgba(0,0,0,0.15); }
.scene-{{sceneId}} .sdf-root[data-theme="dark"]:not([data-shadow="false"]) .sdf-frame { box-shadow:0 25px 60px rgba(0,0,0,0.6),0 8px 20px rgba(0,0,0,0.3); }

/* Frame sizing per style */
.scene-{{sceneId}} .sdf-root[data-frame-style="browser"] .sdf-frame,
.scene-{{sceneId}} .sdf-root[data-frame-style=""] .sdf-frame { width:1680px;height:960px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="macos-window"] .sdf-frame { width:1600px;height:920px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-frame { width:430px;height:932px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-frame { width:932px;height:430px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-frame { width:1194px;height:834px; }

/* Chrome visibility — all hidden by default */
.scene-{{sceneId}} .sdf-browser-chrome { display:none; }
.scene-{{sceneId}} .sdf-macos-chrome { display:none; }
.scene-{{sceneId}} .sdf-device-top { display:none; }
.scene-{{sceneId}} .sdf-device-bottom { display:none; }
.scene-{{sceneId}} .sdf-root[data-frame-style="browser"] .sdf-browser-chrome,
.scene-{{sceneId}} .sdf-root[data-frame-style=""] .sdf-browser-chrome { display:flex; }
.scene-{{sceneId}} .sdf-root[data-frame-style="macos-window"] .sdf-macos-chrome { display:flex; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-device-top,
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-device-bottom,
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-device-top,
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-device-bottom,
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-device-top,
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-device-bottom { display:flex; }

/* Browser chrome theming */
.scene-{{sceneId}} .sdf-root[data-theme="light"] .sdf-browser-chrome,
.scene-{{sceneId}} .sdf-root[data-theme=""] .sdf-browser-chrome { background:#f0f0f0;border-bottom:1px solid #ddd;color:#333; }
.scene-{{sceneId}} .sdf-root[data-theme="dark"] .sdf-browser-chrome { background:#2d2d2d;border-bottom:1px solid #404040;color:#ccc; }
.scene-{{sceneId}} .sdf-root[data-theme="light"] .sdf-url-bar,
.scene-{{sceneId}} .sdf-root[data-theme=""] .sdf-url-bar { background:#fff;border:1px solid #ddd;color:#444; }
.scene-{{sceneId}} .sdf-root[data-theme="dark"] .sdf-url-bar { background:#1e1e1e;border:1px solid #555;color:#aaa; }

/* macOS chrome theming */
.scene-{{sceneId}} .sdf-root[data-theme="light"] .sdf-macos-chrome,
.scene-{{sceneId}} .sdf-root[data-theme=""] .sdf-macos-chrome { background:#e8e8e8;border-bottom:1px solid #d0d0d0;color:#333; }
.scene-{{sceneId}} .sdf-root[data-theme="dark"] .sdf-macos-chrome { background:#3a3a3c;border-bottom:1px solid #505050;color:#ddd; }

/* Content area */
.scene-{{sceneId}} .sdf-root[data-theme="light"] .sdf-content,
.scene-{{sceneId}} .sdf-root[data-theme=""] .sdf-content { background:#fff; }
.scene-{{sceneId}} .sdf-root[data-theme="dark"] .sdf-content { background:#1e1e1e; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-content,
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-content { background:#000; }

/* Device chrome sizing */
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-device-top { height:54px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-device-bottom { height:34px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-device-top { height:20px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-landscape"] .sdf-device-bottom { height:20px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-device-top { height:24px; }
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-device-bottom { height:24px; }

/* Notch — only for phone-portrait */
.scene-{{sceneId}} .sdf-notch { display:none; }
.scene-{{sceneId}} .sdf-root[data-frame-style="phone-portrait"] .sdf-notch { display:block; }

/* Camera dot — only for tablet */
.scene-{{sceneId}} .sdf-camera-dot { display:none; }
.scene-{{sceneId}} .sdf-root[data-frame-style="tablet"] .sdf-camera-dot { display:block; }
</style>

<div class="sdf-root" data-scene-component="ScreenDemoFrame"
  data-frame-style="{{frameStyle}}" data-theme="{{theme}}"
  data-shadow="{{shadow}}" data-cursor-path="{{cursorPath}}"
  style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',-apple-system,'Helvetica Neue',sans-serif">

  <div class="sdf-frame">
    <!-- Browser chrome: tab strip + URL bar -->
    <div class="sdf-browser-chrome" style="align-items:center;height:52px;padding:0 12px;gap:8px;flex-shrink:0">
      <div style="display:flex;gap:8px;padding:0 4px">
        <div style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#febc2e"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#28c840"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(255,255,255,0.7);border-radius:6px 6px 0 0;font-size:12px;min-width:140px;height:28px">
        <span style="opacity:0.5">⊙</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Tab</span>
        <span style="margin-left:auto;opacity:0.4;font-size:13px">×</span>
      </div>
      <div class="sdf-url-bar" style="flex:1;height:32px;border-radius:6px;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:13px">
        <span style="font-size:11px;opacity:0.7">🔒</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{urlBar}}</span>
      </div>
      <div style="display:flex;gap:10px;font-size:14px;opacity:0.5">
        <span>←</span><span>→</span><span>⟳</span><span>⋯</span>
      </div>
    </div>

    <!-- macOS window chrome: traffic lights + centered title -->
    <div class="sdf-macos-chrome" style="align-items:center;height:40px;padding:0 16px;flex-shrink:0;position:relative">
      <div style="display:flex;gap:8px">
        <div style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#febc2e"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#28c840"></div>
      </div>
      <div style="position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:500;opacity:0.85">{{windowTitle}}</div>
    </div>

    <!-- Device top chrome (phone/tablet) -->
    <div class="sdf-device-top" style="background:#000;align-items:center;justify-content:center;flex-shrink:0">
      <div class="sdf-notch" style="width:126px;height:34px;background:#000;border-radius:0 0 20px 20px;position:relative">
        <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#1a1a1a;border:1px solid #2a2a2a"></div>
      </div>
      <div class="sdf-camera-dot" style="width:8px;height:8px;border-radius:50%;background:#1a1a1a;border:1px solid #333"></div>
    </div>

    <!-- Content area -->
    <div class="sdf-content" style="flex:1;position:relative;overflow:hidden;min-height:0">
      <img class="sdf-img" src="{{src}}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'" />
    </div>

    <!-- Device bottom chrome (phone/tablet) -->
    <div class="sdf-device-bottom" style="background:#000;align-items:center;justify-content:center;flex-shrink:0">
      <div style="width:134px;height:5px;background:#555;border-radius:3px"></div>
    </div>
  </div>

  <!-- Cursor pointer (shown only when cursorPath is provided) -->
  <svg class="sdf-cursor" style="position:absolute;width:24px;height:24px;opacity:0;pointer-events:none;z-index:100;left:0;top:0" viewBox="0 0 24 24">
    <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87c.45 0 .67-.54.35-.85L5.85 2.35a.5.5 0 0 0-.35.86z" fill="#fff" stroke="#222" stroke-width="1.2"/>
  </svg>
</div>
