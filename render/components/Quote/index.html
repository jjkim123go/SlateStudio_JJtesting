<div class="qt-bg" data-scene-component="Quote"
  style="position:absolute;inset:0;background:linear-gradient(135deg,{{accentColor}} 0%,#0f172a 70%);display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif">
  <div class="qt-inner" style="display:flex;flex-direction:column;align-items:center;text-align:center;width:80%;max-width:1400px">
    <div class="qt-mark" style="font-size:200px;line-height:0.5;color:rgba(255,255,255,0.25);font-weight:700;margin-bottom:32px;opacity:0">&ldquo;</div>
    <blockquote class="qt-text" style="margin:0;font-size:64px;font-weight:400;color:#FFFFFF;line-height:1.3;letter-spacing:-0.01em;opacity:0">{{text}}</blockquote>
    <div class="qt-attr" style="display:flex;align-items:center;gap:24px;margin:48px 0 0;opacity:0">
      <img class="qt-photo" src="{{photoSrc}}" style="width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,0.4);object-fit:cover;background:rgba(255,255,255,0.1)" onerror="this.style.display='none'"/>
      <div style="text-align:left;font-family:Inter,-apple-system,sans-serif">
        <p class="qt-author" style="margin:0;font-size:32px;font-weight:600;color:#FFFFFF">{{author}}</p>
        <p class="qt-role" style="margin:4px 0 0;font-size:24px;font-weight:400;color:rgba(255,255,255,0.7)">{{role}}</p>
      </div>
    </div>
  </div>
</div>
