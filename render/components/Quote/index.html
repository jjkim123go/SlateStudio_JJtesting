<div class="qt-bg" data-scene-component="Quote"
  style="position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,{{qtBgFrom}} 0%,{{qtBgTo}} 70%);display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif">
  <div class="qt-orb qt-orb-a" style="position:absolute;top:-14%;left:-10%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle,{{qtAccent}}26 0%,transparent 70%);filter:blur(8px);pointer-events:none"></div>
  <div class="qt-orb qt-orb-b" style="position:absolute;bottom:-18%;right:-12%;width:52%;height:52%;border-radius:50%;background:radial-gradient(circle,{{qtAccent}}1f 0%,transparent 70%);filter:blur(10px);pointer-events:none"></div>
  <div class="qt-inner" style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:80%;max-width:1400px">
    <div class="qt-mark" style="font-size:200px;line-height:0.5;color:{{qtMark}};font-weight:700;margin-bottom:32px;opacity:0">&ldquo;</div>
    <blockquote class="qt-text" style="margin:0;font-size:64px;font-weight:400;color:{{qtText}};line-height:1.3;letter-spacing:-0.01em;opacity:0">{{text}}</blockquote>
    <div class="qt-rule" style="width:120px;height:4px;border-radius:2px;background:{{qtAccent}};margin:36px 0 0;opacity:0"></div>
    <div class="qt-attr" style="display:flex;align-items:center;gap:24px;margin:36px 0 0;opacity:0">
      <img class="qt-photo" src="{{photoSrc}}" style="width:96px;height:96px;border-radius:50%;border:3px solid {{qtBorder}};object-fit:cover;background:{{qtMark}}" onerror="this.style.display='none'"/>
      <div style="text-align:left;font-family:Inter,-apple-system,sans-serif">
        <p class="qt-author" style="margin:0;font-size:32px;font-weight:600;color:{{qtText}}">{{author}}</p>
        <p class="qt-role" style="margin:4px 0 0;font-size:24px;font-weight:400;color:{{qtSub}}">{{role}}</p>
      </div>
    </div>
  </div>
</div>
