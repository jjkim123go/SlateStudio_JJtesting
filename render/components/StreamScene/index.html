<!--
  ============================================================================
  StreamScene — Microsoft Stream (on SharePoint) Player Surface (Wave A, PR 8a)
  ============================================================================
  Canonical variant for Wave A: PlayerWithTranscript (light theme, desktop).

  SLOT / DATA CONTRACT — populated from SCF props:
  ┌─────────────────────────────────┬────────────────────────────────────────┐
  │ {{videoTitle}}                  │ Plain text, app-bar title              │
  │ {{videoOwner}}                  │ Plain text, owner display name         │
  │ {{videoDate}}                   │ Plain text, formatted date             │
  │ {{videoDuration}}               │ Plain text "MM:SS"                     │
  │ {{variant}}                     │ Goes onto data-variant on root         │
  │ {{{chaptersJson}}}              │ JSON array of {title,startSec}         │
  │ {{{speakersJson}}}              │ JSON array of {id,name,color}          │
  │ {{{transcriptSegmentsJson}}}    │ JSON array of speaker-tagged segments  │
  └─────────────────────────────────┴────────────────────────────────────────┘

  POSTER MODE ONLY for Wave A canonical: no <video> element is rendered.
  When orchestrator wires Mode B (videoSrc), animation.js can promote the
  poster to a <video> by reading data-video-src on .stream-viewport.

  CHROME REGIONS (this component owns ALL of these):
    .stream-appbar       — top: title + meta + share/more + Copilot diamond
    .stream-viewport     — 16:9 video frame with synthetic poster + captions
    .stream-controls     — scrubber + chapter markers + transport row
    .stream-sidepanel    — tabs (Transcript active) + transcript list
============================================================================ -->
<style data-component="StreamScene">
.scene-{{sceneId}} .stream-root{
  position:absolute;inset:0;
  background:#FAFAFA;
  font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  color:#323130;
  overflow:hidden;
  --stream-magenta:#E3008C;
  --stream-magenta-shade:#BB2A8A;
  --stream-tint:#FFF1F8;
  --stream-word-hl:#FFE1F0;
  --stream-text:#323130;
  --stream-text-sec:#605E5C;
  --stream-border:#E1DFDD;
  --stream-panel-bg:#FAFAFA;
  --stream-card-bg:#FFFFFF;
}
/* App bar */
.scene-{{sceneId}} .stream-appbar{
  position:absolute;left:0;right:0;top:0;height:56px;
  background:#FFFFFF;
  border-bottom:1px solid var(--stream-border);
  display:flex;align-items:center;
  padding:0 24px;gap:16px;z-index:5;
}
.scene-{{sceneId}} .stream-appbar-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0;}
.scene-{{sceneId}} .stream-mark{
  width:32px;height:32px;border-radius:6px;
  background:var(--stream-magenta);
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.scene-{{sceneId}} .stream-mark svg{display:block;}
.scene-{{sceneId}} .stream-titleblock{display:flex;flex-direction:column;min-width:0;}
.scene-{{sceneId}} .stream-vtitle{
  font-size:16px;font-weight:600;color:var(--stream-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.2;
}
.scene-{{sceneId}} .stream-vmeta{
  font-size:12px;color:var(--stream-text-sec);
  margin-top:2px;
}
.scene-{{sceneId}} .stream-appbar-right{display:flex;align-items:center;gap:8px;}
.scene-{{sceneId}} .stream-iconbtn{
  width:36px;height:36px;border-radius:6px;border:none;
  background:transparent;color:var(--stream-text);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.scene-{{sceneId}} .stream-iconbtn:hover{background:#F3F2F1;}
.scene-{{sceneId}} .stream-copilot{
  width:36px;height:36px;border:none;border-radius:8px;
  background:linear-gradient(135deg,#7B5CCC 0%,#E3008C 100%);
  color:#FFFFFF;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  margin-left:4px;
}

/* Body */
.scene-{{sceneId}} .stream-body{
  position:absolute;left:0;right:0;top:56px;bottom:0;
  display:flex;
}
.scene-{{sceneId}} .stream-viewport-col{
  flex:1 1 65%;display:flex;flex-direction:column;
  background:#000000;min-width:0;
}
.scene-{{sceneId}} .stream-viewport{
  position:relative;flex:1 1 auto;overflow:hidden;
  background:#000000;
}
.scene-{{sceneId}} .stream-poster{
  position:absolute;inset:0;
  transform-origin:50% 50%;
  background:radial-gradient(ellipse at 30% 35%, #2E2E48 0%, #0F0F1E 70%);
  display:flex;align-items:center;justify-content:center;
}
.scene-{{sceneId}} .stream-poster svg{
  width:78%;height:78%;display:block;
}
.scene-{{sceneId}} .stream-captions{
  position:absolute;left:0;right:0;bottom:64px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  pointer-events:none;z-index:3;
}
.scene-{{sceneId}} .stream-caption-line{
  display:inline-block;
  background:rgba(0,0,0,0.55);
  padding:8px 16px;border-radius:6px;
  max-width:80%;
  font-size:22px;font-weight:600;color:#FFFFFF;
  text-shadow:0 1px 2px rgba(0,0,0,0.85);
  text-align:center;line-height:1.3;
}
.scene-{{sceneId}} .stream-cap-word{display:inline;color:#FFFFFF;font-weight:600;}

/* Controls */
.scene-{{sceneId}} .stream-controls{
  flex:0 0 auto;
  background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.65) 70%, rgba(0,0,0,0.4));
  padding:6px 18px 10px;
  position:relative;
}
.scene-{{sceneId}} .stream-scrubber-row{padding:8px 0 6px;}
.scene-{{sceneId}} .stream-scrubber{
  position:relative;height:6px;
  background:rgba(255,255,255,0.30);
  border-radius:3px;overflow:visible;
}
.scene-{{sceneId}} .stream-scrubber-fill{
  position:absolute;left:0;top:0;bottom:0;width:100%;
  background:var(--stream-magenta);
  border-radius:3px;
  transform-origin:left center;
  transform:scaleX(0);
}
.scene-{{sceneId}} .stream-chapter-markers{
  position:absolute;inset:0;pointer-events:none;
}
.scene-{{sceneId}} .stream-chapter-mark{
  position:absolute;top:-1px;bottom:-1px;width:2px;
  background:rgba(255,255,255,0.95);
  transform:translateX(-1px);
}
.scene-{{sceneId}} .stream-transport{
  display:flex;align-items:center;gap:6px;
  color:#FFFFFF;
  padding-top:2px;
}
.scene-{{sceneId}} .stream-tbtn{
  width:34px;height:34px;border-radius:4px;border:none;
  background:transparent;color:#FFFFFF;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.scene-{{sceneId}} .stream-tbtn:hover{background:rgba(255,255,255,0.12);}
.scene-{{sceneId}} .stream-time{
  margin-left:6px;
  font-size:13px;color:#FFFFFF;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.scene-{{sceneId}} .stream-time-elapsed{font-weight:500;}
.scene-{{sceneId}} .stream-spacer{flex:1;}

/* Side panel */
.scene-{{sceneId}} .stream-sidepanel{
  flex:0 0 380px;
  background:var(--stream-panel-bg);
  border-left:1px solid var(--stream-border);
  display:flex;flex-direction:column;min-width:0;
}
.scene-{{sceneId}} .stream-tabs{
  display:flex;border-bottom:1px solid var(--stream-border);
  padding:0 12px;flex:0 0 auto;
  background:#FFFFFF;
}
.scene-{{sceneId}} .stream-tab{
  padding:12px 16px;font-size:14px;font-weight:500;
  color:var(--stream-text-sec);cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.scene-{{sceneId}} .stream-tab--active{
  color:var(--stream-magenta);
  border-bottom-color:var(--stream-magenta);
  font-weight:600;
}
.scene-{{sceneId}} .stream-transcript{
  flex:1 1 auto;overflow:hidden;position:relative;
}
.scene-{{sceneId}} .stream-transcript-inner{
  position:absolute;left:0;right:0;top:0;
  padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
  will-change:transform;
}
.scene-{{sceneId}} .stream-seg{
  border-left:3px solid transparent;
  background:transparent;
  padding:10px 12px 10px 12px;
  border-radius:6px;
  transition:none;
}
.scene-{{sceneId}} .stream-seg-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:6px;
}
.scene-{{sceneId}} .stream-seg-pill{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:11px;font-weight:600;color:#FFFFFF;
  letter-spacing:0.2px;
}
.scene-{{sceneId}} .stream-seg-time{
  font-size:11px;color:var(--stream-text-sec);
  font-variant-numeric:tabular-nums;
}
.scene-{{sceneId}} .stream-seg-body{
  font-size:14px;line-height:1.55;color:var(--stream-text);
}
.scene-{{sceneId}} .stream-word{
  display:inline;background:transparent;color:var(--stream-text);
  border-radius:3px;padding:0 1px;
}

/* ── Wave B additions (variant-only; unused by playerWithTranscript) ─── */

/* videoClipMode: real <video> element layered above the synthetic poster */
.scene-{{sceneId}} .stream-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;
  z-index:2;pointer-events:none;
}

/* chaptersNavigation: chapter rows in side panel */
.scene-{{sceneId}} .stream-chrow{
  display:flex;align-items:center;gap:10px;
  padding:8px 8px;border-radius:6px;
  background:transparent;cursor:pointer;
  opacity:0;
}
.scene-{{sceneId}} .stream-chrow--active{
  background:var(--stream-tint);
}
.scene-{{sceneId}} .stream-chrow-thumb{
  flex:0 0 88px;width:88px;height:50px;border-radius:4px;
  background:linear-gradient(135deg,#2E2E48 0%,#0F0F1E 70%);
  position:relative;overflow:hidden;
}
.scene-{{sceneId}} .stream-chrow-thumb svg{
  position:absolute;inset:0;width:100%;height:100%;display:block;
}
.scene-{{sceneId}} .stream-chrow-text{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;
}
.scene-{{sceneId}} .stream-chrow-title{
  font-size:13px;font-weight:600;color:var(--stream-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;
}
.scene-{{sceneId}} .stream-chrow-time{
  font-size:11px;color:var(--stream-text-sec);
  font-variant-numeric:tabular-nums;
}
.scene-{{sceneId}} .stream-chrow-pill{
  flex:0 0 auto;
  font-size:10px;font-weight:600;color:var(--stream-text-sec);
  background:#F3F2F1;border-radius:10px;padding:2px 8px;
  font-variant-numeric:tabular-nums;
}

/* chaptersNavigation: viewport dim + chapter-title slide-in overlay */
.scene-{{sceneId}} .stream-dim{
  position:absolute;inset:0;background:rgba(0,0,0,0.35);
  opacity:0;pointer-events:none;z-index:3;
}
.scene-{{sceneId}} .stream-chtitle{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.0));
  padding:24px 28px 32px;
  color:#FFFFFF;font-weight:600;font-size:22px;line-height:1.2;
  pointer-events:none;z-index:4;
  transform:translateY(100%);opacity:0;
}
.scene-{{sceneId}} .stream-chtitle-time{
  display:block;font-size:13px;font-weight:500;
  color:#E3008C;margin-top:4px;letter-spacing:0.5px;
}

/* searchResults: search shell (NOT a real <input>) */
.scene-{{sceneId}} .stream-search-shell{
  display:flex;align-items:center;gap:8px;
  margin:10px 12px 4px;padding:8px 12px;
  background:#FFFFFF;border:1px solid var(--stream-border);
  border-radius:6px;
  box-shadow:0 0 0 0 rgba(227,0,140,0.0);
  transition:none;
}
.scene-{{sceneId}} .stream-search-shell--focus{
  border-color:var(--stream-magenta);
  box-shadow:0 0 0 2px rgba(227,0,140,0.18);
}
.scene-{{sceneId}} .stream-search-icon{
  flex:0 0 auto;display:inline-flex;color:var(--stream-text-sec);
}
.scene-{{sceneId}} .stream-search-input{
  flex:1 1 auto;display:inline-flex;align-items:center;
  font-size:14px;color:var(--stream-text);
  font-family:inherit;min-width:0;
}
.scene-{{sceneId}} .stream-search-text{
  display:inline;white-space:pre;
}
.scene-{{sceneId}} .stream-search-text:empty::before{
  content:"Find in video…";color:#A19F9D;
}
.scene-{{sceneId}} .stream-search-caret{
  display:inline-block;width:1px;height:14px;
  background:var(--stream-text);margin-left:1px;
  vertical-align:middle;
  animation:stream-caret-blink-{{sceneId}} 1s steps(1) infinite;
}
@keyframes stream-caret-blink-{{sceneId}}{
  0%,49%{opacity:1;} 50%,100%{opacity:0;}
}
.scene-{{sceneId}} .stream-search-badge{
  flex:0 0 auto;
  font-size:11px;font-weight:600;color:#FFFFFF;
  background:var(--stream-magenta);
  border-radius:10px;padding:2px 8px;
  opacity:0;
}
.scene-{{sceneId}} .stream-search-hl{
  background:#FFE066;color:var(--stream-text);
  border-radius:3px;padding:0 2px;font-weight:600;
}

/* Cursor (chapters + search variants) */
.scene-{{sceneId}} .stream-cursor{
  position:absolute;left:0;top:0;width:auto;height:auto;
  display:flex;align-items:flex-start;gap:6px;
  pointer-events:none;z-index:6;opacity:0;
  transform:translate(0,0);
  font-family:inherit;
}
.scene-{{sceneId}} .stream-cursor-arrow{
  width:18px;height:18px;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));
}
.scene-{{sceneId}} .stream-cursor-label{
  margin-top:14px;
  font-size:11px;font-weight:600;color:#FFFFFF;
  background:#0078D4;border-radius:10px;padding:2px 8px;
  white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,0.25);
}
.scene-{{sceneId}} .stream-cursor-pulse{
  position:absolute;left:0;top:0;width:24px;height:24px;
  border-radius:50%;background:rgba(0,120,212,0.45);
  transform:scale(0);opacity:0;pointer-events:none;
}
</style>
<div class="stream-root"
     data-scene-component="StreamScene"
     data-variant="{{variant}}">

  <!-- Top app bar -->
  <div class="stream-appbar" data-slot="appbar">
    <div class="stream-appbar-left">
      <span class="stream-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 4.5C2 3.67157 2.67157 3 3.5 3H11.5C12.3284 3 13 3.67157 13 4.5V13.5C13 14.3284 12.3284 15 11.5 15H3.5C2.67157 15 2 14.3284 2 13.5V4.5Z" fill="#FFFFFF"/>
          <path d="M14 6.5L17 4.5V13.5L14 11.5V6.5Z" fill="#FFFFFF"/>
        </svg>
      </span>
      <div class="stream-titleblock">
        <div class="stream-vtitle">{{videoTitle}}</div>
        <div class="stream-vmeta">{{videoOwner}} &middot; {{videoDate}} &middot; {{videoDuration}}</div>
      </div>
    </div>
    <div class="stream-appbar-right">
      <button class="stream-iconbtn" aria-label="Share" data-slot="share">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
          <path d="M13 2.5a2.5 2.5 0 1 1-2.45 2.99l-4.6 2.3a2.5 2.5 0 0 1 0 2.42l4.6 2.3a2.5 2.5 0 1 1-.43.85l-4.6-2.3a2.5 2.5 0 1 1 0-3.97l4.6-2.3A2.5 2.5 0 0 1 13 2.5z"/>
        </svg>
      </button>
      <button class="stream-iconbtn" aria-label="More" data-slot="more">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
          <circle cx="4" cy="9" r="1.5"/>
          <circle cx="9" cy="9" r="1.5"/>
          <circle cx="14" cy="9" r="1.5"/>
        </svg>
      </button>
      <button class="stream-copilot" aria-label="Copilot">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="#FFFFFF" aria-hidden="true">
          <path d="M9 1.5L11 7L16.5 9L11 11L9 16.5L7 11L1.5 9L7 7L9 1.5Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Body: viewport (left) + side panel (right) -->
  <div class="stream-body">
    <div class="stream-viewport-col">

      <div class="stream-viewport" data-slot="viewport">
        <!-- Synthetic poster: speaker on stage, podium, slide screen.
             SVG silhouette only - no photographs. -->
        <div class="stream-poster" aria-hidden="true">
          <svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="stream-stage-grad-{{sceneId}}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3A3A5C"/>
                <stop offset="100%" stop-color="#181828"/>
              </linearGradient>
              <linearGradient id="stream-screen-grad-{{sceneId}}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5C7DB3"/>
                <stop offset="100%" stop-color="#2C4A7A"/>
              </linearGradient>
            </defs>
            <!-- Stage backdrop -->
            <rect x="0" y="0" width="800" height="450" fill="url(#stream-stage-grad-{{sceneId}})"/>
            <!-- Slide screen behind speaker -->
            <rect x="180" y="60" width="440" height="220" rx="6" fill="url(#stream-screen-grad-{{sceneId}})" opacity="0.85"/>
            <rect x="210" y="100" width="240" height="14" rx="3" fill="#FFFFFF" opacity="0.85"/>
            <rect x="210" y="130" width="380" height="8" rx="2" fill="#FFFFFF" opacity="0.55"/>
            <rect x="210" y="150" width="320" height="8" rx="2" fill="#FFFFFF" opacity="0.55"/>
            <rect x="210" y="170" width="360" height="8" rx="2" fill="#FFFFFF" opacity="0.55"/>
            <rect x="210" y="210" width="180" height="50" rx="4" fill="#E3008C" opacity="0.75"/>
            <!-- Stage floor -->
            <rect x="0" y="320" width="800" height="130" fill="#0A0A14"/>
            <!-- Podium -->
            <rect x="540" y="290" width="120" height="100" rx="4" fill="#22223A"/>
            <rect x="555" y="305" width="90" height="6" rx="1" fill="#3A3A5C"/>
            <!-- Speaker silhouette -->
            <g transform="translate(370,250)">
              <!-- head -->
              <ellipse cx="0" cy="0" rx="22" ry="26" fill="#0A0A14"/>
              <!-- body -->
              <path d="M -42 130 L -42 50 Q -42 20 0 20 Q 42 20 42 50 L 42 130 Z" fill="#0A0A14"/>
            </g>
            <!-- Spotlight glow -->
            <ellipse cx="370" cy="280" rx="240" ry="80" fill="#FFFFFF" opacity="0.04"/>
          </svg>
        </div>
        <!-- videoClipMode: real <video> emitted at compile time so HF
             producer's "Extracting video frames" preprocessor sees it
             (videoCount > 0). Empty string for variants without videoSrc. -->
        {{{videoElementHtml}}}
        <!-- Captions overlay - lines appended at module-eval. -->
        <div class="stream-captions" data-slot="captions"></div>
      </div>

      <div class="stream-controls" data-slot="controls">
        <div class="stream-scrubber-row">
          <div class="stream-scrubber">
            <div class="stream-scrubber-fill"></div>
            <div class="stream-chapter-markers"></div>
          </div>
        </div>
        <div class="stream-transport">
          <button class="stream-tbtn stream-play" aria-label="Pause">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <rect x="4.5" y="3.5" width="3" height="11" rx="1"/>
              <rect x="10.5" y="3.5" width="3" height="11" rx="1"/>
            </svg>
          </button>
          <span class="stream-time">
            <span class="stream-time-elapsed">00:00</span>
            <span class="stream-time-sep"> / </span>
            <span class="stream-time-total">{{videoDuration}}</span>
          </span>
          <span class="stream-spacer"></span>
          <button class="stream-tbtn" aria-label="Volume">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path d="M9 3v12L5 12H2.5A.5.5 0 0 1 2 11.5v-5A.5.5 0 0 1 2.5 6H5l4-3zm3.5 1.5a5 5 0 0 1 0 9l-1-.86a4 4 0 0 0 0-7.28l1-.86z"/>
            </svg>
          </button>
          <button class="stream-tbtn" aria-label="Captions">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h9A2.5 2.5 0 0 1 16 5.5v7a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 2 12.5v-7zM6 8.5A1.5 1.5 0 1 0 4.5 7v.5A1.5 1.5 0 0 0 6 9v-.5zm6.5 0A1.5 1.5 0 1 0 11 7v.5a1.5 1.5 0 0 0 1.5 1.5v-.5z"/>
            </svg>
          </button>
          <button class="stream-tbtn" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path d="M9 6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM7.5 1h3l.4 2.06a6 6 0 0 1 1.5.87l1.96-.7L15.86 5.85l-1.5 1.46a6 6 0 0 1 0 1.74l1.5 1.46-1.5 2.62-1.96-.7a6 6 0 0 1-1.5.87L10.5 17h-3l-.4-2.06a6 6 0 0 1-1.5-.87l-1.96.7L2.14 12.15l1.5-1.46a6 6 0 0 1 0-1.74L2.14 7.49l1.5-2.62 1.96.7a6 6 0 0 1 1.5-.87L7.5 1z"/>
            </svg>
          </button>
          <button class="stream-tbtn" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path d="M3 3h4v2H5v2H3V3zm12 0v4h-2V5h-2V3h4zM3 15v-4h2v2h2v2H3zm12 0h-4v-2h2v-2h2v4z"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <div class="stream-sidepanel" data-slot="sidepanel">
      <div class="stream-tabs" data-slot="tabs">
        <div class="stream-tab stream-tab--active">Transcript</div>
