<div class="bi-bg" data-scene-component="BrandIntro"
  style="position:absolute;inset:0;background:{{primaryColor}};background:linear-gradient(135deg, {{primaryColor}} 0%, rgba(0,0,0,0.4) 100%)">
  <div class="bi-stack" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:80%">
    <img class="bi-logo" src="{{logoSrc}}" style="display:block;margin:0 auto 32px;max-height:240px;max-width:60%;opacity:0" />
    <h1 class="bi-company" style="margin:0;font-size:72px;font-weight:700;color:#FFFFFF;letter-spacing:-0.02em;opacity:0">{{companyName}}</h1>
    <p class="bi-tagline" style="margin:16px 0 0;font-size:32px;font-weight:400;color:rgba(255,255,255,0.8);opacity:0">{{tagline}}</p>
  </div>
</div>
