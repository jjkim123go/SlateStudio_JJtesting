<!--
  PurpleCardStorm — premium deep-purple 3D card storm.
  4–8 glass cards storm in from extreme 3D positions (z-axis depth + rotation +
  parallax), settle into a Keynote-style floating arrangement with continuous
  gentle parallax breathing. Built for dark "deep purple matte sheen" theme.

  Slots:
    {{eyebrow}}        small uppercase label (e.g. "EVERY · QUARTER")
    {{title}}          large hero title
    {{subtitle}}       supporting line (optional)
    {{footer}}         closing bottom counter line (optional)
    {{cardsJson}}      JSON array of cards: [{idx, title, sub, badge, accent}]
                       (accent: "primary"|"secondary"|"warm"|"green")
-->

<style data-component="PurpleCardStorm">
.scene-{{sceneId}} .pcs-root {
  position: absolute; inset: 0;
  overflow: hidden;
  font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  color: #ffffff;
  background:
    radial-gradient(circle at 22% 18%, rgba(178, 122, 240, 0.26), transparent 38%),
    radial-gradient(circle at 78% 82%, rgba(214, 158, 232, 0.18), transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(212, 178, 107, 0.12), transparent 46%),
    linear-gradient(135deg, #2A1838 0%, #1F0E2A 42%, #14081E 100%);
  perspective: 1800px;
  perspective-origin: 50% 50%;
}
.scene-{{sceneId}} .pcs-grain {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 4px);
  pointer-events: none;
  opacity: 0.6;
}
.scene-{{sceneId}} .pcs-aurora {
  position: absolute; inset: -10%;
  background:
    radial-gradient(ellipse at 30% 35%, rgba(178,122,240,0.16), transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(214,158,232,0.12), transparent 55%);
  filter: blur(60px);
  pointer-events: none;
}
.scene-{{sceneId}} .pcs-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}
.scene-{{sceneId}} .pcs-header {
  position: absolute;
  left: 0; right: 0; top: 60px;
  text-align: center;
  z-index: 12;
}
.scene-{{sceneId}} .pcs-eyebrow {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: #D4B26B;
  margin: 0;
  text-shadow: 0 0 18px rgba(212,178,107,0.45);
}
.scene-{{sceneId}} .pcs-title {
  font-size: 48px;
  font-weight: 720;
  letter-spacing: 0.04em;
  color: #E5E0F0;
  margin: 14px 0 0;
  text-shadow: 0 4px 32px rgba(178,122,240,0.40);
}
.scene-{{sceneId}} .pcs-divider {
  width: 240px; height: 1px;
  margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, rgba(214,158,232,0.55), transparent);
}
.scene-{{sceneId}} .pcs-stage {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  transform-style: preserve-3d;
  z-index: 8;
}
.scene-{{sceneId}} .pcs-card {
  position: absolute;
  left: 50%; top: 50%;
  width: 360px; height: 200px;
  margin-left: -180px; margin-top: -100px;
  transform-style: preserve-3d;
  will-change: transform, opacity, filter;
  border-radius: 16px;
  background:
    linear-gradient(135deg, rgba(178,122,240,0.18), rgba(78,42,108,0.66) 60%),
    radial-gradient(circle at 18% 12%, rgba(214,158,232,0.16), transparent 60%);
  border: 1px solid rgba(214,158,232,0.28);
  box-shadow:
    0 22px 64px rgba(8,3,20,0.72),
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 -1px 0 rgba(214,158,232,0.20);
  backdrop-filter: blur(8px);
  padding: 22px 26px;
  display: flex; flex-direction: column;
  opacity: 0;
}
.scene-{{sceneId}} .pcs-card[data-accent="primary"]   { --pcs-accent: #B27AF0; }
.scene-{{sceneId}} .pcs-card[data-accent="secondary"] { --pcs-accent: #D69EE8; }
.scene-{{sceneId}} .pcs-card[data-accent="warm"]      { --pcs-accent: #D4B26B; }
.scene-{{sceneId}} .pcs-card[data-accent="green"]     { --pcs-accent: #34D399; }
.scene-{{sceneId}} .pcs-card-bar {
  position: absolute;
  left: 0; top: 18px; bottom: 18px;
  width: 4px;
  background: var(--pcs-accent, #B27AF0);
  border-radius: 0 4px 4px 0;
  box-shadow: 0 0 18px var(--pcs-accent, #B27AF0);
}
.scene-{{sceneId}} .pcs-card-idx {
  font-size: 56px;
  font-weight: 820;
  color: var(--pcs-accent, #B27AF0);
  line-height: 1;
  text-shadow: 0 0 22px rgba(214,158,232,0.40);
  margin-bottom: 6px;
}
.scene-{{sceneId}} .pcs-card-title {
  font-size: 26px;
  font-weight: 720;
  color: #FFFFFF;
  letter-spacing: 0.01em;
  margin-bottom: 4px;
}
.scene-{{sceneId}} .pcs-card-sub {
  font-size: 16px;
  font-weight: 500;
  color: rgba(229,224,240,0.78);
  margin-bottom: auto;
}
.scene-{{sceneId}} .pcs-card-badge {
  align-self: flex-end;
  font-size: 13px;
  font-weight: 620;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: rgba(229,224,240,0.92);
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(214,158,232,0.14);
  border: 1px solid rgba(214,158,232,0.26);
}
.scene-{{sceneId}} .pcs-footer {
  position: absolute;
  left: 0; right: 0; bottom: 60px;
  text-align: center;
  font-size: 22px;
  font-weight: 620;
  color: rgba(229,224,240,0.86);
  letter-spacing: 0.04em;
  z-index: 12;
  opacity: 0;
}
</style>

<div class="scene-{{sceneId}} pcs-root"
     data-pcs-cards="{{cardsJson}}">
  <div class="pcs-aurora"></div>
  <div class="pcs-grain"></div>

  <div class="pcs-header">
    <p class="pcs-eyebrow">{{eyebrow}}</p>
    <h2 class="pcs-title">{{title}}</h2>
    <div class="pcs-divider"></div>
  </div>

  <div class="pcs-stage"></div>

  <div class="pcs-footer">{{footer}}</div>

  <div class="pcs-vignette"></div>
</div>
