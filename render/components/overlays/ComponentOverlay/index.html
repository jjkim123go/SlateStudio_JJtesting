<div class="component-overlay-root" data-scene-component="ComponentOverlay"
  style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:{{background}};font-family:{{headingFont}},Inter,-apple-system,sans-serif;color:#fff;overflow:hidden">
  <div class="component-overlay-backdrop" style="position:absolute;inset:0;background:radial-gradient(circle at 22% 18%,rgba(0,120,212,0.30),transparent 32%),radial-gradient(circle at 78% 72%,rgba(125,211,252,0.16),transparent 38%)"></div>
  <div class="component-overlay-card" style="position:relative;width:78%;max-width:1320px;padding:58px 64px;border-radius:32px;background:rgba(2,6,23,0.72);border:1px solid rgba(148,163,184,0.20);box-shadow:0 30px 88px rgba(0,0,0,0.45)">
    <p class="component-overlay-eyebrow" style="margin:0 0 14px;font-size:23px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;color:#7dd3fc;opacity:0">{{eyebrow}}</p>
    <h2 class="component-overlay-title" style="margin:0 0 22px;font-size:68px;line-height:1.04;letter-spacing:-0.04em;opacity:0">{{title}}</h2>
    <p class="component-overlay-body" style="margin:0;font-size:32px;line-height:1.42;color:rgba(226,232,240,0.86);opacity:0">{{body}}</p>
    <div class="component-overlay-slot" style="margin-top:34px;opacity:0">{{{contentHtml}}}</div>
  </div>
</div>
