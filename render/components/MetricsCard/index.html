<div class="mc-card" data-scene-component="MetricsCard"
  style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 40% 30%,rgba(56,189,248,0.12),transparent 50%),
    linear-gradient(135deg,#020617 0%,#0f172a 100%);
    font-family:Inter,-apple-system,sans-serif;color:#fff">
  <div class="mc-inner" style="display:flex;flex-direction:column;align-items:center;text-align:center;
    width:72%;max-width:1100px;padding:60px 72px;border-radius:32px;
    background:rgba(15,23,42,0.62);border:1px solid rgba(148,163,184,0.18);
    box-shadow:0 32px 80px rgba(0,0,0,0.45);backdrop-filter:blur(18px);opacity:0">

    <!-- Headline number -->
    <div class="mc-headline-row" style="display:flex;align-items:baseline;gap:16px">
      <span class="mc-headline" data-target="{{headline}}"
        style="font-size:200px;font-weight:800;letter-spacing:-0.04em;line-height:1;
        font-variant-numeric:tabular-nums;
        background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;
        -webkit-text-fill-color:transparent;opacity:0">0</span>
      <span class="mc-suffix"
        style="font-size:56px;font-weight:600;color:rgba(255,255,255,0.55);opacity:0">{{headlineSuffix}}</span>
    </div>

    <!-- Delta indicator -->
    <div class="mc-delta-row" style="display:flex;align-items:center;gap:12px;margin:20px 0 0;opacity:0"
      data-direction="{{deltaDirection}}">
      <svg class="mc-arrow" width="36" height="36" viewBox="0 0 24 24" fill="none"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        style="stroke:currentColor">
        <path class="mc-arrow-up" d="M7 17 L17 7 M17 7 L17 14 M17 7 L10 7" style="display:none"/>
        <path class="mc-arrow-down" d="M17 7 L7 17 M7 17 L7 10 M7 17 L14 17" style="display:none"/>
      </svg>
      <span class="mc-delta-text" style="font-size:36px;font-weight:600">{{delta}}</span>
    </div>

    <!-- Sub-metrics row -->
    <div class="mc-subs" style="display:flex;gap:24px;margin:48px 0 0;width:100%">
      {{{subMetricsHtml}}}
    </div>
  </div>
</div>
