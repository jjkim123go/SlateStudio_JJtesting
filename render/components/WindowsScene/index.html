<!--
  ============================================================================
  WindowsScene — Windows 11 File Explorer (light, 23H2+) — PR 10e Wave A
  ============================================================================

  SLOT CONTRACT (Wave B passes via SCF props):
    {{titlebarTabsHtml}}      — Title-bar tab strip <div class="fe-tab"> children
    {{commandBarHtml}}        — Command-bar action chips
    {{breadcrumbHtml}}        — Address-bar segmented breadcrumb
    {{searchPlaceholder}}     — Search box placeholder text
    {{navTreeHtml}}           — Left nav rail tree
    {{contentHtml}}           — Main pane (icon grid / detail list)
    {{statusLeftHtml}}        — Status bar left ("X items")
    {{statusRightHtml}}       — Status bar right (view mode toggle)

  VARIANT ATTRIBUTES on .fe-root:
    data-theme="light"          (only light variant in scope for PR 10e)

  CHROME REGIONS:
    .fe-titlebar    32px — tab strip + new-tab + window controls
    .fe-cmdbar      40px — New / Cut / Copy / Rename / Share / Delete / Sort / View …
    .fe-addressbar  36px — back/fwd/up nav + breadcrumb + search
    .fe-body        flex — left rail (240px) + main pane
    .fe-statusbar   24px — items count + view-mode chips

  Standing Rule #15 (PR 10c): all <symbol> use Fluent UI 2 Filled style
    (single solid path, NO `stroke=`). Window-control glyphs (min/max/close)
    are Windows-flat squares using <rect>/<line> — these use stroke as a
    spec exception (Windows convention is 1px line glyphs, mirror of PR 10d).
  ============================================================================ -->

<style data-component="WindowsScene">
/* ============================================================================
   DENSITY SPEC (measured at 1920×1080):
     Titlebar     32px (tab height 30px, +2px bottom shadow)
     Command bar  40px
     Address bar  36px
     Statusbar    24px
     Nav rail     240px
     Tab font     12px Segoe UI Variable
     Cmd font     12px
     Tree row     30px tall, 14px icon, 13px label
     Address bar font 13px
   ============================================================================ */

.scene-{{sceneId}} .fe-root {
  --fe-bg:           #f3f3f3;
  --fe-tab-bar:      #f9f9f9;
  --fe-tab-active:   #ffffff;
  --fe-tab-inactive: rgba(0,0,0,0.04);
  --fe-body:         #ffffff;
  --fe-rail:         #fafafa;
  --fe-hover:        rgba(0,0,0,0.04);
  --fe-selected:     rgba(0,120,212,0.10);
  --fe-text:         rgba(0,0,0,0.9);
  --fe-text-sec:     #5d5d5d;
  --fe-text-mute:    #767676;
  --fe-border:       rgba(0,0,0,0.08);
  --fe-divider:      rgba(0,0,0,0.06);
  --fe-accent:       #0078d4;
  --fe-shadow:       0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.08);

  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 40px;
  background: linear-gradient(135deg, #1c4a7a 0%, #2570b5 50%, #3da3d4 100%);
  font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 13px;
  color: var(--fe-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

.scene-{{sceneId}} .fe-window {
  position: relative;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--fe-bg);
  border-radius: 8px;
  box-shadow: var(--fe-shadow);
  overflow: hidden;
  opacity: 0;
}

/* ── Titlebar (32px) ── */
.scene-{{sceneId}} .fe-titlebar {
  display: flex; align-items: stretch;
  flex: 0 0 32px; height: 32px;
  background: var(--fe-tab-bar);
  border-bottom: 1px solid var(--fe-border);
  user-select: none;
}
.scene-{{sceneId}} .fe-tabs {
  display: flex; align-items: center;
  gap: 2px; padding: 4px 6px 0;
  flex: 0 1 auto; min-width: 0;
}
.scene-{{sceneId}} .fe-tab {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px 0 12px;
  font-size: 12px; color: var(--fe-text);
  background: transparent;
  border-radius: 6px 6px 0 0;
  max-width: 200px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: default;
}
.scene-{{sceneId}} .fe-tab:hover { background: var(--fe-tab-inactive); }
.scene-{{sceneId}} .fe-tab--active {
  background: var(--fe-tab-active);
  box-shadow: inset 0 -1px 0 var(--fe-tab-active), 0 0 0 1px var(--fe-border);
}
.scene-{{sceneId}} .fe-tab svg { width: 14px; height: 14px; flex-shrink: 0; }
.scene-{{sceneId}} .fe-tab-close {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 4px;
  background: transparent; border: 0; padding: 0; margin-left: 4px;
  color: var(--fe-text-sec); cursor: pointer;
}
.scene-{{sceneId}} .fe-tab-close:hover { background: rgba(0,0,0,0.08); color: var(--fe-text); }
.scene-{{sceneId}} .fe-tab-close svg { width: 10px; height: 10px; }
.scene-{{sceneId}} .fe-newtab {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; margin-top: 4px; margin-left: 2px;
  border-radius: 4px;
  background: transparent; border: 0; padding: 0;
  color: var(--fe-text-sec); cursor: pointer;
}
.scene-{{sceneId}} .fe-newtab:hover { background: var(--fe-hover); }
.scene-{{sceneId}} .fe-newtab svg { width: 12px; height: 12px; }
.scene-{{sceneId}} .fe-titlebar-spacer { flex: 1 1 auto; }
.scene-{{sceneId}} .fe-wincontrols {
  display: flex; align-items: stretch;
  flex: 0 0 auto;
}
.scene-{{sceneId}} .fe-winbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 32px;
  background: transparent; border: 0; padding: 0;
  color: var(--fe-text); cursor: pointer;
}
.scene-{{sceneId}} .fe-winbtn:hover { background: rgba(0,0,0,0.06); }
.scene-{{sceneId}} .fe-winbtn--close:hover { background: #e81123; color: #fff; }
.scene-{{sceneId}} .fe-winbtn svg { width: 10px; height: 10px; }

/* ── Command bar (40px) ── */
.scene-{{sceneId}} .fe-cmdbar {
  display: flex; align-items: center;
  flex: 0 0 40px; height: 40px;
  padding: 0 10px;
  background: var(--fe-bg);
  border-bottom: 1px solid var(--fe-divider);
  gap: 2px;
}
.scene-{{sceneId}} .fe-cmd {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px;
  font-size: 12px; color: var(--fe-text);
  background: transparent; border: 0; border-radius: 4px;
  cursor: pointer; white-space: nowrap;
}
.scene-{{sceneId}} .fe-cmd:hover { background: var(--fe-hover); }
.scene-{{sceneId}} .fe-cmd svg { width: 14px; height: 14px; flex-shrink: 0; }
.scene-{{sceneId}} .fe-cmd--icon { padding: 0 8px; }
.scene-{{sceneId}} .fe-cmd--primary { color: var(--fe-accent); font-weight: 600; }
.scene-{{sceneId}} .fe-cmd-divider {
  width: 1px; height: 18px; margin: 0 4px;
  background: var(--fe-border);
}
.scene-{{sceneId}} .fe-cmd-spacer { flex: 1 1 auto; }
.scene-{{sceneId}} .fe-cmd-chev { width: 10px; height: 10px; opacity: 0.65; }

/* ── Address bar (36px) ── */
.scene-{{sceneId}} .fe-addressbar {
  display: flex; align-items: center;
  flex: 0 0 36px; height: 36px;
  padding: 0 10px;
  background: var(--fe-bg);
  border-bottom: 1px solid var(--fe-divider);
  gap: 4px;
}
.scene-{{sceneId}} .fe-navbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: transparent; border: 0; padding: 0; border-radius: 4px;
  color: var(--fe-text); cursor: pointer;
}
.scene-{{sceneId}} .fe-navbtn:hover { background: var(--fe-hover); }
.scene-{{sceneId}} .fe-navbtn--disabled { color: var(--fe-text-mute); cursor: default; }
.scene-{{sceneId}} .fe-navbtn--disabled:hover { background: transparent; }
.scene-{{sceneId}} .fe-navbtn svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .fe-bcwrap {
  flex: 1 1 auto; min-width: 0;
  height: 28px;
  display: flex; align-items: center;
  padding: 0 8px;
  margin: 0 6px;
  background: #ffffff;
  border: 1px solid var(--fe-border);
  border-radius: 4px;
  font-size: 13px; color: var(--fe-text);
  gap: 2px; overflow: hidden;
}
.scene-{{sceneId}} .fe-bc-item {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 6px;
  border-radius: 3px;
  white-space: nowrap;
  cursor: pointer;
}
.scene-{{sceneId}} .fe-bc-item:hover { background: var(--fe-hover); }
.scene-{{sceneId}} .fe-bc-sep {
  display: inline-flex; align-items: center;
  width: 14px; height: 22px;
  color: var(--fe-text-mute);
}
.scene-{{sceneId}} .fe-bc-sep svg { width: 12px; height: 12px; }
.scene-{{sceneId}} .fe-bc-icon { display: inline-flex; }
.scene-{{sceneId}} .fe-bc-icon svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .fe-search {
  display: flex; align-items: center; gap: 6px;
  flex: 0 0 240px;
  height: 28px; padding: 0 10px;
  background: #ffffff;
  border: 1px solid var(--fe-border);
  border-radius: 4px;
  font-size: 13px; color: var(--fe-text-mute);
}
.scene-{{sceneId}} .fe-search svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Body (rail | main) ── */
.scene-{{sceneId}} .fe-body {
  display: flex;
  flex: 1 1 auto; min-height: 0;
  background: var(--fe-body);
}
.scene-{{sceneId}} .fe-rail {
  flex: 0 0 240px; width: 240px;
  background: var(--fe-rail);
  border-right: 1px solid var(--fe-divider);
  padding: 6px 0;
  overflow: hidden;
}
.scene-{{sceneId}} .fe-rail-row {
  display: flex; align-items: center;
  gap: 8px;
  height: 30px; padding: 0 10px 0 8px;
  font-size: 13px; color: var(--fe-text);
  cursor: pointer; position: relative;
}
.scene-{{sceneId}} .fe-rail-row:hover { background: var(--fe-hover); }
.scene-{{sceneId}} .fe-rail-row--active { background: var(--fe-selected); }
.scene-{{sceneId}} .fe-rail-row--active::before {
  content: ""; position: absolute;
  left: 2px; top: 7px; bottom: 7px; width: 3px;
  background: var(--fe-accent); border-radius: 2px;
}
.scene-{{sceneId}} .fe-rail-chev {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  color: var(--fe-text-sec);
  flex-shrink: 0;
}
.scene-{{sceneId}} .fe-rail-chev svg { width: 10px; height: 10px; }
.scene-{{sceneId}} .fe-rail-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px;
  flex-shrink: 0;
}
.scene-{{sceneId}} .fe-rail-icon svg { width: 16px; height: 16px; }
.scene-{{sceneId}} .fe-rail-label {
  flex: 1 1 auto; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scene-{{sceneId}} .fe-rail-row[data-depth="1"] { padding-left: 24px; }
.scene-{{sceneId}} .fe-rail-row[data-depth="2"] { padding-left: 40px; }
.scene-{{sceneId}} .fe-rail-section {
  height: 26px; padding: 0 10px 0 16px;
  display: flex; align-items: center;
  font-size: 11px; color: var(--fe-text-sec);
  text-transform: uppercase; letter-spacing: 0.4px;
  margin-top: 6px;
}

.scene-{{sceneId}} .fe-main {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--fe-body);
  overflow: hidden;
}
.scene-{{sceneId}} .fe-section {
  padding: 14px 22px 6px;
  font-size: 12px; color: var(--fe-text-sec);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.scene-{{sceneId}} .fe-grid {
  flex: 1 1 auto;
  padding: 8px 22px 22px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  align-content: start;
  overflow: hidden;
}
.scene-{{sceneId}} .fe-tile {
  display: flex; flex-direction: column;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px;
  cursor: default;
}
.scene-{{sceneId}} .fe-tile--selected {
  background: var(--fe-selected);
  border: 1px solid rgba(0,120,212,0.55);
  box-shadow: 0 0 0 1px rgba(0,120,212,0.35);
}
.scene-{{sceneId}} .fe-tile--selected .fe-tile-thumb {
  outline: 2px solid #0078d4;
  outline-offset: 1px;
}
.scene-{{sceneId}} .fe-tile-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 4px;
  overflow: hidden;
  background: linear-gradient(135deg, #b3d4ff, #6fa8e8);
  display: flex; align-items: center; justify-content: center;
}
.scene-{{sceneId}} .fe-tile-thumb svg { width: 32px; height: 32px; opacity: 0.55; color: #fff; }
.scene-{{sceneId}} .fe-tile-label {
  margin-top: 8px;
  font-size: 13px;
  color: var(--fe-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Status bar (24px) ── */
.scene-{{sceneId}} .fe-statusbar {
  display: flex; align-items: center;
  flex: 0 0 24px; height: 24px;
  padding: 0 14px;
  background: var(--fe-bg);
  border-top: 1px solid var(--fe-divider);
  font-size: 12px;
  color: var(--fe-text-sec);
}
.scene-{{sceneId}} .fe-status-left { flex: 1 1 auto; }
.scene-{{sceneId}} .fe-status-right { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.scene-{{sceneId}} .fe-viewbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 20px;
  border: 0; background: transparent; padding: 0; border-radius: 3px;
  color: var(--fe-text-sec); cursor: pointer;
}
.scene-{{sceneId}} .fe-viewbtn:hover { background: var(--fe-hover); color: var(--fe-text); }
.scene-{{sceneId}} .fe-viewbtn--active { background: var(--fe-selected); color: var(--fe-accent); }
.scene-{{sceneId}} .fe-viewbtn svg { width: 14px; height: 14px; }

/* ── Global icon coloring ── */
.scene-{{sceneId}} .fe-root svg { fill: currentColor; }
.scene-{{sceneId}} .fe-root svg[aria-hidden] { pointer-events: none; }

/* ── Defensive guard (PR 10d v2 lesson) ── */
.scene-{{sceneId}} .fe-rail svg:not([width]),
.scene-{{sceneId}} .fe-main svg:not([width]),
.scene-{{sceneId}} .fe-cmdbar svg:not([width]),
.scene-{{sceneId}} .fe-bcwrap svg:not([width]) {
  width: 16px; height: 16px; flex-shrink: 0;
}
</style>

<div class="fe-root" data-scene-component="WindowsScene" data-theme="{{theme}}" style="position:absolute;inset:0">
  <div class="fe-window">

    <!-- ═══ TITLEBAR (32px) ═══ -->
    <div class="fe-titlebar">
      <div class="fe-tabs" data-slot="titlebar-tabs">{{{titlebarTabsHtml}}}</div>
      <button class="fe-newtab" aria-label="New tab"><svg aria-hidden="true"><use href="#fe-icon-plus"/></svg></button>
      <div class="fe-titlebar-spacer"></div>
      <div class="fe-wincontrols">
        <button class="fe-winbtn" aria-label="Minimize"><svg aria-hidden="true"><use href="#fe-icon-win-min"/></svg></button>
        <button class="fe-winbtn" aria-label="Maximize"><svg aria-hidden="true"><use href="#fe-icon-win-max"/></svg></button>
        <button class="fe-winbtn fe-winbtn--close" aria-label="Close"><svg aria-hidden="true"><use href="#fe-icon-win-close"/></svg></button>
      </div>
    </div>

    <!-- ═══ COMMAND BAR (40px) ═══ -->
    <div class="fe-cmdbar" data-slot="commandbar">{{{commandBarHtml}}}</div>

    <!-- ═══ ADDRESS BAR (36px) ═══ -->
    <div class="fe-addressbar">
      <button class="fe-navbtn" aria-label="Back"><svg aria-hidden="true"><use href="#fe-icon-arrow-left"/></svg></button>
      <button class="fe-navbtn fe-navbtn--disabled" aria-label="Forward"><svg aria-hidden="true"><use href="#fe-icon-arrow-right"/></svg></button>
      <button class="fe-navbtn" aria-label="Up"><svg aria-hidden="true"><use href="#fe-icon-arrow-up"/></svg></button>
      <div class="fe-bcwrap" data-slot="breadcrumb">{{{breadcrumbHtml}}}</div>
      <div class="fe-search">
        <svg aria-hidden="true"><use href="#fe-icon-search"/></svg>
        <span>{{searchPlaceholder}}</span>
      </div>
    </div>

    <!-- ═══ BODY ═══ -->
    <div class="fe-body">
      <aside class="fe-rail" data-slot="navtree">{{{navTreeHtml}}}</aside>
      <section class="fe-main" data-slot="content">{{{contentHtml}}}</section>
    </div>

    <!-- ═══ STATUS BAR (24px) ═══ -->
    <div class="fe-statusbar">
      <div class="fe-status-left" data-slot="status-left">{{{statusLeftHtml}}}</div>
      <div class="fe-status-right" data-slot="status-right">{{{statusRightHtml}}}</div>
    </div>

  </div>
</div>
