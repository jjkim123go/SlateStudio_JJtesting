<!--
  FormsScene — Wave A Chrome Shell (PR 8c — Productivity Surfaces)
  Models the modern Microsoft Forms web chrome: home / template-gallery / builder / preview.
  All selectors scoped: .scene-{{sceneId}} .fs-bg .fs-*

    [data-state]   : default | more-solutions | ai-reviewing

    {{{bannerHtml}}}      — yellow notification banner (hidden on preview)
    {{{bodyHtml}}}        — main canvas (variant-specific)
    {{{sidePanelHtml}}}   — right side panel (only when state=more-solutions)

  width: 1920px;

.scene-{{sceneId}} .fs-bg .fs-gallery-controls,
.scene-{{sceneId}} .fs-bg .fs-builder-titlebar,
.scene-{{sceneId}} .fs-bg .fs-builder-toolbar,
.scene-{{sceneId}} .fs-bg .fs-preview-topbar { opacity: 0; }

.scene-{{sceneId}} .fs-bg .fs-scenario,
.scene-{{sceneId}} .fs-bg .fs-tmpl,
.scene-{{sceneId}} .fs-bg .fs-hero,
.scene-{{sceneId}} .fs-bg .fs-section,
.scene-{{sceneId}} .fs-bg .fs-ai-banner,
.scene-{{sceneId}} .fs-bg .fs-preview-frame,
.scene-{{sceneId}} .fs-bg .fs-side { opacity: 0; transform: translateY(8px); }

.scene-{{sceneId}} .fs-bg .fs-preview-pause { opacity: 0; }
</style>

<div class="scene-{{sceneId}} fs-bg"
     data-variant="{{variant}}"
     data-state="{{state}}"
     data-side="{{dataSide}}"
     data-show-banner="{{showBanner}}">

  {{{suiteBarHtml}}}
  {{{bannerHtml}}}

  <div class="fs-canvas">
    {{{bodyHtml}}}
    {{{sidePanelHtml}}}
  </div>

  <script type="application/json" data-region="forms-meta">{
    "sceneId": "{{sceneId}}",
    "variant": "{{variant}}",
    "state": "{{state}}",
    "hasSidePanel": {{hasSidePanel}}
  }</script>
</div>
