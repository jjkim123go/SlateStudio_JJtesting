<!--
  ============================================================================
  WhiteboardScene — Synthetic Microsoft Whiteboard Surface (Wave A, PR 8a)
  ============================================================================

  SLOT CONTRACT — Wave A canonical variant: "brainstorm".
  All variant interior content (stickies, cluster labels, live cursors,
  Copilot bubble, reaction bursts) is built ONCE at module-eval inside
  animation.js from SCENE_PROPS. The HTML below renders only the chrome.

  ┌─────────────────────────────┬────────────────────────────────────────────┐
  │ data-slot="board-title"     │ Editable-look board name in toolbar left   │
  ├─────────────────────────────┼────────────────────────────────────────────┤
  │ data-slot="canvas-world"    │ Inner DIV that animation.js populates      │
  │                             │ with stickies / cursors / cluster labels.  │
  │                             │ Has transform: translate3d() scale() set   │
  │                             │ inline by JS to frame the brainstorm.      │
  ├─────────────────────────────┼────────────────────────────────────────────┤
  │ data-slot="copilot-thinking"│ Top-center Copilot status bubble. Hidden   │
  │                             │ by default; JS reveals during Categorize.  │
  ├─────────────────────────────┼────────────────────────────────────────────┤
  │ data-slot="reactions-layer" │ Floating layer for reaction emoji bursts.  │
  └─────────────────────────────┴────────────────────────────────────────────┘

  VARIANT ATTRIBUTES on root .wb-bg:
    data-variant="brainstorm"   — current canonical (Wave A)

  CHROME REGIONS (Wave A owns):
    .wb-toolbar          — top bar (file controls + tool palette + presence)
    .wb-sticky-palette   — floating left-side sticky color palette (12 colors)
    .wb-action-menu      — bottom-right Copilot pill + zoom controls
    .wb-canvas-viewport  — clipping container for the infinite canvas
    .wb-canvas-world     — pannable/zoomable inner world (slot for JS-built content)

  STANDING RULES:
    SR #15 — Fluent UI 2 Filled icons only (inline SVG; no Outline/Regular).
    SR #16 — Animations registered on master (see animation.js).
    Rule #7 — DOM built once; tweens mutate properties only.
    Class prefix: wb-
============================================================================ -->

<style data-component="WhiteboardScene">
/* ── Sticky palette tokens (exposed as CSS custom properties) ── */
.scene-{{sceneId}} .wb-bg {
  --wb-sticky-yellow:  #FFF475;
  --wb-sticky-yellow2: #FFE066;
  --wb-sticky-pink:    #F28B82;
  --wb-sticky-red:     #FF8A80;
  --wb-sticky-orange:  #FFD6A5;
  --wb-sticky-green:   #CCFF90;
  --wb-sticky-mint:    #A7FFEB;
  --wb-sticky-lblue:   #AECBFA;
  --wb-sticky-blue:    #8AB4F8;
  --wb-sticky-purple:  #D7AEFB;
  --wb-sticky-gray:    #E8EAED;
  --wb-sticky-white:   #FFFFFF;

  --wb-canvas-bg:      #FAFAF9;
  --wb-grid-dot:       rgba(120, 120, 120, 0.18);
  --wb-chrome-bg:      #FFFFFF;
  --wb-chrome-border:  #E5E5E5;
  --wb-text:           #1A1A1A;
  --wb-text-sec:       #616161;
  --wb-accent:         #0F6CBD;
  --wb-accent-hover:   #115EA3;
  --wb-shadow-card:    0 1px 2px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.10);
  --wb-shadow-float:   0 8px 16px rgba(0,0,0,0.14), 0 0 2px rgba(0,0,0,0.12);
  --wb-shadow-sticky:  0 1px 1px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.13);
  --wb-copilot-grad:   linear-gradient(135deg, #C770F0 0%, #5C8AF0 100%);

  position: absolute; inset: 0;
  background: var(--wb-canvas-bg);
  font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px;
  color: var(--wb-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

/* ── Canvas viewport (infinite-canvas surface) ── */
.scene-{{sceneId}} .wb-canvas-viewport {
  position: absolute;
  top: 52px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  background-color: var(--wb-canvas-bg);
  background-image: radial-gradient(circle, var(--wb-grid-dot) 1.4px, transparent 1.6px);
  background-size: 28px 28px;
  background-position: 0 0;
}
.scene-{{sceneId}} .wb-canvas-world {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform-origin: 0 0;
  /* JS overrides via inline style: translate3d(x,y,0) scale(s) */
  transform: translate3d(0, 0, 0) scale(1);
  pointer-events: none;
}

/* ── Top toolbar (52px) ── */
.scene-{{sceneId}} .wb-toolbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--wb-chrome-bg);
  border-bottom: 1px solid var(--wb-chrome-border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  z-index: 20;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02);
}
.scene-{{sceneId}} .wb-tb-left {
  display: flex; align-items: center; gap: 4px;
  flex: 0 0 auto;
}
.scene-{{sceneId}} .wb-tb-center {
  flex: 1 1 auto;
  display: flex;
  justify-content: center;
}
.scene-{{sceneId}} .wb-tb-right {
  display: flex; align-items: center; gap: 8px;
  flex: 0 0 auto;
}

/* Toolbar buttons (ghost) */
.scene-{{sceneId}} .wb-tb-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 0; padding: 0; background: transparent;
  color: var(--wb-text);
  border-radius: 4px;
  cursor: pointer;
  transition: background .12s;
}
.scene-{{sceneId}} .wb-tb-btn svg { width: 18px; height: 18px; }
.scene-{{sceneId}} .wb-tb-btn:hover { background: rgba(0,0,0,0.05); }
.scene-{{sceneId}} .wb-tb-divider {
  width: 1px; height: 22px;
  background: var(--wb-chrome-border);
  margin: 0 6px;
}

.scene-{{sceneId}} .wb-board-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--wb-text);
  padding: 4px 8px;
  border-radius: 4px;
  background: transparent;
  margin-left: 4px;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Centered tool palette (pen / highlighter / sticky / text / shape / select) */
.scene-{{sceneId}} .wb-tool-palette {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 4px 6px;
  background: var(--wb-chrome-bg);
  border: 1px solid var(--wb-chrome-border);
  border-radius: 8px;
  box-shadow: var(--wb-shadow-float);
}
.scene-{{sceneId}} .wb-tool-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 32px;
  border: 0; padding: 0; background: transparent;
  color: var(--wb-text);
  border-radius: 4px;
  cursor: pointer;
}
.scene-{{sceneId}} .wb-tool-btn svg { width: 18px; height: 18px; }
.scene-{{sceneId}} .wb-tool-btn:hover { background: rgba(0,0,0,0.05); }
.scene-{{sceneId}} .wb-tool-btn[data-active="1"] {
  background: rgba(15, 108, 189, 0.10);
  color: var(--wb-accent);
}
.scene-{{sceneId}} .wb-tool-btn[data-active="1"]::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; bottom: 1px;
  height: 2px;
  background: var(--wb-accent);
  border-radius: 2px;
}

/* Right cluster: reactions, copilot, presence */
.scene-{{sceneId}} .wb-reactions-btn,
.scene-{{sceneId}} .wb-copilot-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 32px; min-width: 32px;
  padding: 0 8px;
  border: 0; background: transparent; color: var(--wb-text);
  border-radius: 16px;
  cursor: pointer;
}
.scene-{{sceneId}} .wb-reactions-btn svg { width: 18px; height: 18px; }
.scene-{{sceneId}} .wb-reactions-btn:hover { background: rgba(0,0,0,0.05); }
.scene-{{sceneId}} .wb-copilot-btn {
  background: var(--wb-copilot-grad);
  color: #FFFFFF;
  padding: 0 4px;
  width: 32px;
}
.scene-{{sceneId}} .wb-copilot-btn svg { width: 16px; height: 16px; }

/* Presence avatars */
.scene-{{sceneId}} .wb-presence {
  display: inline-flex;
  align-items: center;
  margin-left: 4px;
}
.scene-{{sceneId}} .wb-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid #FFFFFF;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #FFFFFF;
  margin-left: -8px;
  box-sizing: border-box;
  letter-spacing: 0;
}
.scene-{{sceneId}} .wb-avatar:first-child { margin-left: 0; }

/* ── Floating sticky-color palette (left, vertical) ── */
.scene-{{sceneId}} .wb-sticky-palette {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  width: 36px;
  padding: 8px 6px;
  background: var(--wb-chrome-bg);
  border: 1px solid var(--wb-chrome-border);
  border-radius: 8px;
  box-shadow: var(--wb-shadow-float);
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  z-index: 15;
}
.scene-{{sceneId}} .wb-color-chip {
  width: 22px; height: 22px;
  border-radius: 4px;
  border: 1px solid rgba(0,0,0,0.08);
  cursor: pointer;
  margin: 0 auto;
}

/* ── Bottom-right action menu (Copilot pill + zoom) ── */
.scene-{{sceneId}} .wb-action-menu {
  position: absolute;
  right: 16px; bottom: 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  z-index: 18;
}
.scene-{{sceneId}} .wb-copilot-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px;
  padding: 0 14px;
  background: var(--wb-copilot-grad);
  color: #FFFFFF;
  font-weight: 600; font-size: 13px;
  border-radius: 18px;
  border: 0; cursor: pointer;
  box-shadow: var(--wb-shadow-float);
}
.scene-{{sceneId}} .wb-copilot-pill svg { width: 16px; height: 16px; }
.scene-{{sceneId}} .wb-zoom-cluster {
  display: inline-flex;
  align-items: stretch;
  height: 36px;
  background: var(--wb-chrome-bg);
  border: 1px solid var(--wb-chrome-border);
  border-radius: 4px;
  box-shadow: var(--wb-shadow-float);
  overflow: hidden;
}
.scene-{{sceneId}} .wb-zoom-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 100%;
  border: 0; background: transparent;
  color: var(--wb-text);
  cursor: pointer;
}
.scene-{{sceneId}} .wb-zoom-btn svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .wb-zoom-btn:hover { background: rgba(0,0,0,0.05); }
.scene-{{sceneId}} .wb-zoom-pct {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 42px; padding: 0 4px;
  font-size: 12px;
  color: var(--wb-text);
  border-left: 1px solid var(--wb-chrome-border);
  border-right: 1px solid var(--wb-chrome-border);
}

/* ── Copilot "thinking" bubble (top-center) ── */
.scene-{{sceneId}} .wb-copilot-thinking {
  position: absolute;
  top: 68px; left: 50%;
  transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px;
  padding: 0 14px;
  background: var(--wb-chrome-bg);
  border: 1px solid var(--wb-chrome-border);
  border-radius: 18px;
  box-shadow: var(--wb-shadow-float);
  font-size: 13px; font-weight: 500;
  color: var(--wb-text);
  z-index: 22;
  opacity: 0;
}
.scene-{{sceneId}} .wb-copilot-thinking .wb-copilot-mark {
  width: 18px; height: 18px;
  background: var(--wb-copilot-grad);
  border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  color: #FFFFFF;
}
.scene-{{sceneId}} .wb-copilot-thinking .wb-copilot-mark svg { width: 12px; height: 12px; }

/* ── Stickies, cursors, clusters, reactions (built by JS) ── */
.scene-{{sceneId}} .wb-sticky {
  position: absolute;
  width: 142px;
  min-height: 130px;
  padding: 14px 12px 24px 12px;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.32;
  font-weight: 500;
  color: #1A1A1A;
  box-shadow: var(--wb-shadow-sticky);
  box-sizing: border-box;
  transform-origin: 50% 50%;
  word-break: break-word;
  overflow: hidden;
  will-change: transform, opacity;
}
.scene-{{sceneId}} .wb-sticky--title {
  font-size: 15px;
  font-weight: 700;
  background: var(--wb-sticky-yellow2);
}
.scene-{{sceneId}} .wb-sticky-author-dot {
  position: absolute;
  left: 8px; bottom: 8px;
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.85);
  box-sizing: border-box;
}

.scene-{{sceneId}} .wb-cluster-label {
  position: absolute;
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  background: var(--wb-chrome-bg);
  border: 1px solid var(--wb-chrome-border);
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--wb-text);
  box-shadow: var(--wb-shadow-card);
  white-space: nowrap;
  opacity: 0;
  transform-origin: 50% 50%;
}
.scene-{{sceneId}} .wb-cluster-label::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--wb-accent);
}
.scene-{{sceneId}} .wb-cluster-label[data-cluster="performance"]::before { background: #2DA94F; }
.scene-{{sceneId}} .wb-cluster-label[data-cluster="pricing"]::before     { background: #E07B00; }
.scene-{{sceneId}} .wb-cluster-label[data-cluster="onboarding"]::before  { background: #5C8AF0; }

.scene-{{sceneId}} .wb-cursor {
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 0;
  pointer-events: none;
  z-index: 25;
  will-change: transform;
}
.scene-{{sceneId}} .wb-cursor-arrow {
  position: absolute;
  top: 0; left: 0;
  width: 18px; height: 18px;
}
.scene-{{sceneId}} .wb-cursor-pill {
  position: absolute;
  top: -20px; left: 6px;
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  color: #FFFFFF;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.20);
}

.scene-{{sceneId}} .wb-reaction {
  position: absolute;
  font-size: 28px;
  line-height: 1;
  pointer-events: none;
  user-select: none;
  opacity: 0;
  z-index: 26;
  will-change: transform, opacity;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
}

/* ────────────────────────────────────────────────────────────────────────
 * Wave B — variant: 'diagramMode'
 * SVG layer covers the canvas-world; uses native viewport coordinates
 * (no world transform). Both rough and clean path layers are children of
 * the same <svg> with MATCHED GEOMETRY — the refine effect is an opacity
 * crossfade only (no path mutation).
 * ──────────────────────────────────────────────────────────────────────── */
.scene-{{sceneId}} .wb-dg-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 12;
  overflow: visible;
}
.scene-{{sceneId}} .wb-dg-box,
.scene-{{sceneId}} .wb-dg-arrow {
  pointer-events: none;
}
.scene-{{sceneId}} .wb-dg-rough,
.scene-{{sceneId}} .wb-dg-clean,
.scene-{{sceneId}} .wb-dg-rough-arrow,
.scene-{{sceneId}} .wb-dg-clean-arrow {
  will-change: opacity, stroke-dashoffset;
}

/* ────────────────────────────────────────────────────────────────────────
 * Wave B — variant: 'templateRetro'
 * 4-column retrospective frame in viewport coords (no world transform).
 * ──────────────────────────────────────────────────────────────────────── */
.scene-{{sceneId}} .wb-rt-frame {
  position: absolute;
  background: #FFFFFF;
  border: 1px solid #D1D1D1;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  z-index: 11;
  will-change: opacity;
}
.scene-{{sceneId}} .wb-rt-col {
  position: absolute;
  top: 0;
  bottom: 0;
}
.scene-{{sceneId}} .wb-rt-col-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
  font-size: 22px;
  font-weight: 600;
  color: #1A1A1A;
  letter-spacing: 0.2px;
  border-bottom: 2px solid #E5E5E5;
  background: #FAFAFA;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  will-change: opacity;
}
.scene-{{sceneId}} .wb-rt-col-divider {
  position: absolute;
  top: 56px;
  bottom: 0;
  width: 1px;
  background: #E5E5E5;
  will-change: transform;
}
.scene-{{sceneId}} .wb-rt-sticky {
  position: absolute;
  border-radius: 6px;
  box-shadow:
    0 2px 6px rgba(0, 0, 0, 0.10),
    0 1px 2px rgba(0, 0, 0, 0.06);
  padding: 16px 18px 28px 18px;
  box-sizing: border-box;
  z-index: 14;
  font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
  display: flex;
  align-items: flex-start;
  will-change: transform, opacity;
}
.scene-{{sceneId}} .wb-rt-sticky-text {
  display: block;
  font-size: 18px;
  line-height: 1.32;
  color: #1A1A1A;
  font-weight: 500;
  word-wrap: break-word;
}
.scene-{{sceneId}} .wb-rt-sticky-author-dot {
  position: absolute;
  bottom: 8px;
  right: 10px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85);
}
.scene-{{sceneId}} .wb-rt-cluster-bg {
  position: absolute;
  background: rgba(15, 108, 189, 0.08);
  border: 1.5px dashed rgba(15, 108, 189, 0.45);
  border-radius: 12px;
  z-index: 13;
  will-change: opacity;
}
</style>

<!--
  Fluent System Icons (filled variants only) — clean-room geometry inspired by
  the Fluent System Icons set. Used via <svg><use href="#wb-icon-..."/></svg>.
-->

<div class="wb-bg" data-scene-component="WhiteboardScene" data-variant="brainstorm">

  <!-- ═══ INFINITE CANVAS VIEWPORT (sized to fit under toolbar) ═══ -->
  <div class="wb-canvas-viewport">
    <div class="wb-canvas-world" data-slot="canvas-world"></div>
  </div>

  <!-- ═══ TOP TOOLBAR (52px) ═══ -->
  <div class="wb-toolbar">
    <!-- Left: file/share controls + board name -->
    <div class="wb-tb-left">
      <button class="wb-tb-btn" aria-label="Home"><svg aria-hidden="true"><use href="#wb-icon-home"/></svg></button>
      <button class="wb-tb-btn" aria-label="Undo"><svg aria-hidden="true"><use href="#wb-icon-undo"/></svg></button>
      <button class="wb-tb-btn" aria-label="Redo"><svg aria-hidden="true"><use href="#wb-icon-redo"/></svg></button>
      <span class="wb-tb-divider" aria-hidden="true"></span>
      <span class="wb-board-name" data-slot="board-title">{{boardTitle}}</span>
    </div>

    <!-- Center: tool palette (all Filled icons) -->
    <div class="wb-tb-center">
      <div class="wb-tool-palette" role="toolbar" aria-label="Whiteboard tools">
        <button class="wb-tool-btn" data-tool="pen" aria-label="Pen"><svg aria-hidden="true"><use href="#wb-icon-pen"/></svg></button>
        <button class="wb-tool-btn" data-tool="highlighter" aria-label="Highlighter"><svg aria-hidden="true"><use href="#wb-icon-highlighter"/></svg></button>
        <button class="wb-tool-btn" data-tool="sticky" data-active="1" aria-label="Sticky note"><svg aria-hidden="true"><use href="#wb-icon-sticky"/></svg></button>
        <button class="wb-tool-btn" data-tool="text" aria-label="Text"><svg aria-hidden="true"><use href="#wb-icon-text"/></svg></button>
        <button class="wb-tool-btn" data-tool="shape" aria-label="Shape"><svg aria-hidden="true"><use href="#wb-icon-shapes"/></svg></button>
        <button class="wb-tool-btn" data-tool="select" aria-label="Select"><svg aria-hidden="true"><use href="#wb-icon-cursor"/></svg></button>
      </div>
    </div>

    <!-- Right: reactions, copilot diamond, presence -->
    <div class="wb-tb-right">
      <button class="wb-reactions-btn" aria-label="Reactions"><svg aria-hidden="true"><use href="#wb-icon-emoji"/></svg></button>
      <button class="wb-copilot-btn" data-slot="copilot-diamond" aria-label="Copilot"><svg aria-hidden="true"><use href="#wb-icon-sparkle"/></svg></button>
      <span class="wb-presence" aria-label="Collaborators">
        <span class="wb-avatar" style="background:#0F6CBD">AV</span>
        <span class="wb-avatar" style="background:#0E7A0D">SM</span>
        <span class="wb-avatar" style="background:#7719AA">JR</span>
        <span class="wb-avatar" style="background:#D83B01">MO</span>
      </span>
    </div>
  </div>

  <!-- ═══ FLOATING STICKY-COLOR PALETTE (left) ═══ -->
  <div class="wb-sticky-palette" aria-label="Sticky colors">
    <span class="wb-color-chip" style="background:var(--wb-sticky-yellow)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-yellow2)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-pink)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-red)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-orange)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-green)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-mint)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-lblue)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-blue)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-purple)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-gray)"></span>
    <span class="wb-color-chip" style="background:var(--wb-sticky-white)"></span>
  </div>

  <!-- ═══ COPILOT THINKING BUBBLE (top-center, hidden by default) ═══ -->
  <div class="wb-copilot-thinking" data-slot="copilot-thinking">
    <span class="wb-copilot-mark"><svg aria-hidden="true"><use href="#wb-icon-sparkle"/></svg></span>
    <span class="wb-copilot-thinking-text">Categorizing 12 ideas…</span>
  </div>

  <!-- ═══ BOTTOM-RIGHT ACTION MENU ═══ -->
  <div class="wb-action-menu">
    <button class="wb-copilot-pill" aria-label="Copilot"><svg aria-hidden="true"><use href="#wb-icon-sparkle"/></svg><span>Copilot</span></button>
    <div class="wb-zoom-cluster">
      <button class="wb-zoom-btn" aria-label="Zoom out"><svg aria-hidden="true"><use href="#wb-icon-zoom-out"/></svg></button>
      <span class="wb-zoom-pct">100%</span>
      <button class="wb-zoom-btn" aria-label="Zoom in"><svg aria-hidden="true"><use href="#wb-icon-zoom-in"/></svg></button>
      <button class="wb-zoom-btn" aria-label="Fit to screen"><svg aria-hidden="true"><use href="#wb-icon-fit"/></svg></button>
    </div>
  </div>

</div>
