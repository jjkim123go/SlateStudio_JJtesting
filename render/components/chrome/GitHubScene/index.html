<!--
  ============================================================================
  GitHubScene — github.com light theme, dual variant — PR 10e Wave A
  ============================================================================

  SLOT CONTRACT (Wave B passes via SCF props):
    {{searchPlaceholder}}     — Top-bar search box placeholder
    {{repoOwner}}             — Repo owner text (e.g. "contoso")
    {{repoName}}              — Repo name text (e.g. "billing-service")
    {{repoBranchHtml}}        — Branch chip ("main")
    {{starsCount}}            — Star count text (e.g. "1.2k")
    {{forksCount}}            — Fork count text
    {{watchersCount}}         — Watchers count text
    {{repoTabsHtml}}          — Code/Issues/PR/Actions/Projects/Wiki/Security/Insights
    {{bodyHtml}}              — Variant body (repo-home OR pr-diff)
    {{footerStatusHtml}}      — Optional footer

  VARIANT ATTRIBUTES on .gh-root:
    data-variant="repo-home"  — repo home page (file tree + about + readme)
    data-variant="pr-diff"    — pull-request page (sub-tabs + diff + thread)
    data-theme="light"        (only light variant in scope for PR 10e)

  CHROME REGIONS:
    .gh-topbar       60px — global header (logo, search, +, bell, avatar)
    .gh-repo-header  84px — repo title + counts + tabs
    .gh-body         flex — variant slot
    .gh-footer       28px — optional

  Standing Rule #15: Octicons (filled style). Single-path solid fills.
    Window controls n/a (no chrome wrapper — this is the github.com page itself).
  ============================================================================ -->

<style data-component="GitHubScene">
/* ============================================================================
   DENSITY SPEC (measured at 1920×1080):
     Topbar             60px
     Repo header        84px (title row 38px + tab strip 46px)
     Repo tab font      14px
     Body font          14px
     Code/diff font     12px SFMono / Cascadia Mono
     File-tree row      32px
     Diff line height   20px
   ============================================================================ */

.scene-{{sceneId}} .gh-root {
  --gh-bg:           #f6f8fa;
  --gh-surface:      #ffffff;
  --gh-header:       #ffffff;
  --gh-text:         #1f2328;
  --gh-text-sec:     #656d76;
  --gh-text-mute:    #818b98;
  --gh-border:       #d0d7de;
  --gh-border-mute:  #d8dee4;
  --gh-link:         #0969da;
  --gh-link-hover:   #0550ae;
  --gh-accent:       #0969da;
  --gh-success:      #1a7f37;
  --gh-success-bg:   #dafbe1;
  --gh-success-emp:  #2da44e;
  --gh-danger:       #cf222e;
  --gh-danger-bg:    #ffebe9;
  --gh-merged:       #8250df;
  --gh-warn:         #9a6700;
  --gh-warn-bg:      #fff8c5;
  --gh-btn-bg:       #f6f8fa;
  --gh-btn-bg-hover: #f3f4f6;
  --gh-btn-border:   rgba(31,35,40,0.15);
  --gh-diff-add-bg:    #dafbe1;
  --gh-diff-add-emph:  #aceebb;
  --gh-diff-rm-bg:     #ffebe9;
  --gh-diff-rm-emph:   #ffcecb;
  --gh-shadow:       0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);

  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 40px;
  background: linear-gradient(135deg, #1a2332 0%, #24292f 50%, #303841 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  font-size: 14px;
  color: var(--gh-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

.scene-{{sceneId}} .gh-window {
  position: relative;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--gh-bg);
  border-radius: 8px;
  box-shadow: var(--gh-shadow);
  overflow: hidden;
  opacity: 0;
}

/* ── Topbar (60px) ── */
.scene-{{sceneId}} .gh-topbar {
  display: flex; align-items: center;
  flex: 0 0 60px; height: 60px;
  background: var(--gh-header);
  border-bottom: 1px solid var(--gh-border);
  padding: 0 16px;
  gap: 12px;
}
.scene-{{sceneId}} .gh-topbar-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  color: var(--gh-text);
  flex-shrink: 0;
}
.scene-{{sceneId}} .gh-topbar-mark svg { width: 32px; height: 32px; }
.scene-{{sceneId}} .gh-topbar-search {
  display: flex; align-items: center; gap: 8px;
  flex: 0 1 320px;
  height: 28px; padding: 0 10px;
  background: var(--gh-bg);
  border: 1px solid var(--gh-border);
  border-radius: 6px;
  font-size: 13px;
  color: var(--gh-text-sec);
}
.scene-{{sceneId}} .gh-topbar-search svg { width: 14px; height: 14px; opacity: 0.6; }
.scene-{{sceneId}} .gh-topbar-search-kbd {
  margin-left: auto;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px; color: var(--gh-text-mute);
  border: 1px solid var(--gh-border);
  border-radius: 3px;
  padding: 1px 5px;
}
.scene-{{sceneId}} .gh-topbar-spacer { flex: 1 1 auto; }
.scene-{{sceneId}} .gh-topbar-actions { display: inline-flex; align-items: center; gap: 6px; }
.scene-{{sceneId}} .gh-topbar-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  background: transparent; border: 0; padding: 0; border-radius: 6px;
  color: var(--gh-text); cursor: pointer;
}
.scene-{{sceneId}} .gh-topbar-iconbtn:hover { background: var(--gh-btn-bg); }
.scene-{{sceneId}} .gh-topbar-iconbtn svg { width: 16px; height: 16px; }
.scene-{{sceneId}} .gh-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #0969da, #54aeff);
  color: #fff; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── Repo header (84px) ── */
.scene-{{sceneId}} .gh-repo-header {
  display: flex; flex-direction: column;
  flex: 0 0 84px;
  background: var(--gh-header);
  border-bottom: 1px solid var(--gh-border);
  padding: 0 24px;
}
.scene-{{sceneId}} .gh-repo-title-row {
  display: flex; align-items: center;
  flex: 0 0 38px; height: 38px;
  gap: 8px; padding-top: 4px;
  font-size: 16px;
}
.scene-{{sceneId}} .gh-repo-mark { display: inline-flex; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-repo-mark svg { width: 16px; height: 16px; }
.scene-{{sceneId}} .gh-repo-owner { color: var(--gh-link); font-weight: 600; }
.scene-{{sceneId}} .gh-repo-slash { color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-repo-name { color: var(--gh-link); font-weight: 600; }
.scene-{{sceneId}} .gh-repo-public {
  margin-left: 6px;
  font-size: 12px; color: var(--gh-text-sec);
  border: 1px solid var(--gh-border);
  border-radius: 12px;
  padding: 1px 8px;
}
.scene-{{sceneId}} .gh-repo-actions {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 6px;
}
.scene-{{sceneId}} .gh-repo-chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 28px; padding: 0 10px;
  font-size: 12px; color: var(--gh-text);
  background: var(--gh-btn-bg);
  border: 1px solid var(--gh-btn-border);
  border-radius: 6px;
  cursor: pointer;
}
.scene-{{sceneId}} .gh-repo-chip svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .gh-repo-chip-count {
  margin-left: 4px; padding-left: 8px;
  border-left: 1px solid var(--gh-border);
  color: var(--gh-text); font-weight: 600;
}
.scene-{{sceneId}} .gh-repo-tabs {
  display: flex; align-items: stretch;
  flex: 0 0 46px; height: 46px;
  gap: 0; margin: 0 -8px;
}
.scene-{{sceneId}} .gh-repo-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px;
  margin: 0 4px;
  font-size: 14px; color: var(--gh-text);
  position: relative; cursor: pointer;
  height: 100%;
  border-radius: 6px 6px 0 0;
}
.scene-{{sceneId}} .gh-repo-tab:hover { background: rgba(208,215,222,0.32); }
.scene-{{sceneId}} .gh-repo-tab svg { width: 16px; height: 16px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-repo-tab--active { font-weight: 600; }
.scene-{{sceneId}} .gh-repo-tab--active::after {
  content: ""; position: absolute;
  left: 8px; right: 8px; bottom: 0; height: 3px;
  background: #fd8c73;
  border-radius: 2px;
}
.scene-{{sceneId}} .gh-repo-tab-count {
  font-size: 12px; padding: 1px 6px;
  background: rgba(175,184,193,0.2);
  border-radius: 10px;
  color: var(--gh-text);
  font-weight: 500;
}

/* ── Body ── */
.scene-{{sceneId}} .gh-body {
  flex: 1 1 auto; min-height: 0;
  background: var(--gh-bg);
  overflow: hidden;
}

/* ── Variant: repo-home ── */
.scene-{{sceneId}} .gh-rh {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 296px;
  gap: 24px;
  padding: 24px;
  height: 100%;
  box-sizing: border-box;
}
.scene-{{sceneId}} .gh-rh-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.scene-{{sceneId}} .gh-rh-aside { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.scene-{{sceneId}} .gh-rh-action-bar {
  display: flex; align-items: center; gap: 8px;
}
.scene-{{sceneId}} .gh-rh-branch {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  background: var(--gh-btn-bg);
  border: 1px solid var(--gh-btn-border);
  border-radius: 6px;
  font-size: 14px; color: var(--gh-text);
  font-weight: 500;
}
.scene-{{sceneId}} .gh-rh-branch svg { width: 16px; height: 16px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-rh-branch-chev { width: 12px; height: 12px; opacity: 0.7; }
.scene-{{sceneId}} .gh-rh-action-spacer { flex: 1 1 auto; }
.scene-{{sceneId}} .gh-rh-codebtn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 14px;
  background: #2da44e; color: #ffffff;
  border: 1px solid rgba(31,35,40,0.15);
  border-radius: 6px;
  font-size: 14px; font-weight: 500;
}
.scene-{{sceneId}} .gh-rh-codebtn svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .gh-rh-files {
  background: var(--gh-surface);
  border: 1px solid var(--gh-border);
  border-radius: 6px;
  overflow: hidden;
}
.scene-{{sceneId}} .gh-rh-file-head {
  display: flex; align-items: center;
  height: 40px; padding: 0 16px;
  background: var(--gh-bg);
  border-bottom: 1px solid var(--gh-border);
  font-size: 12px; color: var(--gh-text-sec);
  gap: 12px;
}
.scene-{{sceneId}} .gh-rh-file-head-author {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--gh-text);
}
.scene-{{sceneId}} .gh-rh-file-head-author .gh-avatar { width: 20px; height: 20px; font-size: 9px; }
.scene-{{sceneId}} .gh-rh-file-head-msg { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-{{sceneId}} .gh-rh-file-head-meta { color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-rh-file-row {
  display: flex; align-items: center;
  height: 32px; padding: 0 16px;
  border-bottom: 1px solid var(--gh-border-mute);
  font-size: 14px;
  gap: 12px;
}
.scene-{{sceneId}} .gh-rh-file-row:last-child { border-bottom: 0; }
.scene-{{sceneId}} .gh-rh-file-row:hover { background: var(--gh-bg); }
.scene-{{sceneId}} .gh-rh-file-icon { display: inline-flex; color: #54aeff; }
.scene-{{sceneId}} .gh-rh-file-icon svg { width: 16px; height: 16px; }
.scene-{{sceneId}} .gh-rh-file-icon--folder { color: #54aeff; }
.scene-{{sceneId}} .gh-rh-file-icon--file { color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-rh-file-name {
  flex: 0 0 240px;
  color: var(--gh-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scene-{{sceneId}} .gh-rh-file-name a, .scene-{{sceneId}} .gh-rh-file-name { text-decoration: none; }
.scene-{{sceneId}} .gh-rh-file-msg {
  flex: 1 1 auto; min-width: 0;
  color: var(--gh-text-sec);
  font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scene-{{sceneId}} .gh-rh-file-time {
  flex: 0 0 auto;
  color: var(--gh-text-sec);
  font-size: 12px;
}
.scene-{{sceneId}} .gh-rh-readme {
  background: var(--gh-surface);
  border: 1px solid var(--gh-border);
  border-radius: 6px;
  overflow: hidden;
}
.scene-{{sceneId}} .gh-rh-readme-head {
  display: flex; align-items: center;
  height: 40px; padding: 0 16px;
  background: var(--gh-bg);
  border-bottom: 1px solid var(--gh-border);
  font-size: 14px; color: var(--gh-text); font-weight: 600;
  gap: 6px;
}
.scene-{{sceneId}} .gh-rh-readme-head svg { width: 16px; height: 16px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-rh-readme-body {
  padding: 24px 32px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--gh-text);
}
.scene-{{sceneId}} .gh-rh-readme-body h1 {
  font-size: 28px; margin: 0 0 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--gh-border);
  font-weight: 600;
}
.scene-{{sceneId}} .gh-rh-readme-body h2 {
  font-size: 20px; margin: 18px 0 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--gh-border);
  font-weight: 600;
}
.scene-{{sceneId}} .gh-rh-readme-body p { margin: 6px 0; }
.scene-{{sceneId}} .gh-rh-readme-body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  background: rgba(175,184,193,0.2);
  border-radius: 4px;
  padding: 1px 6px;
}
.scene-{{sceneId}} .gh-rh-badge-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 12px; }
.scene-{{sceneId}} .gh-rh-badge {
  display: inline-flex; align-items: center;
  height: 20px; padding: 0 6px;
  font-size: 11px;
  border-radius: 3px;
  color: #ffffff;
}
.scene-{{sceneId}} .gh-rh-badge--build  { background: #2da44e; }
.scene-{{sceneId}} .gh-rh-badge--cov    { background: #1f6feb; }
.scene-{{sceneId}} .gh-rh-badge--lic    { background: #6e7681; }

/* About card */
.scene-{{sceneId}} .gh-rh-about {
  border-bottom: 1px solid var(--gh-border-mute);
  padding-bottom: 16px;
  font-size: 14px;
}
.scene-{{sceneId}} .gh-rh-about-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 16px; font-weight: 600;
  margin-bottom: 8px;
}
.scene-{{sceneId}} .gh-rh-about-text { color: var(--gh-text); margin: 0 0 12px; }
.scene-{{sceneId}} .gh-rh-about-meta { color: var(--gh-text-sec); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.scene-{{sceneId}} .gh-rh-about-meta-row { display: flex; align-items: center; gap: 6px; }
.scene-{{sceneId}} .gh-rh-about-meta-row svg { width: 14px; height: 14px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-rh-about-topics { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.scene-{{sceneId}} .gh-rh-topic {
  display: inline-flex; align-items: center;
  height: 22px; padding: 0 10px;
  font-size: 12px;
  background: #ddf4ff; color: #0969da;
  border-radius: 12px;
}

/* ── Variant: pr-diff ── */
.scene-{{sceneId}} .gh-pr {
  padding: 24px;
  height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 16px;
  overflow: hidden;
}
.scene-{{sceneId}} .gh-pr-head { display: flex; flex-direction: column; gap: 8px; }
.scene-{{sceneId}} .gh-pr-title {
  font-size: 22px; color: var(--gh-text);
  font-weight: 400;
  line-height: 1.3;
}
.scene-{{sceneId}} .gh-pr-num { color: var(--gh-text-sec); font-weight: 300; margin-left: 6px; }
.scene-{{sceneId}} .gh-pr-meta { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-pr-status {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 12px;
  background: var(--gh-success-emp); color: #ffffff;
  border-radius: 14px;
  font-size: 13px; font-weight: 500;
}
.scene-{{sceneId}} .gh-pr-status svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .gh-pr-subtabs {
  display: flex; align-items: stretch;
  border-bottom: 1px solid var(--gh-border);
  gap: 8px;
  margin-bottom: -1px;
}
.scene-{{sceneId}} .gh-pr-subtab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  font-size: 14px; color: var(--gh-text);
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
  margin-bottom: -1px;
  position: relative;
}
.scene-{{sceneId}} .gh-pr-subtab svg { width: 16px; height: 16px; color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-pr-subtab--active {
  background: var(--gh-bg);
  border-color: var(--gh-border);
  border-bottom-color: var(--gh-bg);
  font-weight: 600;
  color: var(--gh-text);
}
.scene-{{sceneId}} .gh-pr-subtab-count {
  font-size: 12px; padding: 1px 6px;
  background: rgba(175,184,193,0.2);
  border-radius: 10px;
}
.scene-{{sceneId}} .gh-pr-files {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; gap: 14px;
  overflow: hidden;
}
.scene-{{sceneId}} .gh-pr-file {
  background: var(--gh-surface);
  border: 1px solid var(--gh-border);
  border-radius: 6px;
  overflow: hidden;
}
.scene-{{sceneId}} .gh-pr-file-head {
  display: flex; align-items: center;
  height: 38px; padding: 0 12px;
  background: var(--gh-bg);
  border-bottom: 1px solid var(--gh-border);
  gap: 8px;
  font-size: 13px;
}
.scene-{{sceneId}} .gh-pr-file-chev { color: var(--gh-text-sec); display: inline-flex; }
.scene-{{sceneId}} .gh-pr-file-chev svg { width: 12px; height: 12px; }
.scene-{{sceneId}} .gh-pr-file-stat-add { color: var(--gh-success); font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; }
.scene-{{sceneId}} .gh-pr-file-stat-rm  { color: var(--gh-danger); font-weight: 600; font-family: ui-monospace, SFMono-Regular, monospace; }
.scene-{{sceneId}} .gh-pr-file-name {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; color: var(--gh-text); font-weight: 600;
}
.scene-{{sceneId}} .gh-pr-file-spacer { flex: 1 1 auto; }
.scene-{{sceneId}} .gh-pr-file-action {
  display: inline-flex; align-items: center;
  width: 26px; height: 26px;
  background: transparent; border: 0;
  color: var(--gh-text-sec);
  justify-content: center;
}
.scene-{{sceneId}} .gh-pr-file-action svg { width: 14px; height: 14px; }
.scene-{{sceneId}} .gh-pr-diff {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 20px;
  color: var(--gh-text);
}
.scene-{{sceneId}} .gh-pr-diff-row { display: flex; min-height: 20px; }
.scene-{{sceneId}} .gh-pr-diff-num {
  flex: 0 0 50px;
  padding: 0 10px;
  text-align: right;
  color: rgba(31,35,40,0.5);
  user-select: none;
  background: var(--gh-bg);
  border-right: 1px solid var(--gh-border-mute);
}
.scene-{{sceneId}} .gh-pr-diff-num--right { background: var(--gh-bg); }
.scene-{{sceneId}} .gh-pr-diff-marker {
  flex: 0 0 16px;
  text-align: center;
  user-select: none;
  color: rgba(31,35,40,0.5);
}
.scene-{{sceneId}} .gh-pr-diff-code {
  flex: 1 1 auto;
  padding: 0 10px;
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
}
.scene-{{sceneId}} .gh-pr-diff-row--add { background: var(--gh-diff-add-bg); }
.scene-{{sceneId}} .gh-pr-diff-row--add .gh-pr-diff-num { background: #ccffd8; color: var(--gh-success); }
.scene-{{sceneId}} .gh-pr-diff-row--rm  { background: var(--gh-diff-rm-bg); }
.scene-{{sceneId}} .gh-pr-diff-row--rm  .gh-pr-diff-num { background: #ffd7d5; color: var(--gh-danger); }
.scene-{{sceneId}} .gh-pr-diff-hunk {
  background: #ddf4ff;
  color: var(--gh-text-sec);
  padding: 4px 14px;
  font-size: 12px;
}
.scene-{{sceneId}} .gh-pr-comment {
  margin: 0 12px 12px;
  border: 1px solid var(--gh-border);
  border-radius: 6px;
  background: var(--gh-bg);
}
.scene-{{sceneId}} .gh-pr-comment-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--gh-border);
  font-size: 13px;
}
.scene-{{sceneId}} .gh-pr-comment-head .gh-avatar { width: 20px; height: 20px; font-size: 10px; }
.scene-{{sceneId}} .gh-pr-comment-author { font-weight: 600; color: var(--gh-text); }
.scene-{{sceneId}} .gh-pr-comment-time { color: var(--gh-text-sec); }
.scene-{{sceneId}} .gh-pr-comment-body {
  padding: 12px;
  font-size: 14px;
  color: var(--gh-text);
  line-height: 1.5;
  background: var(--gh-surface);
}
.scene-{{sceneId}} .gh-pr-comment-body code {
  font-family: ui-monospace, SFMono-Regular, monospace;
  background: rgba(175,184,193,0.2);
  padding: 1px 5px; border-radius: 3px; font-size: 12px;
}

/* ── Footer ── */
.scene-{{sceneId}} .gh-footer {
  display: none;
  flex: 0 0 28px; height: 28px;
  padding: 0 16px;
  align-items: center;
  font-size: 11px; color: var(--gh-text-sec);
  border-top: 1px solid var(--gh-border);
  background: var(--gh-surface);
}

/* ── Global icon coloring + defensive guards ── */
.scene-{{sceneId}} .gh-root svg { fill: currentColor; }
.scene-{{sceneId}} .gh-rh svg:not([width]),
.scene-{{sceneId}} .gh-pr svg:not([width]),
.scene-{{sceneId}} .gh-repo-header svg:not([width]),
.scene-{{sceneId}} .gh-topbar svg:not([width]) {
  width: 16px; height: 16px; flex-shrink: 0;
}
</style>

<div class="gh-root" data-scene-component="GitHubScene" data-variant="{{variant}}" data-theme="{{theme}}" style="position:absolute;inset:0">
  <div class="gh-window">

    <!-- ═══ TOPBAR ═══ -->
    <div class="gh-topbar">
      <div class="gh-topbar-mark"><svg aria-hidden="true"><use href="#gh-icon-mark"/></svg></div>
      <div class="gh-topbar-search">
        <svg aria-hidden="true"><use href="#gh-icon-search"/></svg>
        <span>{{searchPlaceholder}}</span>
        <span class="gh-topbar-search-kbd">/</span>
      </div>
      <div class="gh-topbar-spacer"></div>
      <div class="gh-topbar-actions">
        <button class="gh-topbar-iconbtn" aria-label="New"><svg aria-hidden="true"><use href="#gh-icon-plus"/></svg></button>
        <button class="gh-topbar-iconbtn" aria-label="Notifications"><svg aria-hidden="true"><use href="#gh-icon-bell"/></svg></button>
        <div class="gh-avatar" aria-label="Account">A</div>
      </div>
    </div>

    <!-- ═══ REPO HEADER ═══ -->
    <div class="gh-repo-header">
      <div class="gh-repo-title-row">
        <span class="gh-repo-mark"><svg aria-hidden="true"><use href="#gh-icon-repo"/></svg></span>
        <span class="gh-repo-owner">{{repoOwner}}</span>
        <span class="gh-repo-slash">/</span>
        <span class="gh-repo-name">{{repoName}}</span>
        <span class="gh-repo-public">Public</span>
        <div class="gh-repo-actions">
          <button class="gh-repo-chip">
            <svg aria-hidden="true"><use href="#gh-icon-eye"/></svg>
            Watch
            <span class="gh-repo-chip-count">{{watchersCount}}</span>
          </button>
          <button class="gh-repo-chip">
            <svg aria-hidden="true"><use href="#gh-icon-fork"/></svg>
            Fork
            <span class="gh-repo-chip-count">{{forksCount}}</span>
          </button>
          <button class="gh-repo-chip">
            <svg aria-hidden="true"><use href="#gh-icon-star"/></svg>
            Star
            <span class="gh-repo-chip-count">{{starsCount}}</span>
          </button>
        </div>
      </div>
      <div class="gh-repo-tabs" data-slot="tabs">{{{repoTabsHtml}}}</div>
    </div>

    <!-- ═══ BODY (variant slot) ═══ -->
    <div class="gh-body" data-slot="body">{{{bodyHtml}}}</div>

    <!-- ═══ FOOTER (hidden by default) ═══ -->
    <div class="gh-footer" data-slot="footer">{{{footerStatusHtml}}}</div>

  </div>
</div>
