<!--
  ============================================================================
  EdgeBrowserScene — High-Fidelity Chrome Shell (Wave A, PR 10c)
  ============================================================================

  SLOT CONTRACT — Wave B agents fill these named regions:
  ┌─────────────────────────┬────────────────────────────────────────────────┐
  │ data-slot="tab-list"    │ Container for <div class="edge-tab"> children  │
  │                         │ Each tab: favicon + title + close button.      │
  │                         │ First tab marked .edge-tab--active by default. │
  ├─────────────────────────┼────────────────────────────────────────────────┤
  │ data-slot="tab-favicon" │ SVG/img element for the active tab's favicon.  │
  │                         │ Defaults to globe icon (#edge-icon-globe).     │
  ├─────────────────────────┼────────────────────────────────────────────────┤
  │ data-slot="page-title"  │ Plain text: title shown in the active tab.     │
  │                         │ Default: "New tab"                             │
  ├─────────────────────────┼────────────────────────────────────────────────┤
  │ data-slot="url"         │ Plain text or inline HTML for the URL bar.     │
  │                         │ Default: "Search or enter web address"         │
  ├─────────────────────────┼────────────────────────────────────────────────┤
  │ data-slot="bookmarks"   │ Container for <a class="edge-bm-item"> items. │
  │                         │ Each item: 16×16 favicon + truncated label.    │
  ├─────────────────────────┼────────────────────────────────────────────────┤
  │ data-slot="page-content"│ Full page body (HTML). Scrollable container.   │
  │                         │ Default: empty white page.                     │
  └─────────────────────────┴────────────────────────────────────────────────┘

  VARIANT ATTRIBUTES on root .edge-bg:
    data-show-bookmarks="true|false"  — toggle bookmarks bar visibility
    data-url-focused="true|false"     — URL bar focus/unfocus visual state
    data-tab-count="N"                — used for tab auto-sizing CSS

  CHROME REGIONS (Wave A owns these):
    .edge-titlebar    — integrated with tabstrip; window controls top-right
    .edge-tabstrip    — tab row with active/inactive tabs + new-tab (+)
    .edge-toolbar     — nav buttons + URL bar + star/extensions/profile/menu
    .edge-bookmarksbar— favorites bar below toolbar
    .edge-content     — page body slot
============================================================================ -->

<style data-component="EdgeBrowserScene">
/* ============================================================================
   DENSITY SPECIFICATION — measured from refs/edge/01-newtab-startpage.png
   at 1920×1080 viewport. Wave B agents MUST use these values.
   ============================================================================
   TABSTRIP (integrated titlebar):
     Total height .............. 36px
     Tab pill height ........... 32px  (4px top inset from strip top)
     Tab max-width ............. 240px (auto-shrinks to fit; min ~52px)
     Tab font-size ............. 12px  (Segoe UI Regular)
     Tab favicon ............... 16×16px
     Tab close icon ............ 14×14px
     Tab horizontal padding .... 10px each side
     Tab gap ................... 2px between tabs
     Tab border-radius (top) ... 8px
     New-tab (+) button ........ 28×28px
     Window controls ........... 46×36px each (minimize · maximize · close)

   TOOLBAR:
     Total height .............. 46px
     Nav button size ........... 30×30px  (border-radius: 50%)
     Nav icon size ............. 16×16px
     Nav button gap ............ 4px
     URL bar height ............ 34px
     URL bar border-radius ..... 20px  (pill shape)
     URL bar font-size ......... 14px  (Segoe UI Regular)
     URL bar inner padding ..... 0 12px
     URL bar search icon ....... 16×16px
     Toolbar right buttons ..... 30×30px
     Profile avatar ............ 28×28px circle
     Toolbar horizontal pad .... 8px sides

   BOOKMARKS BAR:
     Total height .............. 32px
     Sidebar toggle button ..... 28×28px
     Bookmark item font-size ... 12px  (Segoe UI Regular)
     Bookmark favicon .......... 16×16px
     Bookmark item padding ..... 4px 8px
     Bookmark item gap ......... 2px
     Bookmark item max-width ... 180px (text truncated with ellipsis)
     Bookmark border-radius .... 4px

   CONTENT AREA:
     Fills remaining height below bookmarks bar.
     Default background: #ffffff
     Default padding: 0 (Wave B controls internal padding)

   CHROME COLORS (light theme):
     Tabstrip background ....... #e8e8e8
     Active tab fill ........... #ffffff
     Inactive tab fill ......... transparent (hover: rgba(0,0,0,.04))
     Toolbar background ........ #ffffff
     URL bar fill .............. #f0f0f0  (focused: #ffffff + 1px #0078d4)
     Bookmarks bar background .. #f7f7f7
     Content background ........ #ffffff
     Window chrome shadow ....... 0 8px 36px rgba(0,0,0,.28)
     Text primary .............. #1a1a1a
     Text secondary ............. #616161
     Text placeholder ........... #8c8c8c
     Accent ..................... #0078d4
     Close-btn hover ............ #e81123
     Divider .................... #e0e0e0
   ============================================================================ */

/* ── Reset (scoped to wrapper) ── */
:root { --edge-accent: #0078d4; }

/* ── Theme tokens ── */
.edge-bg {
  --edge-bg: #d4d4d4;
  --edge-chrome: #e8e8e8;
  --edge-surface: #ffffff;
  --edge-surface-hover: rgba(0,0,0,.04);
  --edge-surface-active: rgba(0,0,0,.07);
  --edge-url-fill: #f0f0f0;
  --edge-bm-bg: #f7f7f7;
  --edge-divider: #e0e0e0;
  --edge-text: #1a1a1a;
  --edge-text-sec: #616161;
  --edge-text-placeholder: #8c8c8c;
  --edge-accent: #0078d4;
  --edge-accent-hover: #106ebe;
  --edge-close-hover: #e81123;
  --edge-shadow: 0 8px 36px rgba(0,0,0,.28);
  --edge-tab-radius: 8px;

  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 28px 40px;
  background: var(--edge-bg);
  font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  color: var(--edge-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

/* ── Window frame ── */
.edge-window {
  position: relative;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--edge-chrome);
  border-radius: 8px;
  box-shadow: var(--edge-shadow);
  overflow: hidden;
}

/* ── Tabstrip (36px — integrated titlebar) ── */
.edge-tabstrip {
  display: flex;
  align-items: flex-end;
  flex: 0 0 36px;
  height: 36px;
  padding: 0 0 0 0;
  background: var(--edge-chrome);
  position: relative;
  overflow: visible;
}
.edge-tabstrip-tabs {
  display: flex;
  align-items: flex-end;
  flex: 1 1 auto;
  min-width: 0;
  height: 36px;
  padding: 4px 0 0 8px;
  gap: 2px;
  overflow: hidden;
}

/* ── Individual tab pill ── */
.edge-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 52px;
  max-width: 240px;
  flex: 1 1 200px;
  height: 32px;
  padding: 0 10px;
  background: transparent;
  border-radius: var(--edge-tab-radius) var(--edge-tab-radius) 0 0;
  font-size: 12px;
  color: var(--edge-text);
  cursor: pointer;
  box-sizing: border-box;
  position: relative;
  transition: background .12s;
  border: 0;
}
.edge-tab:hover {
  background: var(--edge-surface-hover);
}
.edge-tab--active {
  background: var(--edge-surface) !important;
  z-index: 2;
}
/* Active tab bottom connector — blends into toolbar below */
.edge-tab--active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--edge-surface);
  z-index: 3;
}
.edge-tab-favicon {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  border-radius: 2px;
}
.edge-tab-favicon svg { width: 16px; height: 16px; }
.edge-tab-favicon img { width: 16px; height: 16px; object-fit: contain; }
.edge-tab-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  line-height: 1.3;
}
.edge-tab-close {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 20px; height: 20px;
  flex: 0 0 20px;
  border-radius: 4px;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text-sec);
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s;
}
.edge-tab-close svg { width: 10px; height: 10px; }
.edge-tab:hover .edge-tab-close,
.edge-tab--active .edge-tab-close { opacity: 1; }
.edge-tab-close:hover { background: var(--edge-surface-active); color: var(--edge-text); }

/* ── New-tab button ── */
.edge-newtab-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 28px; height: 28px;
  flex: 0 0 28px;
  margin: 0 4px 4px 2px;
  border-radius: 4px;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text);
  cursor: pointer;
  align-self: flex-end;
}
.edge-newtab-btn svg { width: 12px; height: 12px; }
.edge-newtab-btn:hover { background: var(--edge-surface-hover); }

/* ── Window controls (right side of tabstrip) ── */
.edge-wincontrols {
  display: flex;
  align-items: stretch;
  flex: 0 0 auto;
  height: 36px;
  margin-left: auto;
}
.edge-winbtn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 46px; height: 36px;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text);
  cursor: pointer;
}
.edge-winbtn svg { width: 12px; height: 12px; }
.edge-winbtn:hover { background: var(--edge-surface-hover); }
.edge-winbtn--close:hover { background: var(--edge-close-hover); color: #fff; }

/* ── Toolbar (46px) ── */
.edge-toolbar {
  display: flex;
  align-items: center;
  flex: 0 0 46px;
  height: 46px;
  padding: 0 8px;
  background: var(--edge-surface);
  border-top: 1px solid var(--edge-divider);
  gap: 4px;
  position: relative;
  z-index: 1;
}

/* Nav buttons group (back, forward, reload, home) */
.edge-nav-group {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
  margin-right: 4px;
}
.edge-nav-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text);
  cursor: pointer;
}
.edge-nav-btn svg { width: 16px; height: 16px; }
.edge-nav-btn:hover { background: var(--edge-surface-hover); }
.edge-nav-btn--disabled { opacity: 0.35; cursor: default; }
.edge-nav-btn--disabled:hover { background: transparent; }

/* ── URL bar (pill) ── */
.edge-urlbar {
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  height: 34px;
  padding: 0 12px;
  background: var(--edge-url-fill);
  border: 1px solid transparent;
  border-radius: 20px;
  gap: 8px;
  cursor: text;
  position: relative;
  transition: background .15s, border-color .15s;
}
.edge-bg[data-url-focused="true"] .edge-urlbar {
  background: var(--edge-surface);
  border-color: var(--edge-accent);
  box-shadow: 0 0 0 1px var(--edge-accent);
}
.edge-urlbar-icon {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 16px; height: 16px;
  flex: 0 0 16px;
  color: var(--edge-text-sec);
}
.edge-urlbar-icon svg { width: 16px; height: 16px; }
.edge-urlbar-lock {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 16px; height: 16px;
  flex: 0 0 16px;
  color: var(--edge-text-sec);
}
.edge-urlbar-lock svg { width: 14px; height: 14px; }
.edge-urlbar-text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 14px;
  color: var(--edge-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.edge-urlbar-text--placeholder { color: var(--edge-text-placeholder); }
/* Progress bar inside URL bar */
.edge-progress {
  position: absolute;
  left: 12px; right: 12px; bottom: 0;
  height: 2px;
  width: 0%;
  background: var(--edge-accent);
  border-radius: 1px;
  opacity: 0;
  transition: none;
}

/* ── Toolbar right actions ── */
.edge-toolbar-right {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 auto;
  margin-left: 4px;
}
.edge-toolbar-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text);
  cursor: pointer;
}
.edge-toolbar-btn svg { width: 16px; height: 16px; }
.edge-toolbar-btn:hover { background: var(--edge-surface-hover); }

/* Profile avatar circle */
.edge-profile {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7e57c2, #3949ab);
  color: #fff;
  font-size: 12px; font-weight: 600;
  flex: 0 0 28px;
  cursor: pointer;
  overflow: hidden;
}
.edge-profile img { width: 28px; height: 28px; object-fit: cover; border-radius: 50%; }

/* Ellipsis menu button */
.edge-menu-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text);
  cursor: pointer;
}
.edge-menu-btn svg { width: 16px; height: 16px; }
.edge-menu-btn:hover { background: var(--edge-surface-hover); }

/* Chat / Copilot button */
.edge-chat-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px 0 6px;
  border-radius: 14px;
  background: transparent;
  border: 1px solid var(--edge-divider);
  color: var(--edge-text);
  font-size: 12px;
  cursor: pointer;
  flex: 0 0 auto;
}
.edge-chat-btn svg { width: 18px; height: 18px; color: var(--edge-accent); }
.edge-chat-btn:hover { background: var(--edge-surface-hover); }

/* ── Bookmarks bar (32px) ── */
.edge-bookmarksbar {
  display: flex;
  align-items: center;
  flex: 0 0 32px;
  height: 32px;
  padding: 0 8px;
  background: var(--edge-bm-bg);
  border-top: 1px solid var(--edge-divider);
  gap: 2px;
  overflow: hidden;
}
.edge-bg[data-show-bookmarks="false"] .edge-bookmarksbar { display: none; }

.edge-bm-sidebar-toggle {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 28px; height: 24px;
  flex: 0 0 28px;
  border-radius: 4px;
  background: transparent;
  border: 0; padding: 0;
  color: var(--edge-text-sec);
  cursor: pointer;
  margin-right: 4px;
}
.edge-bm-sidebar-toggle svg { width: 16px; height: 16px; }
.edge-bm-sidebar-toggle:hover { background: var(--edge-surface-hover); }

.edge-bm-items {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
}

.edge-bm-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 180px;
  height: 24px;
  padding: 0 8px;
  border-radius: 4px;
  background: transparent;
  border: 0;
  color: var(--edge-text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-decoration: none;
  flex: 0 0 auto;
}
.edge-bm-item:hover { background: var(--edge-surface-hover); }
.edge-bm-item-icon {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  display: flex; align-items: center; justify-content: center;
}
.edge-bm-item-icon svg { width: 16px; height: 16px; }
.edge-bm-item-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Content area ── */
.edge-content {
  flex: 1 1 auto;
  min-height: 0;
  background: var(--edge-surface);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.edge-page-body {
  flex: 1 1 auto;
  overflow: auto;
  position: relative;
}

/* ── Global icon styling ── */
.edge-bg svg { fill: currentColor; }
.edge-bg svg[aria-hidden] { pointer-events: none; }
</style>

<!-- ═══════════════════════════════════════════════════════════════════════════
     HTML STRUCTURE — Chrome shell with named slots
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="edge-bg" data-scene-component="EdgeBrowserScene"
     data-show-bookmarks="true"
     data-url-focused="false"
     data-tab-count="1">
  <div class="edge-window">

    <!-- ═══ TABSTRIP (36px — integrated titlebar) ═══ -->
    <div class="edge-tabstrip">
      <div class="edge-tabstrip-tabs" data-slot="tab-list">
        {{{tabListHtml}}}
      </div>

      <!-- New-tab (+) button -->
      <button class="edge-newtab-btn" aria-label="New tab">
        <svg aria-hidden="true"><use href="#edge-icon-plus"/></svg>
      </button>

      <!-- Window controls (min / max / close) -->
      <div class="edge-wincontrols">
        <button class="edge-winbtn" aria-label="Minimize">
          <svg aria-hidden="true"><use href="#edge-icon-minimize"/></svg>
        </button>
        <button class="edge-winbtn" aria-label="Maximize">
          <svg aria-hidden="true"><use href="#edge-icon-maximize"/></svg>
        </button>
        <button class="edge-winbtn edge-winbtn--close" aria-label="Close">
          <svg aria-hidden="true"><use href="#edge-icon-close"/></svg>
        </button>
      </div>
    </div>

    <!-- ═══ TOOLBAR (46px) ═══ -->
    <div class="edge-toolbar">
      <!-- Navigation buttons -->
      <div class="edge-nav-group">
        <button class="edge-nav-btn" aria-label="Back">
          <svg aria-hidden="true"><use href="#edge-icon-back"/></svg>
        </button>
        <button class="edge-nav-btn edge-nav-btn--disabled" aria-label="Forward">
          <svg aria-hidden="true"><use href="#edge-icon-forward"/></svg>
        </button>
        <button class="edge-nav-btn" aria-label="Reload">
          <svg aria-hidden="true"><use href="#edge-icon-reload"/></svg>
        </button>
        <button class="edge-nav-btn" aria-label="Home">
          <svg aria-hidden="true"><use href="#edge-icon-home"/></svg>
        </button>
      </div>

      <!-- URL bar (pill) -->
      <div class="edge-urlbar">
        <span class="edge-urlbar-icon">
          <svg aria-hidden="true"><use href="#edge-icon-search"/></svg>
        </span>
        <span class="edge-urlbar-text edge-urlbar-text--placeholder" data-slot="url">{{urlText}}</span>
        <div class="edge-progress"></div>
      </div>

      <!-- Toolbar right actions -->
      <div class="edge-toolbar-right">
        <button class="edge-toolbar-btn" aria-label="Favorites">
          <svg aria-hidden="true"><use href="#edge-icon-star-outline"/></svg>
        </button>
        <button class="edge-toolbar-btn" aria-label="Collections">
          <svg aria-hidden="true"><use href="#edge-icon-collections"/></svg>
        </button>
        <button class="edge-toolbar-btn" aria-label="Extensions">
          <svg aria-hidden="true"><use href="#edge-icon-extensions"/></svg>
        </button>
        <span class="edge-profile" aria-label="Profile">JD</span>
        <button class="edge-menu-btn" aria-label="Settings and more">
          <svg aria-hidden="true"><use href="#edge-icon-ellipsis-h"/></svg>
        </button>
        <button class="edge-chat-btn" aria-label="Copilot">
          <svg aria-hidden="true"><use href="#edge-icon-copilot"/></svg>
          <span>Chat</span>
        </button>
      </div>
    </div>

    <!-- ═══ BOOKMARKS BAR (32px) ═══ -->
    <div class="edge-bookmarksbar">
      <button class="edge-bm-sidebar-toggle" aria-label="Toggle sidebar">
        <svg aria-hidden="true"><use href="#edge-icon-sidebar"/></svg>
      </button>

      <div class="edge-bm-items" data-slot="bookmarks">
        {{{bookmarksHtml}}}
      </div>
    </div>

    <!-- ═══ CONTENT AREA ═══ -->
    <div class="edge-content">
      <div class="edge-page-body" data-slot="page-content">
        {{{pageContentHtml}}}
      </div>
    </div>

  </div>
</div>
