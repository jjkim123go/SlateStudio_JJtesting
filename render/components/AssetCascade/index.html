<style>
.scene-{{sceneId}} .ac-root{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  background:transparent;
}
.scene-{{sceneId}} .ac-stage{
  position:absolute;
  inset:7% 6%;
}
.scene-{{sceneId}} .ac-card{
  position:absolute;
  width:clamp(180px, 18vw, 320px);
  aspect-ratio:4 / 3;
  border-radius:22px;
  overflow:hidden;
  opacity:0;
  will-change:transform,opacity,filter;
  background:linear-gradient(135deg, rgba(15,23,42,0.96), rgba(30,41,59,0.88));
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:0 26px 50px rgba(15,23,42,0.34);
  transform-origin:center center;
}
.scene-{{sceneId}} .ac-card img,
.scene-{{sceneId}} .ac-placeholder{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.scene-{{sceneId}} .ac-card img{
  object-fit:cover;
}
.scene-{{sceneId}} .ac-placeholder{
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  padding:18px 20px;
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,0.22), transparent 36%),
    linear-gradient(135deg, rgba(59,130,246,0.82), rgba(14,165,233,0.54) 52%, rgba(15,23,42,0.9));
  color:#ffffff;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:clamp(18px,1.6vw,28px);
  font-weight:700;
  letter-spacing:-0.02em;
}
</style>
<div class="ac-root" data-scene-component="AssetCascade"
  data-ac-images="{{images}}"
  data-ac-layout="{{layout}}"
  data-ac-cascade-duration="{{cascadeDuration}}"
  data-ac-hold-duration="{{holdDuration}}"
  data-ac-exit="{{exitOnComplete}}">
  <div class="ac-stage"></div>
</div>
