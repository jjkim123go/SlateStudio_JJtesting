<div class="lt-bar lt-{{side}}" data-scene-component="LowerThird"
  style="position:absolute;left:80px;bottom:120px;padding:20px 32px;background:rgba(0,0,0,0.72);border-left:6px solid {{accentColor}};backdrop-filter:blur(8px);transform:translateX(-120%);min-width:420px;max-width:60%">
  <div class="lt-name" style="margin:0;font-size:36px;font-weight:600;color:#FFFFFF;letter-spacing:-0.01em;line-height:1.1">{{name}}</div>
  <div class="lt-title" style="margin:6px 0 0;font-size:22px;font-weight:400;color:rgba(255,255,255,0.78)">{{title}}</div>
</div>
