<div class="bo-bg" data-scene-component="BrandOutro"
  style="position:absolute;inset:0;background:{{primaryColor}};background:linear-gradient(135deg, rgba(0,0,0,0.5) 0%, {{primaryColor}} 100%)">
  <div class="bo-stack" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:80%">
    <img class="bo-logo" src="{{logoSrc}}" style="display:block;margin:0 auto 24px;max-height:180px;max-width:50%;opacity:0" />
    <h1 class="bo-company" style="margin:0;font-size:56px;font-weight:600;color:#FFFFFF;letter-spacing:-0.02em;opacity:0">{{companyName}}</h1>
    <p class="bo-cta" style="margin:24px 0 0;font-size:28px;font-weight:400;color:rgba(255,255,255,0.85);opacity:0">{{cta}}</p>
    <p class="bo-contact" style="margin:12px 0 0;font-size:20px;font-weight:400;color:rgba(255,255,255,0.6);opacity:0">{{contact}}</p>
  </div>
</div>
