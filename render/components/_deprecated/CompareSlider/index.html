<div class="cs-bg" data-scene-component="CompareSlider"
  style="position:absolute;inset:0;background:linear-gradient(180deg,#0a0f1a 0%,#131b2e 60%,#0f172a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,-apple-system,sans-serif;padding:80px 120px">
  <h2 class="cs-title" style="margin:0 0 48px;font-size:48px;font-weight:700;color:#FFFFFF;letter-spacing:-0.02em;opacity:0">{{title}}</h2>
  <div class="cs-headers" style="display:flex;width:100%;max-width:1100px;gap:24px;margin-bottom:28px;opacity:0">
    <div style="flex:0 0 200px"></div>
    <div class="cs-header-left" style="flex:1;text-align:center;font-size:26px;font-weight:700;color:rgba(239,68,68,0.95);letter-spacing:0.02em">{{leftLabel}}</div>
    <div class="cs-header-right" style="flex:1;text-align:center;font-size:26px;font-weight:700;color:rgba(34,197,94,0.95);letter-spacing:0.02em">{{rightLabel}}</div>
  </div>
  <div class="cs-rows" style="display:flex;flex-direction:column;gap:20px;width:100%;max-width:1100px">
    {{{itemsHtml}}}
  </div>
</div>
