<div class="cp-bg" data-scene-component="CalloutPin"
  style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0f1a 0%,#131b2e 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,sans-serif">
  <img class="cp-base" src="{{baseSrc}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0" onerror="this.style.display='none'"/>
  <div class="cp-vignette" style="position:absolute;inset:0;background:radial-gradient(circle at {{x}}% {{y}}%, transparent 12%, rgba(0,0,0,0.55) 60%);opacity:0;pointer-events:none"></div>
  <div class="cp-pin" style="position:absolute;left:{{x}}%;top:{{y}}%;transform:translate(-50%,-50%);opacity:0;width:48px;height:48px">
    <div class="cp-ring" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:3px solid {{pinColor}};box-shadow:0 0 24px {{pinGlow}}"></div>
    <div class="cp-pulse" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:3px solid {{pinColor}}"></div>
    <div class="cp-dot" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:{{pinColor}};box-shadow:0 0 16px {{pinGlow}}"></div>
  </div>
  <div class="cp-card" style="position:absolute;left:{{labelX}}%;top:{{labelY}}%;transform:translate(-50%,0);background:rgba(15,23,42,0.85);border-left:4px solid {{pinColor}};backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:28px 36px;border-radius:12px;box-shadow:0 24px 48px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.06);max-width:560px;opacity:0">
    <p class="cp-label-title" style="margin:0;font-size:30px;font-weight:700;color:#FFFFFF;line-height:1.3">{{title}}</p>
    <p class="cp-label-detail" style="margin:10px 0 0;font-size:21px;font-weight:400;color:rgba(255,255,255,0.75);line-height:1.5">{{body}}</p>
  </div>
</div>
