<!--
  AuditTrail
  Purpose: Vertical timeline showing "who did what when" for enterprise governance.
  Props consumed: title, eventsHtml, highlightIds, retentionNote, exportRef
  Provenance: proposal lines 489-496, CONTRACT §3.1/§3.3 Pattern B
-->
<style>
.scene-{{sceneId}} .at-root{
  --at-bg:#0f172a;--at-bg-end:#1e293b;
  --at-card-bg:rgba(30,41,59,0.9);--at-card-border:rgba(148,163,184,0.18);
  --at-text:#e2e8f0;--at-muted:#94a3b8;
  --at-accent:#3b82f6;--at-highlight:#f59e0b;
  --at-pass:#22c55e;--at-fail:#ef4444;
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,var(--at-bg) 0%,var(--at-bg-end) 100%);
  color:var(--at-text);padding:56px 80px 40px;overflow:hidden;
}
.scene-{{sceneId}} .at-title{
  margin:0 0 28px;font-size:46px;font-weight:700;
  letter-spacing:-0.02em;opacity:0;color:var(--at-text);
}
.scene-{{sceneId}} .at-title:empty{display:none}
.scene-{{sceneId}} .at-timeline{
  flex:1;position:relative;overflow:hidden;
}
.scene-{{sceneId}} .at-line-svg{
  position:absolute;left:0;top:0;width:80px;height:100%;overflow:visible;
}
.scene-{{sceneId}} .at-timeline-line{
  stroke:var(--at-accent);stroke-width:2;stroke-linecap:round;
}
.scene-{{sceneId}} .at-events{
  display:flex;flex-direction:column;gap:10px;
}
.scene-{{sceneId}} .at-event{
  display:grid;grid-template-columns:80px 1fr;align-items:start;
}
.scene-{{sceneId}} .at-dot-wrap{
  display:flex;justify-content:center;padding-top:16px;position:relative;z-index:1;
}
.scene-{{sceneId}} .at-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--at-accent);
  border:3px solid var(--at-bg);
  box-shadow:0 0 0 2px var(--at-accent);
}
.scene-{{sceneId}} .at-event[data-highlighted="true"] .at-dot{
  background:var(--at-highlight);
  box-shadow:0 0 0 2px var(--at-highlight),0 0 12px rgba(245,158,11,0.4);
}
.scene-{{sceneId}} .at-card{
  padding:12px 18px;background:var(--at-card-bg);
  border:1px solid var(--at-card-border);border-radius:12px;
  display:flex;flex-direction:column;gap:4px;
}
.scene-{{sceneId}} .at-event[data-highlighted="true"] .at-card{
  border-color:var(--at-highlight);
  box-shadow:0 0 16px rgba(245,158,11,0.12);
}
.scene-{{sceneId}} .at-card-head{
  display:flex;align-items:center;gap:10px;
}
.scene-{{sceneId}} .at-ts{
  font-size:13px;color:var(--at-muted);font-variant-numeric:tabular-nums;
}
.scene-{{sceneId}} .at-icon{font-size:15px}
.scene-{{sceneId}} .at-icon:empty{display:none}
.scene-{{sceneId}} .at-card-body{font-size:20px;font-weight:500;line-height:1.35}
.scene-{{sceneId}} .at-actor{color:var(--at-accent);font-weight:600}
.scene-{{sceneId}} .at-target{color:var(--at-text);font-weight:600}
.scene-{{sceneId}} .at-card-meta{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.scene-{{sceneId}} .at-result{
  font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;
  display:inline-flex;align-items:center;gap:4px;
}
.scene-{{sceneId}} .at-result[data-result="success"]{background:rgba(34,197,94,0.15);color:var(--at-pass)}
.scene-{{sceneId}} .at-result[data-result="failure"]{background:rgba(239,68,68,0.15);color:var(--at-fail)}
.scene-{{sceneId}} .at-result:empty{display:none}
.scene-{{sceneId}} .at-corr{
  font-size:11px;color:var(--at-muted);
  font-family:'Cascadia Code',Consolas,monospace;
  padding:2px 8px;border-radius:6px;background:rgba(148,163,184,0.1);
}
.scene-{{sceneId}} .at-corr:empty{display:none}
.scene-{{sceneId}} .at-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:12px;
  border-top:1px solid rgba(148,163,184,0.12);opacity:0;
}
.scene-{{sceneId}} .at-retention{font-size:13px;color:var(--at-muted);font-style:italic}
.scene-{{sceneId}} .at-retention:empty{display:none}
.scene-{{sceneId}} .at-export{
  font-size:12px;color:var(--at-accent);
  font-family:'Cascadia Code',Consolas,monospace;
}
.scene-{{sceneId}} .at-export:empty{display:none}
</style>
<div class="at-root" data-scene-component="AuditTrail">
  <h2 class="at-title">{{title}}</h2>
  <div class="at-timeline">
    <svg class="at-line-svg" xmlns="http://www.w3.org/2000/svg">
      <line class="at-timeline-line" x1="40" y1="0" x2="40" y2="0"/>
    </svg>
    <div class="at-events">
      {{{eventsHtml}}}
    </div>
  </div>
  <div class="at-footer">
    <span class="at-retention">{{retentionNote}}</span>
    <span class="at-export">{{exportRef}}</span>
  </div>
</div>
