<style>
  .scene-{{sceneId}} .sb-root {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #0a0e27;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f8fafc;
  }

  .scene-{{sceneId}} .sb-base {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .scene-{{sceneId}} .sb-layers {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .scene-{{sceneId}} .sb-layer {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    will-change: transform;
    pointer-events: none;
  }
  .scene-{{sceneId}} .sb-layer[data-axis="horizontal"] { height: 100%; }
  .scene-{{sceneId}} .sb-layer[data-axis="vertical"] {
    width: 100%;
    flex-direction: column;
  }

  .scene-{{sceneId}} .sb-tile {
    flex: 0 0 50%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .scene-{{sceneId}} .sb-layer[data-axis="vertical"] .sb-tile {
    width: 100%;
    flex-basis: 50%;
  }

  .scene-{{sceneId}} .sb-noise {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    opacity: 0.04;
    display: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size: 240px 240px;
  }
  .scene-{{sceneId}} .sb-root[data-noise="true"] .sb-noise { display: block; }

  .scene-{{sceneId}} .sb-darken {
    position: absolute;
    inset: 0;
    z-index: 9;
    background: rgba(0, 0, 0, 0.30);
    pointer-events: none;
    display: none;
  }
  .scene-{{sceneId}} .sb-root[data-safe-contrast="true"] .sb-darken { display: block; }

  .scene-{{sceneId}} .sb-foreground {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6% 8%;
    pointer-events: none;
  }
</style>

<div class="sb-root"
     data-scene-component="ScrollingBackground"
     data-direction="{{direction}}"
     data-noise="{{noise}}"
     data-safe-contrast="{{safeContrastMode}}"
     data-loop-sec="{{loopSec}}"
     data-gradient-stops="{{gradientStopsJson}}"
     data-layers="{{layersJson}}">
  <div class="sb-base"></div>
  <div class="sb-layers"></div>
  <div class="sb-noise"></div>
  <div class="sb-darken"></div>
  <div class="sb-foreground">{{{childHtml}}}</div>
  {{{_lottieDataIslands}}}
</div>
