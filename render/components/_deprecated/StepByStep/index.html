<div class="sbs-bg" data-scene-component="StepByStep"
  style="position:absolute;inset:0;background:linear-gradient(180deg,{{backgroundColor}} 0%,{{elevatedSurfaceColor}} 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,-apple-system,sans-serif;padding:80px 120px;color:{{textColor}}">
  <h2 class="sbs-title" style="margin:0 0 56px;font-size:54px;font-weight:700;color:{{textColor}};letter-spacing:-0.02em;opacity:0">{{title}}</h2>
  <div class="sbs-list" style="margin:0;padding:0;max-width:1100px;width:100%;display:flex;flex-direction:column;gap:28px">
    {{{stepsHtml}}}
  </div>
</div>
