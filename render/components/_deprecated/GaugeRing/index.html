<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<div class="gr-root" data-scene-component="GaugeRing"
  style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1023;font-family:Inter,-apple-system,sans-serif">
  <div class="gr-container" style="display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0">
    <div class="gr-ring-wrap" style="position:relative;width:400px;height:400px">
      <svg class="gr-svg" width="400" height="400" viewBox="0 0 400 400" style="display:block">
        <!-- Track ring -->
        <circle class="gr-track" cx="200" cy="200" r="160"
          fill="none" stroke="{{trackColor}}" stroke-width="20"
          stroke-linecap="round" opacity="0"/>
        <!-- Comparison ring (thinner, behind main arc) -->
        <circle class="gr-comparison" cx="200" cy="200" r="160"
          fill="none" stroke="{{accentColor}}" stroke-width="8"
          stroke-linecap="round" opacity="0.25"
          transform="rotate(-90 200 200)"
          data-value="{{comparisonValue}}" data-max="{{maxValue}}"
          stroke-dasharray="1005.31" stroke-dashoffset="1005.31"/>
        <!-- Main fill arc -->
        <circle class="gr-arc" cx="200" cy="200" r="160"
          fill="none" stroke="{{accentColor}}" stroke-width="20"
          stroke-linecap="round"
          transform="rotate(-90 200 200)"
          data-value="{{value}}" data-max="{{maxValue}}"
          stroke-dasharray="1005.31" stroke-dashoffset="1005.31"/>
      </svg>
      <!-- Centered value display — positioned over the SVG ring center -->
      <div class="gr-center" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
        <div style="display:flex;align-items:baseline;gap:4px">
          <span class="gr-number" data-to="{{value}}" style="font-size:96px;font-weight:800;color:#FFFFFF;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums;opacity:0">0</span>
          <span class="gr-suffix" style="font-size:42px;font-weight:700;color:rgba(255,255,255,0.7);opacity:0">{{suffix}}</span>
        </div>
      </div>
    </div>
    <!-- Label below the ring -->
    <p class="gr-label" style="margin:24px 0 0;font-size:32px;font-weight:600;color:rgba(255,255,255,0.85);letter-spacing:0.04em;text-transform:uppercase;opacity:0">{{label}}</p>
    <!-- Comparison subtitle -->
    <p class="gr-subtitle" style="margin:12px 0 0;font-size:22px;font-weight:400;color:rgba(255,255,255,0.45);opacity:0">vs {{comparisonValue}}{{suffix}} {{comparisonLabel}}</p>
  </div>
</div>
