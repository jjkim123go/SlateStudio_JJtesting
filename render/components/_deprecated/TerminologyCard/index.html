<!--
  TerminologyCard — single-term explainer with definition, analogy, example,
  and "do not confuse with" disambiguation chips.
  Provenance: proposal §3.7. Class prefix: tm-. Size: S (~6s default).
  Data-island IDs: tm-doNotConfuse-{{sceneId}}
  Preprocessed props expected from ORCH lane: doNotConfuseWithJson
-->
<style>
.scene-{{sceneId}} .tm-root{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#f8fafc;
  overflow:hidden;
  --tm-accent:#4cc2ff;
  --tm-muted:rgba(248,250,252,0.62);
  --tm-card-bg:rgba(15,23,42,0.78);
  --tm-card-border:rgba(148,163,184,0.18);
}
.scene-{{sceneId}} .tm-card{
  position:relative;
  width:78%;max-width:1280px;
  padding:56px 64px 48px;
  border-radius:28px;
  background:var(--tm-card-bg);
  border:1px solid var(--tm-card-border);
  box-shadow:0 36px 80px rgba(0,0,0,0.45);
  display:flex;flex-direction:column;gap:22px;
}
.scene-{{sceneId}} .tm-icon-wrap{
  position:absolute;top:32px;left:32px;
  width:64px;height:64px;border-radius:14px;
  background:rgba(76,194,255,0.12);
  border:1px solid rgba(76,194,255,0.28);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.scene-{{sceneId}} .tm-icon-wrap[data-empty="1"]{display:none}
.scene-{{sceneId}} .tm-icon-wrap img{
  width:100%;height:100%;object-fit:contain;
}
.scene-{{sceneId}} .tm-header{
  display:flex;align-items:baseline;gap:18px;
  margin-left:0;
  padding-left:0;
}
.scene-{{sceneId}} .tm-root[data-has-icon="1"] .tm-header{padding-left:88px}
.scene-{{sceneId}} .tm-term{
  font-size:72px;font-weight:800;letter-spacing:-0.03em;line-height:1;
  color:#ffffff;
  opacity:0;
  filter:blur(8px);
  will-change:opacity,filter;
}
.scene-{{sceneId}} .tm-pron{
  font-size:24px;font-weight:500;color:var(--tm-muted);
  font-family:'SF Mono','Monaco','Consolas',monospace;
  opacity:0;
  letter-spacing:0.02em;
}
.scene-{{sceneId}} .tm-pron:empty,
.scene-{{sceneId}} .tm-pron[data-empty="1"]{display:none}
.scene-{{sceneId}} .tm-definition{
  font-size:32px;line-height:1.42;color:#e2e8f0;
  font-weight:500;
  opacity:0;
  margin-top:4px;
}
.scene-{{sceneId}} .tm-analogy{
  display:flex;align-items:flex-start;gap:18px;
  padding:18px 22px;
  border-radius:14px;
  background:rgba(76,194,255,0.08);
  border-left:4px solid var(--tm-accent);
  opacity:0;
}
.scene-{{sceneId}} .tm-analogy[data-empty="1"]{display:none}
.scene-{{sceneId}} .tm-analogy-label{
  font-size:13px;font-weight:700;letter-spacing:0.18em;
  color:var(--tm-accent);text-transform:uppercase;
  flex-shrink:0;padding-top:4px;
  font-variant-numeric:tabular-nums;
}
.scene-{{sceneId}} .tm-analogy-text{
  font-size:24px;line-height:1.4;color:#f1f5f9;
}
.scene-{{sceneId}} .tm-example{
  font-style:italic;
  font-size:22px;line-height:1.45;color:var(--tm-muted);
  padding:10px 4px 4px 18px;
  border-left:2px solid rgba(148,163,184,0.22);
  opacity:0;
}
.scene-{{sceneId}} .tm-example[data-empty="1"]{display:none}
.scene-{{sceneId}} .tm-chips{
  display:flex;flex-wrap:wrap;gap:10px 12px;
  margin-top:8px;
}
.scene-{{sceneId}} .tm-chips[data-empty="1"]{display:none}
.scene-{{sceneId}} .tm-chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(148,163,184,0.10);
  border:1px solid rgba(148,163,184,0.22);
  font-size:15px;color:#cbd5e1;
  opacity:0;
  max-width:420px;
}
.scene-{{sceneId}} .tm-chip-x{
  font-size:13px;font-weight:700;color:#f87171;
  letter-spacing:0.04em;
}
.scene-{{sceneId}} .tm-chip-label{font-weight:600;color:#e2e8f0}
.scene-{{sceneId}} .tm-chip-why{
  color:var(--tm-muted);font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:280px;
}
.scene-{{sceneId}} .tm-chip-why:empty{display:none}
.scene-{{sceneId}} .tm-chips-prefix{
  font-size:13px;font-weight:700;letter-spacing:0.18em;
  color:var(--tm-muted);text-transform:uppercase;
  align-self:center;margin-right:4px;opacity:0;
}
</style>
<div class="tm-root"
     data-scene-component="TerminologyCard"
     data-has-icon="{{iconSrc}}">
  <div class="tm-card">
    <div class="tm-icon-wrap">
      <img src="{{iconSrc}}" alt=""/>
    </div>
    <div class="tm-header">
      <div class="tm-term">{{term}}</div>
      <div class="tm-pron">{{pronunciation}}</div>
    </div>
    <div class="tm-definition">{{definition}}</div>
    <div class="tm-analogy">
      <div class="tm-analogy-label">LIKE</div>
      <div class="tm-analogy-text">{{analogy}}</div>
    </div>
    <div class="tm-example">{{contextualExample}}</div>
    <div class="tm-chips">
      <span class="tm-chips-prefix">DON'T CONFUSE WITH</span>
    </div>
  </div>
  <script type="application/json" id="tm-doNotConfuse-{{sceneId}}">{{{doNotConfuseWithJson}}}</script>
</div>
