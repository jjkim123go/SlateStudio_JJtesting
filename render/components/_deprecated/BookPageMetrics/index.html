<style>
.scene-{{sceneId}} .book-page-metrics-root{
  position:absolute;inset:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:64px;background:
    radial-gradient(circle at 14% 18%, rgba(93, 173, 236, 0.28), transparent 34%),
    radial-gradient(circle at 84% 8%, rgba(224, 231, 255, 0.25), transparent 28%),
    linear-gradient(135deg,#060b16 0%,#10192d 52%,#080c18 100%);
  font-family:{{bodyFont}},Inter,-apple-system,sans-serif;
}
.scene-{{sceneId}} .book-page-stage{
  position:relative;width:min(1680px,94vw);height:min(940px,86vh);
  perspective:2200px;transform-style:preserve-3d;
}
.scene-{{sceneId}} .book-page-book{
  position:absolute;inset:0;border-radius:38px;overflow:hidden;
  transform:rotateX(6deg) rotateY(-9deg);
  box-shadow:0 46px 120px rgba(0,0,0,0.58),0 14px 28px rgba(0,0,0,0.34);
  background:linear-gradient(120deg,#2f1f0f 0%,#4f3118 32%,#6f4520 100%);
}
.scene-{{sceneId}} .book-page-book::before{
  content:"";position:absolute;inset:16px 16px 16px 50%;border-radius:26px;
  background:
    linear-gradient(88deg,rgba(108,73,34,0.44),rgba(255,255,255,0.06) 14%,rgba(0,0,0,0.18) 42%,rgba(255,255,255,0.06) 66%,rgba(0,0,0,0.3));
  mix-blend-mode:multiply;pointer-events:none;
}
.scene-{{sceneId}} .book-page-page{
  position:absolute;inset:18px 18px 18px 54px;border-radius:30px;overflow:hidden;
  background:
    radial-gradient(circle at 20% 16%, rgba(255,255,255,0.62), transparent 36%),
    radial-gradient(circle at 78% 74%, rgba(255,255,255,0.22), transparent 38%),
    repeating-linear-gradient(12deg, rgba(80,64,37,0.06) 0 2px, rgba(255,255,255,0.03) 2px 5px),
    linear-gradient(180deg,#f8f1df 0%,#efe2c8 62%,#e3d2b2 100%);
}
.scene-{{sceneId}} .book-page-page::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,0.18),transparent 6%,transparent 94%,rgba(0,0,0,0.14));
}
.scene-{{sceneId}} .book-page-page::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(125,96,58,0.16), inset 0 26px 52px rgba(255,255,255,0.33), inset 0 -20px 42px rgba(80,52,22,0.18);
}
.scene-{{sceneId}} .book-page-art{
  position:absolute;inset:0;background-size:cover;background-position:center center;
  opacity:0.26;mix-blend-mode:multiply;
}
.scene-{{sceneId}} .book-page-content{
  position:relative;display:flex;flex-direction:column;gap:26px;
  padding:64px 78px 70px;height:100%;
}
.scene-{{sceneId}} .book-page-kicker{
  margin:0;font-size:18px;letter-spacing:0.18em;text-transform:uppercase;
  color:#1866b1;font-weight:800;opacity:0;
}
.scene-{{sceneId}} .book-page-title{
  margin:0;max-width:70%;font-family:{{headingFont}},Inter,sans-serif;font-size:64px;
  line-height:1.02;letter-spacing:-0.04em;color:#1f2937;opacity:0;
}
.scene-{{sceneId}} .book-page-body{
  margin:0;max-width:62%;font-size:30px;line-height:1.34;color:#334155;opacity:0;
}
.scene-{{sceneId}} .book-page-overlay{
  position:relative;flex:1;min-height:360px;border-radius:24px;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,0.52),rgba(247,241,226,0.82));
  border:1px solid rgba(123,95,58,0.24);
  box-shadow:0 24px 50px rgba(45,31,15,0.24), inset 0 0 0 1px rgba(255,255,255,0.42);
  transform-origin:center center;
}
.scene-{{sceneId}} .book-page-overlay .mc-card,
.scene-{{sceneId}} .book-page-overlay .metric-stack-root,
.scene-{{sceneId}} .book-page-overlay .dc-root{
  border-radius:24px;overflow:hidden;
}
.scene-{{sceneId}} .book-page-fallback{
  position:absolute;inset:0;padding:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;
}
.scene-{{sceneId}} .book-page-fallback-item{
  display:flex;flex-direction:column;justify-content:center;border-radius:18px;
  background:rgba(15,23,42,0.08);border:1px solid rgba(30,64,175,0.18);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.36);padding:22px 18px;
}
.scene-{{sceneId}} .book-page-fallback-value{
  font-size:48px;font-weight:800;line-height:1;color:#0f172a;letter-spacing:-0.03em;
}
.scene-{{sceneId}} .book-page-fallback-label{
  margin-top:10px;font-size:18px;line-height:1.3;color:#334155;
}
</style>
<div class="book-page-metrics-root" data-scene-component="BookPageMetrics" data-page-image="{{pageImage}}">
  <div class="book-page-stage">
    <div class="book-page-book">
      <div class="book-page-page">
        <div class="book-page-art"></div>
        <div class="book-page-content">
          <p class="book-page-kicker">{{eyebrow}}</p>
          <h2 class="book-page-title">{{title}}</h2>
          <p class="book-page-body">{{body}}</p>
          <div class="book-page-overlay">
            {{{overlayHtml}}}
            {{{metricsFallbackHtml}}}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
