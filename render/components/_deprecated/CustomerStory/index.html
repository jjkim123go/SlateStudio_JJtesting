<!--
  CustomerStory — testimonial + metrics showcase for customer success narratives.
  Props consumed: customerName, industry, quote, attribution (name, title, photoSrc),
                  metrics[] (max 6, each: value, label, unit, deltaPct),
                  logoSrc, industryIconSrc, metricsJson, attributionJson
  Class prefix: cs-
  Provenance: proposal §3.5 lines 340–406, CONTRACT §3.1/§3.3 Pattern B
-->
<style>
.scene-{{sceneId}} .cs-root{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}
/* header row: logo + name + industry */
.scene-{{sceneId}} .cs-header{
  display:flex;align-items:center;gap:20px;
  margin-bottom:36px;opacity:0;
}
.scene-{{sceneId}} .cs-logo{
  width:64px;height:64px;object-fit:contain;flex-shrink:0;
  border-radius:8px;background:rgba(255,255,255,0.06);
}
.scene-{{sceneId}} .cs-logo[src=""]{display:none}
.scene-{{sceneId}} .cs-name{
  margin:0;font-size:36px;font-weight:700;color:#FFFFFF;line-height:1.2;
}
.scene-{{sceneId}} .cs-industry{
  display:inline-flex;align-items:center;gap:8px;
  margin-left:16px;padding:4px 14px;
  font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06);border-radius:999px;
}
.scene-{{sceneId}} .cs-industry:empty{display:none}
.scene-{{sceneId}} .cs-ind-icon{width:18px;height:18px;object-fit:contain}
.scene-{{sceneId}} .cs-ind-icon[src=""]{display:none}
/* quote block */
.scene-{{sceneId}} .cs-quote-wrap{
  position:relative;margin-bottom:32px;padding-left:28px;
  border-left:4px solid rgba(255,255,255,0.15);
  opacity:0;
}
.scene-{{sceneId}} .cs-mark{
  position:absolute;left:-8px;top:-24px;
  font-size:72px;font-weight:700;color:rgba(255,255,255,0.12);
  line-height:1;pointer-events:none;
}
.scene-{{sceneId}} .cs-quote{
  margin:0;font-size:32px;font-weight:400;font-style:italic;
  color:#FFFFFF;line-height:1.45;letter-spacing:-0.01em;
  max-width:1100px;
}
/* attribution */
.scene-{{sceneId}} .cs-attr{
  display:flex;align-items:center;gap:16px;
  margin-bottom:36px;opacity:0;
}
.scene-{{sceneId}} .cs-photo{
  width:56px;height:56px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.08);
}
.scene-{{sceneId}} .cs-photo[src=""]{display:none}
.scene-{{sceneId}} .cs-attr-name{
  margin:0;font-size:22px;font-weight:600;color:#FFFFFF;
}
.scene-{{sceneId}} .cs-attr-title{
  margin:2px 0 0;font-size:16px;font-weight:400;color:rgba(255,255,255,0.6);
}
/* metric chips row */
.scene-{{sceneId}} .cs-metrics{
  display:flex;flex-wrap:wrap;gap:16px;
}
.scene-{{sceneId}} .cs-chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:140px;padding:16px 24px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;opacity:0;
}
.scene-{{sceneId}} .cs-chip-value{
  font-size:36px;font-weight:800;color:#FFFFFF;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.scene-{{sceneId}} .cs-chip-unit{
  font-size:16px;font-weight:600;color:rgba(255,255,255,0.5);margin-left:4px;
}
.scene-{{sceneId}} .cs-chip-label{
  margin:6px 0 0;font-size:14px;font-weight:500;
  color:rgba(255,255,255,0.6);text-align:center;
}
.scene-{{sceneId}} .cs-chip-delta{
  margin:4px 0 0;font-size:13px;font-weight:600;color:#22c55e;
}
.scene-{{sceneId}} .cs-chip-delta[data-negative="true"]{color:#ef4444}
</style>
<div class="cs-root" data-scene-component="CustomerStory">
  <div style="width:82%;max-width:1500px;display:flex;flex-direction:column">
    <!-- header -->
    <div class="cs-header">
      <img class="cs-logo" src="{{logoSrc}}" onerror="this.style.display='none'" alt=""/>
      <h2 class="cs-name">{{customerName}}</h2>
      <span class="cs-industry">
        <img class="cs-ind-icon" src="{{industryIconSrc}}" onerror="this.style.display='none'" alt=""/>
        {{industry}}
      </span>
    </div>
    <!-- quote -->
    <div class="cs-quote-wrap">
      <span class="cs-mark">&ldquo;</span>
      <blockquote class="cs-quote">{{quote}}</blockquote>
    </div>
    <!-- attribution -->
    <div class="cs-attr">
      <img class="cs-photo" src="{{attribution.photoSrc}}" onerror="this.style.display='none'" alt=""/>
      <div>
        <p class="cs-attr-name">{{attribution.name}}</p>
        <p class="cs-attr-title">{{attribution.title}}</p>
      </div>
    </div>
    <!-- metrics (built by animation.js from data-island) -->
    <div class="cs-metrics"></div>
  </div>
  <!-- data island for metrics -->
  <script type="application/json" id="cs-data-{{sceneId}}">{{{metricsJson}}}</script>
</div>
