<!--
  ProgressBar — Multi-section progress indicator with three style variants.
  Props consumed: sections, currentSectionId, completionPct, style,
                  showNumbers, milestones
  Data-island IDs: pg-sections-{{sceneId}},
                   pg-milestones-{{sceneId}}
  Preprocessed props: sectionsJson, milestonesJson
  Class prefix: pg-
  Provenance: proposal §3.7, PR 6 Lane C (Education + Event pack)
  Styles: topbar (default) | sidebar | segmented
-->
<style>
.scene-{{sceneId}} .pg-root {
  position: absolute;
  inset: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

/* ── Topbar layout ─────────────────────────────────────────────────────── */
.scene-{{sceneId}} .pg-root[data-style="topbar"] .pg-wrap {
  position: absolute;
  top: 32px;
  left: 4%;
  right: 4%;
  height: 56px;
}

/* ── Sidebar layout ────────────────────────────────────────────────────── */
.scene-{{sceneId}} .pg-root[data-style="sidebar"] .pg-wrap {
  position: absolute;
  top: 5%;
  bottom: 5%;
  left: 24px;
  width: 260px;
}

/* ── Segmented layout ──────────────────────────────────────────────────── */
.scene-{{sceneId}} .pg-root[data-style="segmented"] .pg-wrap {
  position: absolute;
  top: 50%;
  left: 5%;
  right: 5%;
  transform: translateY(-50%);
  height: 180px;
}

.scene-{{sceneId}} .pg-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
  opacity: 0;
}

/* ── SVG text styles ───────────────────────────────────────────────────── */
.scene-{{sceneId}} .pg-seg-rect {
  transition: none;
}

.scene-{{sceneId}} .pg-seg-complete {
  fill: rgba(34, 197, 94, 0.35);
}

.scene-{{sceneId}} .pg-seg-current {
  fill: rgba(59, 130, 246, 0.45);
}

.scene-{{sceneId}} .pg-seg-incomplete {
  fill: rgba(148, 163, 184, 0.12);
}

.scene-{{sceneId}} .pg-seg-border {
  fill: none;
  stroke: rgba(148, 163, 184, 0.18);
  stroke-width: 1.5;
}

.scene-{{sceneId}} .pg-fill-bar {
  fill: #3b82f6;
  opacity: 0.85;
}

.scene-{{sceneId}} .pg-tick-line {
  stroke: rgba(148, 163, 184, 0.3);
  stroke-width: 1.5;
}

.scene-{{sceneId}} .pg-label-text {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  font-weight: 600;
  fill: rgba(255, 255, 255, 0.6);
}

.scene-{{sceneId}} .pg-label-current {
  fill: rgba(255, 255, 255, 0.95);
  font-weight: 700;
}

.scene-{{sceneId}} .pg-number-text {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 28px;
  font-weight: 800;
  fill: rgba(255, 255, 255, 0.85);
  font-variant-numeric: tabular-nums;
}

.scene-{{sceneId}} .pg-milestone-group {
  opacity: 0;
}

.scene-{{sceneId}} .pg-milestone-diamond {
  fill: #fbbf24;
  stroke: #0f172a;
  stroke-width: 2;
}

.scene-{{sceneId}} .pg-milestone-text {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  font-weight: 600;
  fill: #fbbf24;
}

.scene-{{sceneId}} .pg-pulse-ring {
  fill: none;
  stroke: #3b82f6;
  stroke-width: 2;
  opacity: 0;
}

/* ── Sidebar-specific label column ─────────────────────────────────────── */
.scene-{{sceneId}} .pg-sidebar-label {
  font-size: 15px;
}

/* ── Segmented chevron override ────────────────────────────────────────── */
.scene-{{sceneId}} .pg-chevron {
  stroke: rgba(148, 163, 184, 0.2);
  stroke-width: 2;
  stroke-linejoin: round;
}
</style>

<div class="pg-root" data-scene-component="ProgressBar"
  data-current-section-id="{{currentSectionId}}"
  data-completion-pct="{{completionPct}}"
  data-style="{{style}}"
  data-show-numbers="{{showNumbers}}">
  <div class="pg-wrap">
    <svg class="pg-svg" id="pg-svg-{{sceneId}}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="pg-fill-grad-{{sceneId}}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>
        <linearGradient id="pg-fill-grad-v-{{sceneId}}" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <script type="application/json" id="pg-sections-{{sceneId}}">{{{sectionsJson}}}</script>
  <script type="application/json" id="pg-milestones-{{sceneId}}">{{{milestonesJson}}}</script>
</div>
