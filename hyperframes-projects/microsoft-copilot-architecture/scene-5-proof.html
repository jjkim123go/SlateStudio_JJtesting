<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><style>
:root{--ink:#182230;--muted:#667085;--blue:#185abd;--green:#16834b;--red:#c64040;--line:#b8c4d2}*{box-sizing:border-box}html,body{width:1920px;height:1080px;margin:0;overflow:hidden;font-family:"Segoe UI",sans-serif;letter-spacing:0}#scene{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(115deg,#f8fafd,#edf3fa)}.grid{position:absolute;inset:80px;background-image:linear-gradient(rgba(57,77,104,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(57,77,104,.05) 1px,transparent 1px);background-size:32px 32px}.boundary{position:absolute;left:96px;top:112px;width:1464px;height:824px;border:5px solid var(--blue);border-radius:40px;background:rgba(255,255,255,.48);box-shadow:inset 0 0 0 12px rgba(24,90,189,.05)}.boundary-label{position:absolute;left:48px;top:34px;display:flex;align-items:center;gap:14px;color:var(--blue);font-size:29px;font-weight:750}.shield{width:34px;height:39px;border:3px solid var(--blue);border-radius:12px 12px 18px 18px;position:relative}.shield:after{content:"✓";position:absolute;inset:3px;display:grid;place-items:center;font-size:20px}.path{position:absolute;left:72px;right:72px;top:256px;height:310px;display:grid;grid-template-columns:280px 280px 280px 280px;align-items:center;justify-content:space-between}.node{position:relative;z-index:2;height:176px;display:grid;place-items:center;border:2px solid #ccd6e2;border-radius:7px;background:#fff;box-shadow:0 14px 34px rgba(24,34,48,.08);color:var(--ink);font-size:29px;font-weight:700;text-align:center}.node.green{border-color:rgba(22,131,75,.5)}.lock{position:absolute;left:50%;top:26px;width:34px;height:30px;transform:translateX(-50%);border:3px solid var(--green);border-radius:4px}.lock:before{content:"";position:absolute;left:6px;top:-19px;width:16px;height:17px;border:3px solid var(--green);border-bottom:0;border-radius:10px 10px 0 0}.node span{margin-top:38px}.route{position:absolute;left:190px;right:190px;top:405px;height:10px;border-radius:5px;background:v const duration=14.5,scene=document.getElementById('scene'),boundary=scene.querySelector('.boundary'),label=scene.querySelector('.boundary-label'),nodes=[...scene.querySelectorAll('.node')],route=scene.querySelector('.route'),signal=scene.querySelector('.signal'),encrypted=scene.querySelector('.encrypted'),training=scene.querySelector('.training'),disconnect=scene.querySelector('.disconnect'),clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>1-Math.pow(1-clamp(v),3),reveal=(el,t,s,d=.45,x=18)=>{const p=ease((t-s)/d);el.style.opacity=p;el.style.transform=`translateX(${(1-p)*x}px)`};function render(t){const slide=Math.pow(clamp((t-(duration-.7))/.7),3);scene.style.transform=`translateX(${1920*slide}px)`;reveal(boundary,t,.4,.65,18);reveal(label,t,1.2,.4,12);nodes.forEach((el,i)=>reveal(el,t,2+i*.7,.45,14));const routeP=ease((t-4.4)/1.1);route.style.opacity=routeP;route.style.transform=`scaleX(${routeP})`;route.style.transformOrigin='left center';const travel=ease((t-5.2)/3.4);signal.style.opacity=clamp((t-5.2)/.2);signal.style.transform=`translateX(${930*travel}px)`;reveal(encrypted,t,7,.45,12);reveal(training,t,9.2,.6,18);disconnect.textContent='×';disconnect.style.cssText='position:absolute;left:50%;right:auto;bottom:20px;width:64px;height:64px;transform:translateX(-50%);background:transparent;color:#c64040;font-size:72px;font-weight:500;line-height:54px;text-align:center'}window.__timelines=window.__timelines||{};window.__timelines['copilot-protection-direct']={duration:()=>duration,seek:render,time:render,pause:()=>{}};render(0);
