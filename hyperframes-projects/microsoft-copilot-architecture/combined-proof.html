<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #eef3f8; }
    #scene { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0; }
  </style>
</head>
<body>
  <div id="scene" data-composition-id="copilot-architecture-combined" data-start="0" data-width="1920" data-height="1080">
    <video id="combined-video-2" data-composition-id="combined-video-2" data-start="0" data-end="12" data-duration="12" data-track-index="1" src="scene-2-proof-seek.mp4" muted playsinline preload="auto"></video>
    <video id="combined-video-3" data-composition-id="combined-video-3" data-start="12" data-end="26" data-duration="14" data-track-index="2" src="scene-3-proof-seek.mp4" muted playsinline preload="auto"></video>
    <video id="combined-video-4" data-composition-id="combined-video-4" data-start="26" data-end="38" data-duration="12" data-track-index="3" src="scene-4-proof-seek.mp4" muted playsinline preload="auto"></video>
    <video id="combined-video-5" data-composition-id="combined-video-5" data-start="38" data-end="52.5" data-duration="14.5" data-track-index="4" src="scene-5-proof-seek.mp4" muted playsinline preload="auto"></video>
    <video id="combined-video-6" data-composition-id="combined-video-6" data-start="52.5" data-end="67" data-duration="14.5" data-track-index="5" src="scene-6-proof-seek.mp4" muted playsinline preload="auto"></video>
    <video id="combined-video-7" data-composition-id="combined-video-7" data-start="67" data-end="69.533333" data-duration="2.533333" data-track-index="6" src="scene-7-endcard-seek.mp4" muted playsinline preload="auto"></video>
  </div>
  <audio id="combined-vo-2" data-composition-id="combined-vo-2" data-start="0" data-duration="12" data-media-start="0" data-track-index="11" src="vo/scene-2.wav"></audio>
  <audio id="combined-vo-3" data-composition-id="combined-vo-3" data-start="12" data-duration="14" data-media-start="0" data-track-index="12" src="vo/scene-3.wav"></audio>
  <audio id="combined-vo-4" data-composition-id="combined-vo-4" data-start="26" data-duration="12" data-media-start="0" data-track-index="13" src="vo/scene-4.wav"></audio>
  <audio id="combined-vo-5" data-composition-id="combined-vo-5" data-start="38" data-duration="14.5" data-media-start="0" data-track-index="14" src="vo/scene-5.wav"></audio>
  <audio id="combined-vo-6" data-composition-id="combined-vo-6" data-start="52.5" data-duration="14.5" data-media-start="0" data-track-index="15" src="vo/scene-6.wav"></audio>
  <script>
    const durations = [12, 14, 12, 14.5, 14.5, 2.533333];
    const starts = durations.map((_, index) => durations.slice(0, index).reduce((sum, value) => sum + value, 0));
    const duration = durations.reduce((sum, value) => sum + value, 0);
    const videos = [...document.querySelectorAll('video')];
    const render = time => {
      let activeIndex = durations.length - 1;
      for (let index = 0; index < durations.length; index += 1) {
        if (time < starts[index] + durations[index]) {
          activeIndex = index;
          break;
        }
      }
      videos.forEach((video, index) => {
        video.muted = true;
        video.volume = 0;
        video.style.opacity = index === activeIndex ? 1 : 0;
        video.pause();
      });
    };
    window.__timelines = window.__timelines || {};
    window.__timelines['copilot-architecture-combined'] = { duration: () => duration, seek: render, time: render, pause: () => videos.forEach(video => video.pause()) };
    render(0);
  </script>
</body>
</html>
