<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #f7f4ea; }
    #scene, video { width: 1920px; height: 1080px; }
    #scene { position: relative; overflow: hidden; }
    video { display: block; object-fit: cover; }
  </style>
</head>
<body>
  <div id="scene" data-composition-id="copilot-endcard-direct" data-start="0" data-width="1920" data-height="1080">
    <video id="endcard" src="M365-Copilot-endcard-type-2s-16-9-muted-review.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    const duration = 2.5025;
    const video = document.getElementById('endcard');
    const render = time => {
      video.muted = true;
      video.volume = 0;
      video.currentTime = Math.max(0, Math.min(duration - .001, time));
      video.pause();
    };
    window.__timelines = window.__timelines || {};
    window.__timelines['copilot-endcard-direct'] = { duration: () => duration, seek: render, time: render, pause: () => video.pause() };
    render(0);
  </script>
</body>
</html>
