const duration=14.5,scene=document.getElementById('scene'),nodes=[...scene.querySelectorAll('.node')],gates=[...scene.querySelectorAll('.gate')],gateLines=[...scene.querySelectorAll('.gate-line')],route=scene.querySelector('.route'),signal=scene.querySelector('.signal'),verified=scene.querySelector('.verified'),clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>1-Math.pow(1-clamp(v),3),reveal=(el,t,s,d=.45,y=18)=>{const p=ease((t-s)/d);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*y}px)`},colors=['#185abd','#008272','#bd7b00','#16834b'],fills=['#edf5ff','#e9f8f5','#fff7e6','#edf8f1'],bounceTimes=[3.5,4.9,6,7],bounceHeights=[150,112,82];function render(t){const slide=Math.pow(clamp((t-(duration-.7))/.7),3);scene.style.transform=`translateX(${1920*slide}px)`;nodes.forEach((el,i)=>{reveal(el,t,.5+i*.55,.45,14);el.style.zIndex=3});const routeP=ease((t-2.8)/1);route.style.opacity=routeP;route.style.transform=`scaleX(${routeP})`;route.style.transformOrigin='left center';let segment=bounceTimes.findIndex((end,i)=>i>0&&t<=end)-1;if(segment<0)segment=t<bounceTimes[0]?0:2;const local=clamp((t-bounceTimes[segment])/(bounceTimes[segment+1]-bounceTimes[segment])),stage=segment+local,travel=stage/3,ballIndex=Math.min(3,Math.floor(stage+.5));const consumed=ease((t-7.15)/.35);signal.style.left='140px';signal.style.zIndex=2;signal.style.opacity=Math.min(clamp((t-3.5)/.2),1-consumed);signal.style.transform=`translate(${1408*travel}px,${-bounceHeights[segment]*4*local*(1-local)}px)`;signal.style.borderColor=colors[ballIndex];nodes.forEach((node,i)=>{const proximity=1-clamp(Math.abs(stage-i)/.42);node.style.borderColor=proximity>0?colors[i]:'#ccd6e2';node.style.borderWidth=proximity>0?'5px':'2px';node.style.background=proximity>0?fills[i]:'#fff';node.style.boxShadow=proximity>0?`0 0 0 10px ${colors[i]}20,0 16px 38px rgba(24,34,48,.09)`:'0 16px 38px rgba(24,34,48,.09)'});gates.forEach((el,i)=>reveal(el,t,7.2+i*.55,.5,-18));gateLines.forEach((el,i)=>{const p=ease((t-(7.9+i*.55))/.55)
