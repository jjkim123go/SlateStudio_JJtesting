<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <style>
    :root { --unit: 32px; --safe: 80px; --ink: #182230; --muted: #667085; --blue: #185abd; --green: #16834b; --line: #b8c4d2; }
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #f5f8fc; font-family: "Segoe UI", sans-serif; letter-spacing: 0; }
    #scene { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: linear-gradient(115deg, #f8fafd 0%, #edf3fa 100%); }
    .grid { position: absolute; inset: var(--safe); background-image: linear-gradient(rgba(57,77,104,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(57,77,104,.05) 1px, transparent 1px); background-size: var(--unit) var(--unit); }
    .prompt, .output, .hub, .source { position: absolute; background: rgba(255,255,255,.97); border-radius: 6px; box-shadow: 0 18px 44px rgba(24,34,48,.1); }
    .prompt { left: 80px; top: 128px; width: 920px; height: 720px; overflow: hidden; border: 2px solid #c9d3df; }
    .word-titlebar { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #e9f0ff; border-bottom: 1px solid #c9d7f0; color: #334155; font-size: 24px; font-weight: 650; }
    .word-mark { width: 38px; height: 38px; object-fit: contain; }
    .window-name { color: #64748b; font-weight: 500; }
    .ribbon { height: 62px; display: flex; align-items: center; gap: 36px; padding: 0 28px; border-bottom: 1px solid #e2e7ee; color: #4b5563; font-size: 22px; }
    .ribbon-active { height: 62px; display: flex; align-items: center; color: var(--blue); border-bottom: 3px solid var(--blue); font-weight: 700; }
    .workspace { position: absolute; inset: 126px 0 0; display: grid; grid-template-columns: 1fr 390px; background: #f2f4f7; }
    .document { margin: 36px 28px 36px 40px; padding: 48px 42px; background: #fff; box-shadow: 0 8px 24px rgba(40,52,68,.08); }
    .doc-line { height: 12px; margin-bottom: 22px; border-radius: 3px; background: #d8dee7; }
    .doc-line.strong { width: 64%; height: 18px; margin-bottom: 34px; background: #8ea5c8; }
    .doc-line.short { width: 70%; }
    .copilot { position: relative; padding: 28px 24px; background: #fff; border-left: 1px solid #d9e0e9; }
    .copilot-head { display: flex; align-items: center; gap: 14px; color: #243047; font-size: 27px; font-weight: 750; }
    .copilot-mark { width: 40px; height: 36px; object-fit: contain; }
    .copilot-copy { margin-top: 34px; color: var(--muted); font-size: 21px; line-height: 1.45; }
    .composer { position: absolute; left: 24px; right: 24px; bottom: 28px; min-height: 148px; padding: 22px 56px 22px 22px; border: 2px solid rgba(24,90,189,.6); border-radius: 7px; background: #fff; color: var(--ink); font-size: 27px; line-height: 1.3; font-weight: 650; box-shadow: 0 10px 26px rgba(24,90,189,.1); }
    .send { position: absolute; right: 14px; bottom: 14px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); color: #fff; font-size: 24px; font-weight: 700; }
    .hub { left: 1080px; top: 128px; width: 760px; height: 560px; padding: 32px; border: 2px solid rgba(24,90,189,.28); box-shadow: 0 18px 44px rgba(24,34,48,.08); }
    .source { width: 320px; height: 156px; display: flex; align-items: center; gap: 22px; padding: 0 28px; border: 2px solid #d0d8e3; color: var(--ink); font-size: 31px; font-weight: 650; box-shadow: none; }
    .icon-box { width: 68px; height: 68px; display: grid; place-items: center; flex: 0 0 auto; border: 2px solid currentColor; border-radius: 6px; background: #fff; }
    .source svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .files { left: 32px; top: 32px; color: #1769e0; } .email { right: 32px; top: 32px; color: #d14747; } .chats { left: 32px; top: 220px; color: #6b5ce7; } .meetings { right: 32px; top: 220px; color: #16834b; }
    .source span:last-child { color: var(--ink); }
    .hub-core { position: absolute; left: 234px; bottom: 26px; width: 292px; height: 72px; display: flex; align-items: center; justify-content: center; gap: 12px; border: 2px solid #aebbd0; border-radius: 6px; background: #f8fafc; color: #475467; font-size: 25px; font-weight: 700; }
    .hub-core::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
    .permitted { position: absolute; right: 32px; bottom: 34px; z-index: 2; display: flex; align-items: center; gap: 9px; color: var(--green); font-size: 22px; font-weight: 700; }
    .check { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: white; font-size: 19px; }
    .output { left: 1220px; top: 784px; width: 480px; height: 136px; display: grid; place-items: center; padding: 28px; border: 3px solid rgba(22,131,75,.5); color: var(--ink); font-size: 38px; font-weight: 750; text-align: center; }
    svg.flow { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
    .route { fill: none; stroke: var(--blue); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .signal { fill: white; stroke: var(--blue); stroke-width: 8; }
  </style>
</head>
<body>
  <div id="scene" data-composition-id="copilot-grounding-direct" data-start="0" data-width="1920" data-height="1080">
    <div class="grid"></div>
    <svg class="flow" aria-hidden="true">
      <path id="route-in" class="route" d="M1000 604 C1038 604 1048 584 1080 584" pathLength="1"/>
      <path id="route-out" class="route" d="M1460 688 V784" pathLength="1"/>
      <circle id="signal-in" class="signal" r="15" cx="1000" cy="604"/>
      <circle id="signal-out" class="signal" r="15" cx="1460" cy="688"/>
    </svg>
    <div class="prompt">
      <div class="word-titlebar"><img class="word-mark" src="assets/official/word-current-article.png" alt=""><span>Project brief.docx</span><span class="window-name">Word</span></div>
      <div class="ribbon"><span class="ribbon-active">Home</span><span>Insert</span><span>Layout</span><span>Review</span></div>
      <div class="workspace">
        <div class="document"><div class="doc-line strong"></div><div class="doc-line"></div><div class="doc-line"></div><div class="doc-line short"></div><div class="doc-line"></div><div class="doc-line short"></div></div>
        <div class="copilot"><div class="copilot-head"><img class="copilot-mark" src="assets/official/copilot-mark.png" alt=""><span>Copilot</span></div><div class="copilot-copy">Ask about this document or your work.</div><div class="composer">Summarize this project<span class="send">↑</span></div></div>
      </div>
    </div>
    <div class="hub">
      <div class="source files"><span class="icon-box"><svg viewBox="0 0 24 24"><path d="M4 4h6l2 3h8v13H4z"/><path d="M8 12h8M8 16h6"/></svg></span><span>Files</span></div>
      <div class="source email"><span class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><span>Email</span></div>
      <div class="source chats"><span class="icon-box"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span><span>Chats</span></div>
      <div class="source meetings"><span class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><circle cx="12" cy="15" r="2"/></svg></span><span>Meetings</span></div>
      <div class="hub-core">Microsoft Graph</div>
      <div class="permitted"><span class="check">✓</span><span>Permitted</span></div>
    </div>
    <div class="output">Grounded prompt</div>
  </div>
  <script>
    const duration = 12;
    const scene = document.getElementById('scene');
    const prompt = scene.querySelector('.prompt');
    const hub = scene.querySelector('.hub');
    const sources = [...scene.querySelectorAll('.source')];
    const permitted = scene.querySelector('.permitted');
    const output = scene.querySelector('.output');
    const routeIn = document.getElementById('route-in');
    const routeOut = document.getElementById('route-out');
    const signalIn = document.getElementById('signal-in');
    const signalOut = document.getElementById('signal-out');
    const clamp = value => Math.max(0, Math.min(1, value));
    const ease = value => 1 - Math.pow(1 - clamp(value), 3);
    const reveal = (element, time, start, span = .45, distance = 18) => {
      const progress = ease((time - start) / span);
      element.style.opacity = progress;
      element.style.transform = `translateX(${(1 - progress) * distance}px)`;
    };
    const draw = (path, time, start, span) => { path.style.strokeDasharray = '1'; path.style.strokeDashoffset = 1 - ease((time - start) / span); };
    const render = time => {
      const slide = Math.pow(clamp((time - (duration - .7)) / .7), 3);
      scene.style.transform = `translateX(${1920 * slide}px)`;
      reveal(prompt, time, .4, .55, -18);
      reveal(hub, time, 2.0, .55, 18);
      sources.forEach((source, index) => reveal(source, time, 3.0 + index * .38, .4, 14));
      reveal(permitted, time, 5.0, .35, 12);
      draw(routeIn, time, 6.0, .8);
      const inProgress = ease((time - 6.0) / .8); signalIn.style.opacity = clamp((time - 6.0) / .15); signalIn.setAttribute('cx', 1000 + 80 * inProgress); signalIn.setAttribute('cy', 604 - 20 * inProgress);
      draw(routeOut, time, 8.0, .9);
      const outProgress = ease((time - 8.0) / .9); signalOut.style.opacity = clamp((time - 8.0) / .15); signalOut.setAttribute('cy', 688 + 96 * outProgress);
      reveal(output, time, 8.55, .5, 18);
    };
    window.__timelines = window.__timelines || {};
    window.__timelines['copilot-grounding-direct'] = { duration: () => duration, seek: render, time: render, pause: () => {} };
    render(0);
  </script>
</body>
</html>
